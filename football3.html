/* ============================================================
   SMALL RENDER HELPERS
   ============================================================ */
/* How well you can read a player you do not own. Your own squad you know
   exactly; everyone else is filtered through your scouting network, which
   starts small and can be bought upward half a star at a time. */
const myScouting = () => (S.scouting && S.scouting[S.myClub]!==undefined) ? S.scouting[S.myClub] : 1;

/* Scouting is a chance of finding anything out at all, and then a margin of
   error on what you find. Half a star turns up a report on a quarter of the
   players you look at, and even then only to within five points; five stars
   reads everyone exactly. The roll is fixed per player per level, so a report
   does not flicker every time the list redraws — but it does change the moment
   you pay for better scouts. */
/* Anchors at each whole star; everything in between is interpolated, so half
   a star is a real upgrade rather than a decoration. Before this a 2.5-star
   network behaved exactly like a 2-star one. */
const SCOUT_ANCHORS = [
  { star:0, chance:0.25, band:5, ratingChance:0.80, ratingBand:3 },
  { star:1, chance:0.50, band:5, ratingChance:0.90, ratingBand:2 },
  { star:2, chance:0.70, band:4, ratingChance:0.95, ratingBand:1.5 },
  { star:3, chance:0.85, band:3, ratingChance:0.98, ratingBand:1 },
  { star:4, chance:0.95, band:1, ratingChance:1.00, ratingBand:0.5 },
  { star:5, chance:1.00, band:0, ratingChance:1.00, ratingBand:0 },
];
function scoutLevelInfo(sc){
  const lvl = clamp(sc, 0, 5);
  const lo = SCOUT_ANCHORS[Math.min(4, Math.floor(lvl))];
  const hi = SCOUT_ANCHORS[Math.min(5, Math.floor(lvl) + 1)];
  const t = lvl - lo.star;
  const mix = (a, b) => a + (b - a) * t;
  return {
    star: lvl,
    chance: mix(lo.chance, hi.chance),
    band: Math.max(0, Math.round(mix(lo.band, hi.band))),
    ratingChance: mix(lo.ratingChance, hi.ratingChance),
    ratingBand: Math.max(0, Math.round(mix(lo.ratingBand, hi.ratingBand))),
  };
}
// Current ability is far easier to judge than a ceiling — you can watch him
// play. So ratings are hidden much more rarely, and never by much.
function scoutRating(p){
  if(p.club===S.myClub) return { known:true, band:0 };
  const t = scoutLevelInfo(myScouting());
  if(unit(p.id, 700+Math.round(myScouting()*2)) > t.ratingChance) return { known:false };
  return { known:true, band:t.ratingBand };
}
function ratingLabel(p){
  const r=ratingOf(p), rep=scoutRating(p);
  if(!rep.known) return '<span class="muted">ovr ?</span>';
  if(rep.band===0) return "ovr "+r;
  return "ovr "+(r-rep.band)+"-"+(r+rep.band);
}
function scoutReport(p){
  if(p.club===S.myClub) return { known:true, band:0 };
  const sc = myScouting();
  const t = scoutLevelInfo(sc);
  if(unit(p.id, 900+Math.round(sc*2)) > t.chance) return { known:false };
  return { known:true, band:t.band };
}
// The ceiling as your scouts currently report it, or null if there is nothing
// worth showing.
function potentialLabel(p){
  const r = ratingOf(p), pot = p.pot||r;
  if(p.club===S.myClub) return pot>r ? "pot "+pot : null;
  const rep = scoutReport(p);
  if(!rep.known) return '<span class="muted">pot ?</span>';
  if(rep.band===0) return pot>r ? "pot "+pot : null;
  const lo = Math.max(r, pot-rep.band), hi = Math.min(95, pot+rep.band);
  if(hi<=r) return null;
  return "pot "+lo+"-"+hi;
}

function viewLineup(){

  const active=S.activeSlot;
  const activeDef=active?slots.find((s)=>s.id===active):null;
  const used=new Set(Object.values(cs.slots).filter((v)=>v!=null));
  const lineup=slots.map((s)=>({slotPos:s.pos,player:byId.get(cs.slots[s.id])})).filter((x)=>x.player);
  const prev=statsFromLineup(lineup);
  const ovr=lineup.length?round1(lineup.reduce((a,x)=>a+effRating(x.player,x.slotPos),0)/lineup.length):0;

  const discs=slots.map((s)=>{
    const p=cs.slots[s.id]!=null?byId.get(cs.slots[s.id]):null;

    return '<button class="slot'+(p?" filled":"")+(active===s.id?" active":"")+'" style="left:'+s.x+'%;top:'+s.y+'%" data-act="slot:'+s.id+'">'

  else if(S.lineSort==="pot") list.sort((a,b)=>(b.pot||0)-(a.pot||0));
  else if(S.lineSort==="value") list.sort((a,b)=>marketValue(b)-marketValue(a));

  const rows=list.map((p)=>{

      +'<button class="nm" style="display:flex;align-items:center;gap:8px;flex:1;min-width:0" data-act="'+(activeDef?"assign:"+p.id:"show:"+p.id)+'">'
      +'<span class="pos">'+p.pos+'</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.name)+'</span>'
      +'<span class="muted tiny">'+p.age+'y</span>'
      +(used.has(p.id)&&!inSlot?'<span class="sky tiny">&middot; on pitch</span>':"")+'</button>'
      +'<button style="display:flex;align-items:center;gap:6px" data-act="show:'+p.id+'">'
      +(activeDef&&fam<1?'<span class="tiny" style="color:'+(fam>=0.95?"var(--sage)":"var(--clay)")+'">'+Math.round(fam*100)+'%</span>':"")
      +'<span class="rt" style="color:'+ratingColor(eff)+'">'+eff+'</span>'
      +(activeDef&&eff!==nat?'<span class="tiny muted" style="width:24px">('+nat+')</span>':"")

  return '<div class="row" style="margin-bottom:10px">'
    + Object.keys(FORMATIONS).map((f)=>pill(f, cs.formation===f, "form:"+f)).join("")

    + '<div class="lineup">'

    + '<div class="mark" style="inset:12px;border-radius:3px"></div>'

    + '<div class="mark" style="width:22%;aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%"></div>'
    + discs + '</div>'
    + '<div class="row" style="justify-content:center">'+statBox("ATT",prev.att||"–")+statBox("MID",prev.mid||"–")

    + '<div class="mono tiny" style="text-align:center;color:'+(lineup.length===11?"var(--amber)":"var(--sage)")+'">'
    + lineup.length+'/11 selected'+(lineup.length<7?" — need 7+":"")+'</div>'

    + (activeDef?"PICK YOUR "+activeDef.pos:"TAP A SHIRT TO PICK")+'</span><div class="spacer"></div>'
    + '<select data-act="linesort">'+['fit','rating','pot','age','value'].map((k)=>'<option value="'+k+'"'+(S.lineSort===k?" selected":"")+'>'+(k==="fit"?"BEST FIT":k.toUpperCase())+'</option>').join("")+'</select>'
    + (activeDef&&cs.slots[active]!=null?'<button class="pill" data-act="clearslot">CLEAR</button>':"")

const POS_FILTERS=["ALL","GK","DEF","MID","ATT","CB","LB","RB","CDM","CM","CAM","LW","RW","ST"];
// Fine at the bottom where most business is done, coarser at the top.
const PRICE_STEPS=[1,2,3,4,5,6,8,10,12,15,18,22,26,30,35,40,50,60,70,85,100,120,150,175,200,250,300,400];
// Strict on purpose. Asking for a striker and being shown wingers who happen
// to list ST as a second position is not a search result, it is noise.
function matchesPos(p,f){
  if(f==="ALL") return true;
  if(f==="GK") return p.pos==="GK";
  if(f==="DEF"||f==="MID"||f==="ATT") return p.cat===f && !(f==="DEF"&&p.pos==="GK");
  return p.pos===f;
}
// How keen he is to sign, so you can hide the ones who will just say no.
function matchesInterest(p,f,ctx){
  if(f==="ALL") return true;
  const c=joinChance(p,S.myClub,S.players,ctx);
  if(f==="KEEN") return c>=0.5;
  if(f==="POSSIBLE") return c>=0.2;
  return true;
}
// "Ready" means he is at his ceiling and will not improve; "prospect" means
// there is still real room left in him.
function matchesDev(p,f){
  if(f==="ALL") return true;
  const r=ratingOf(p), pot=p.pot||r;
  if(f==="READY") return r>=pot-1;
  if(f==="PROSPECT") return pot-r>=3;
  return true;
}

    +'</div>';

// Only the results, so changing one filter never rebuilds the controls you are
// still using. Rebuilding the whole panel is what made the dropdowns appear to
// close by themselves.
function transferRows(){
  const F=S.tf, budget=S.budgets[S.myClub]||0, ctx=ctxFor();
  const t=teamStats(S.myClub,S.players,S.customSquads);
  const xi=new Set(t.lineup.map((x)=>x.player.id));
  let list;
  if(F.mode==="buy"){
    const q=F.q.trim().toLowerCase();
    list=S.players.filter((p)=>p.club!==S.myClub);
    if(F.scope==="PL") list=list.filter((p)=>S.tiers[p.club]===1);
    else if(F.scope==="CH") list=list.filter((p)=>S.tiers[p.club]===2);
    else if(F.scope==="EU") list=list.filter((p)=>FOREIGN_SET.has(p.club));
    else if(F.scope==="FREE") list=list.filter((p)=>p.club==="Free Agent");
    list=list.filter((p)=>matchesPos(p,F.pos))
      .filter((p)=>!q||p.name.toLowerCase().includes(q)||p.club.toLowerCase().includes(q))
      .filter((p)=>askingPrice(p)<=F.maxPrice)
      .filter((p)=>ratingOf(p)>=F.minRating)
      .filter((p)=>p.age<=F.maxAge)
      .filter((p)=>matchesDev(p,F.dev))
      .filter((p)=>matchesInterest(p,F.interest,ctx));
    const cmp={ rating:(a,b)=>ratingOf(b)-ratingOf(a), price:(a,b)=>askingPrice(a)-askingPrice(b),
      pot:(a,b)=>(b.pot||0)-(a.pot||0), age:(a,b)=>a.age-b.age,
      bargain:(a,b)=>ratingOf(b)/Math.max(1,askingPrice(b))-ratingOf(a)/Math.max(1,askingPrice(a)) };
    list=list.sort(cmp[F.sort]||cmp.rating).slice(0,120);
  } else {
    const q=F.q.trim().toLowerCase();
    list=S.players.filter((p)=>p.club===S.myClub).filter((p)=>matchesPos(p,F.pos))
      .filter((p)=>!q||p.name.toLowerCase().includes(q))
      .sort((a,b)=>{ const ai=xi.has(a.id)?1:0, bi=xi.has(b.id)?1:0; return bi-ai||ratingOf(b)-ratingOf(a); });
  }
  const rows=list.map((p)=>{
    const r=ratingOf(p), price=F.mode==="buy"?askingPrice(p):salePrice(p);
    const foreign=FOREIGN_SET.has(p.club), inXI=F.mode==="sell"&&xi.has(p.id);
    const afford=budget>=price;
    const interest=F.mode==="buy"?joinChance(p,S.myClub,S.players,ctx):1;
    const tierTag = F.mode==="buy" && S.tiers[p.club]===2 ? ' <span class="tag">CH</span>' : "";
    return '<div class="listrow"'+(inXI?' style="background:rgba(245,194,66,.08)"':"")+'>'
      +'<button class="grow" style="text-align:left" data-act="show:'+p.id+'">'
      +'<div class="l1">'+(foreign?'<span class="sky">&#9679;</span> ':"")+esc(p.name)+' <span class="muted">'+p.pos+'</span>'+tierTag+(inXI?" "+tagXI():"")+'</div>'
      +'<div class="l2">'+esc(F.mode==="buy"?p.club:"form "+(p.form||6.5).toFixed(1))+' &middot; '+p.age+'y &middot; '+ratingLabel(p)
      +(function(){ const lab=potentialLabel(p); return lab?' &middot; <span style="color:#9BD17F">'+lab+'</span>':""; })()
      +(F.mode==="buy"&&interest<0.5?' &middot; <span style="color:'+(interest<0.2?"var(--clay)":"var(--sage)")+'">'+(interest<0.2?"unlikely":"reluctant")+'</span>':"")
      +'</div></button>'
      +'<span style="color:'+(F.mode==="buy"&&!afford?"var(--sage)":"var(--amber)")+'">'+money(price)+'</span>'
      +(F.mode==="buy"
        ? '<button class="pill'+(afford?" on":"")+'" data-act="buy:'+p.id+'"'+(afford?"":" disabled")+'>Buy</button>'
        : '<button class="pill" style="color:var(--clay);border-color:var(--clay)" data-act="sell:'+p.id+'">Sell</button>')
      +'</div>';
  }).join("");
  return rows||'<div class="pad mono small muted" style="text-align:center">Nothing matches those filters.</div>';
}

/* ============================================================
   ACADEMY
   Half a star at a time, exactly like the training upgrades in World Soccer
   Champs. Each star lifts the ceiling of everyone your academy produces.
   ============================================================ */
const ACADEMY_MAX = 5;
// Rises steeply: the last half-star costs about nine times the first.
// Halved: the old curve priced a full academy out of any career.
function academyCost(level){ return round1(4 + level*7); }
const myAcademy = () => (S.academies && S.academies[S.myClub] !== undefined)
  ? S.academies[S.myClub] : 1;
function scoutCost(level){ return round1(3 + level*5.5); }
function academyStars(level){
  let s="";
  for(let i=1;i<=ACADEMY_MAX;i++){
    if(level>=i) s+='<span style="color:var(--amber)">&#9733;</span>';
    else if(level>=i-0.5) s+='<span style="color:var(--amber)">&#9734;</span>';
    else s+='<span style="color:rgba(242,245,240,.2)">&#9734;</span>';
  }
  return s;
}
function viewAcademy(){
  const lvl=myAcademy(), cost=academyCost(lvl), budget=S.budgets[S.myClub]||0;
  const maxed=lvl>=ACADEMY_MAX;
  const bonus=(72+3.6*lvl).toFixed(0);
  const rivals=divClubs(myTier()).map((c)=>({c,a:(S.academies||{})[c]||1}))
    .sort((x,y)=>y.a-x.a).slice(0,5)
    .map((x)=>'<div style="display:flex;justify-content:space-between"><span'+(x.c===S.myClub?' class="amber"':' class="muted"')+'>'
      +esc(x.c)+'</span><span>'+x.a.toFixed(1)+'</span></div>').join("");
  return '<div class="card pad" style="margin-bottom:10px">'
    +'<div class="mono tiny muted">YOUTH ACADEMY</div>'
    +'<div style="font-size:30px;letter-spacing:4px;margin:6px 0">'+academyStars(lvl)+'</div>'
    +'<div class="mono small muted">Level '+lvl.toFixed(1)+' of '+ACADEMY_MAX.toFixed(1)
    +' &middot; graduates come through with ceilings around <span class="amber">'+bonus+'</span>'
    +' &middot; each half star is worth about <span class="amber">+1.8</span>.</div>'
    +'</div>'
    +'<div class="card pad" style="margin-bottom:10px">'
    +'<div class="mono tiny muted" style="margin-bottom:6px">BEST ACADEMIES IN YOUR DIVISION</div>'
    +'<div class="mono small">'+rivals+'</div></div>'
    +(S.flash?'<div class="card lite pad mono small" style="margin-bottom:10px;color:'+(S.flash.tone||"var(--chalk)")+'">'+esc(S.flash.text)+'</div>':"")
    +'<div class="card pad">'
    +(maxed
      ? '<div class="mono small green">Your academy is fully developed.</div>'
      : '<div class="mono small muted" style="margin-bottom:10px">Next upgrade: +0.5 stars for <span class="amber">'+money(cost)+'</span>. '
        +'You have '+money(budget)+'.</div>'
        +'<button class="btn '+(budget>=cost?"primary":"ghost")+'" data-act="academy"'+(budget>=cost?"":" disabled")+'>'
        +'UPGRADE ACADEMY — '+money(cost)+'</button>')
    +'<div class="mono tiny muted" style="margin-top:10px">'
    +'Graduates come through each summer. A better academy will not save a bad season, but over a long career it is the cheapest squad you will ever build.'
    +'</div></div>'
    + viewScouting();
}

function viewScouting(){
  const lvl=myScouting(), cost=scoutCost(lvl), budget=S.budgets[S.myClub]||0;
  const maxed=lvl>=ACADEMY_MAX;

    +'<div class="mono small muted">Level '+lvl.toFixed(1)+' &middot; your scouts get a read on '
    +'<span class="amber">'+Math.round(t.chance*100)+'%</span> of the players you look at'
    +(t.band?', to within <span class="amber">&plusmn;'+t.band+'</span> of the truth.'
            :', <span class="amber">exactly</span>.')
    +' Your own players you always know precisely.</div>'
    +'<div class="mono tiny muted" style="margin-top:4px">Every half star counts &mdash; the numbers below are the whole-star marks and everything between them is scaled.</div>'
    +'<div class="mono tiny muted" style="margin-top:6px">'
    +SCOUT_ANCHORS.map(function(x){
        return x.star+'&#9733; '+Math.round(x.chance*100)+'%'+(x.band?' &plusmn;'+x.band:' exact'); })

/* ============================================================
   PLAY
   ============================================================ */
function viewPlay(){
  const tier=myTier();
  const clubs=divClubs(tier);
  const fixtures=S.fixtures[tier]||[];
  const next=fixtures[S.mw]||[];
  const mine=next.find((f)=>f.home===S.myClub||f.away===S.myClub);
  const table=sortedTable(S.tables[tier]);
  const pos=table.findIndex((r)=>r.club===S.myClub)+1;
  const budget=S.budgets[S.myClub]||0;

  let html='<div class="row" style="margin-bottom:12px">'
    +statBox("SEASON",S.season)+statBox("DIVISION",tier===1?"PL":"CH")
    +statBox("MATCHWEEK",S.mw+"/38")+statBox("POSITION",S.mw>0?ordinal(pos):"–")
    +statBox("BUDGET",money(budget))+'</div>';

  if(S.phase==="season"&&S.mw<38){
    if(mine){
      html+='<div class="card pad" style="text-align:center;margin-bottom:12px">'
        +'<div class="mono tiny muted">MATCHWEEK '+(S.mw+1)+' — YOUR FIXTURE</div>'
        +'<div class="display" style="font-size:26px;margin-top:4px">'
        +'<span'+(mine.home===S.myClub?' class="amber"':"")+'>'+esc(mine.home)+'</span>'
        +' <span class="muted" style="font-size:18px">vs</span> '
        +'<span'+(mine.away===S.myClub?' class="amber"':"")+'>'+esc(mine.away)+'</span></div>'
        +'<div class="mono tiny muted">'+(mine.home===S.myClub?"Home":"Away")+'</div></div>';
    }
    html+='<div class="row" style="gap:10px;margin-bottom:12px">'
      +'<button class="btn primary" style="flex:1" data-act="sim:1"'+(S.busy?" disabled":"")+'>PLAY MATCHWEEK '+(S.mw+1)+'</button>'
      +'<button class="btn ghost" style="flex:1" data-act="sim:'+(S.mw<19?19-S.mw:38-S.mw)+'"'+(S.busy?" disabled":"")+'>'
      +(S.mw<19?"TO JANUARY":"TO SEASON END")+'</button></div>';
  }

  if(S.phase==="window"){
    const label=S.windowType==="january"?"JANUARY TRANSFER WINDOW":S.windowType==="preseason"?"PRESEASON":"SUMMER TRANSFER WINDOW";
    html+='<div class="card lite pad" style="text-align:center;margin-bottom:12px">'
      +'<div class="display amber" style="font-size:22px">'+label+'</div>';
    if(S.lastPrize){
      const p=S.lastPrize;
      html+='<div class="mono small">Finished '+ordinal(p.position)+' in the '+DIV_NAME[p.tier]
        +(p.euroLabel?' &middot; <span class="sky">'+p.euroLabel+'</span>':"")+'</div>'
        +'<div class="mono tiny muted">merit '+money(p.merit)+(p.euro?' + european '+money(p.euro):"")
        +(p.title?' + title '+money(p.title):"")+(p.promo?' + promotion '+money(p.promo):"")
        +(p.para?' + parachute '+money(p.para):"")+(p.cl?' + cups '+money(p.cl):"")
        +' = <span class="amber">'+money(p.total+(p.cl||0))+'</span></div>';
    }
    html+='<div class="mono tiny muted" style="margin:8px 0">Sign players in Transfers, set your eleven in Lineup, then kick off.</div>'
      +'<button class="btn primary" data-act="'+(S.windowType==="summer"?"newseason":"closewindow")+'">'
      +(S.windowType==="summer"?"START SEASON "+(S.season+1):S.windowType==="preseason"?"KICK OFF SEASON":"CONTINUE SEASON")
      +'</button></div>';
  }

  if(S.phase==="finished"){
    const champ=pos===1;
    const promoted=tier===2&&pos<=2;
    html+='<div class="card lite pad" style="text-align:center;margin-bottom:12px">'
      +'<div class="display" style="font-size:26px;color:'+(champ?"var(--amber)":"var(--chalk)")+'">'
      +(champ?"CHAMPIONS!":"SEASON "+S.season+" COMPLETE")+'</div>'
      +'<div class="mono small muted">'+esc(S.myClub)+' finished '+ordinal(pos)+' in the '+DIV_NAME[tier]
      +(promoted?" — promoted.":tier===1&&pos>=18?" — relegated.":"")+'</div>'
      +'<button class="btn primary" style="margin-top:10px" data-act="endseason">CONTINUE</button></div>';
  }

  const last=S.lastResults?S.lastResults.filter((r)=>r.home===S.myClub||r.away===S.myClub):null;
  if(last&&last.length){
    const w=last.filter((r)=>(r.home===S.myClub?r.hg>r.ag:r.ag>r.hg)).length;
    const l=last.filter((r)=>(r.home===S.myClub?r.hg<r.ag:r.ag<r.hg)).length;
    html+='<div class="card pad"><div class="row" style="justify-content:space-between;margin-bottom:6px">'
      +'<span class="mono tiny muted">YOUR RESULTS</span>'
      +'<span class="mono tiny"><span class="green">'+w+'W</span> '+(last.length-w-l)+'D <span class="clay">'+l+'L</span></span></div>'
      +'<div class="scroll" style="max-height:280px">'
      +last.map((m)=>{
        const home=m.home===S.myClub, mg=home?m.hg:m.ag, og=home?m.ag:m.hg;
        const sc=home?m.homeScorers:m.awayScorers;
        return '<div class="listrow">'+resultBadge(mg>og?"W":mg<og?"L":"D")
          +'<span class="muted" style="width:56px">MW'+m.mw+'</span>'
          +'<span class="grow"><b>'+mg+'–'+og+'</b> vs '+esc(home?m.away:m.home)+' ('+(home?"H":"A")+')'
          +(sc&&sc.length?'<div class="tiny muted">'+esc(sc.map((e)=>e.scorer.split(" ").slice(-1)[0]).join(", "))+'</div>':"")
          +'</span></div>';
      }).join("")+'</div></div>';
  }
  return html;
}

    +'<div class="mono tiny muted" style="margin:12px 0 6px">RATING BY POSITION</div>'
    +'<div class="row">'+byPos+'</div>'
    +'<div class="mono tiny muted" style="margin:12px 0 6px">HOW THE PRICE IS BUILT</div>'
    +'<div class="card pad mono" style="font-size:11px">'
    +priceRow("base from rating "+r, money(round1(0.4*Math.pow(1.208,r-60))))
    +priceRow("age "+p.age, "&times; "+ageValueMult(p.age).toFixed(2))
    +priceRow("ceiling "+(p.pot||r), "&times; "+(1+0.022*Math.max(0,(p.pot||r)-r)*clamp((26-p.age)/8,0,1)).toFixed(2))
    +priceRow("position "+p.pos, "&times; "+(POS_VALUE_MULT[p.pos]||1).toFixed(2))
    +priceRow("form "+(p.form||6.5).toFixed(1), "&times; "+(0.9+0.14*clamp(((p.form===undefined?6.7:p.form)-6.2)/1.6,0,1.4)).toFixed(2))
    +'<div style="border-top:1px solid var(--line);margin-top:5px;padding-top:5px">'
    +priceRow('<span class="amber">market value</span>','<span class="amber">'+money(val)+'</span>')
    +priceRow("asking price (buy)", money(askingPrice(p)))
    +priceRow("you'd receive (sell)", money(salePrice(p)))+'</div></div>'
    +'<div class="mono tiny muted" style="margin:12px 0 6px">THIS SEASON</div>'
    +'<div class="row">'+statBox("APPS",st.apps)+statBox("GOALS",st.goals)+statBox("ASSISTS",st.assists)
    +statBox("AVG",st.apps?round1(st.ratSum/st.apps):"–")
    +statBox("CAREER G",(p.career?p.career.goals:0)+st.goals)+'</div>'
    +'</div></div>';
}
function priceRow(l,r){ return '<div style="display:flex;justify-content:space-between"><span class="muted">'+l+'</span><span>'+r+'</span></div>'; }

function viewResetModal(){
  return '<div class="modal" data-act="closemodal"><div class="box" style="max-width:420px" data-stop="1">'
    +'<div class="display" style="font-size:24px">START A NEW CAREER?</div>'
    +'<div class="mono small muted" style="margin:8px 0 16px">This wipes the current save — squad, tables, transfers and every season played.</div>'
    +'<div class="row" style="gap:8px"><button class="btn danger" style="flex:1" data-act="doreset">DELETE &amp; RESTART</button>'
    +'<button class="btn ghost" style="flex:1" data-act="closemodal">CANCEL</button></div></div></div>';
}

/* ============================================================
   RENDER
   ============================================================ */
const SUBS=[["play","PLAY"],["table","TABLE"],["squad","SQUAD"],["lineup","LINEUP"],
  ["transfers","TRANSFERS"],["clubs","CLUBS"],["academy","CLUB"],["europe","EUROPE"],["stats","STATS"],
  ["news","NEWS"],["history","HISTORY"]];

function render(){
  const main=$("#main"), view=$("#view"), nav=$("#topnav");
  nav.innerHTML = S.myClub
    ? '<span class="mono small muted">'+esc(DIV_NAME[myTier()])+'</span>'
      +'<span class="mono small amber">'+money(S.budgets[S.myClub]||0)+'</span>'
      +'<button class="pill" data-act="reset">RESET</button>'
    : '';
  main.className = (S.myClub && S.sub==="lineup") ? "fill" : "";

  if(!S.myClub){ view.innerHTML=viewClubPicker(); return; }

  let body="";
  switch(S.sub){
    case "table": body=viewTable(); break;
    case "squad": body=viewSquad(); break;
    case "lineup": body=viewLineup(); break;
    case "transfers": body=viewTransfers(); break;
    case "academy": body=viewAcademy(); break;
    case "europe": body=viewEurope(); break;
    case "clubs": body=viewClubs(); break;
    case "stats": body=viewStats(); break;
    case "news": body=viewNews(); break;
    case "history": body=viewHistory(); break;
    default: body=viewPlay();
  }
  const winLabel = S.phase==="window"
    ? (S.windowType==="january" ? "JANUARY WINDOW OPEN" : S.windowType==="preseason" ? "PRESEASON WINDOW OPEN" : "SUMMER WINDOW OPEN")
    : "WINDOW CLOSED";
  const head='<div class="row" style="margin-bottom:10px">'+crest(S.myClub)
    +'<div><div class="display" style="font-size:24px;line-height:1">'+esc(S.myClub.toUpperCase())+'</div>'
    +'<div class="mono tiny muted">Season '+S.season+' &middot; Matchweek '+S.mw+' &middot; '+esc(DIV_NAME[myTier()])
    +' &middot; <span style="color:'+(windowOpen()?"var(--green)":"var(--clay)")+'">'+winLabel+'</span></div></div>'
    +'</div><div class="row" style="margin-bottom:12px">'
    + SUBS.map((s)=>pill(s[1]+(s[0]==="transfers"&&S.offers.length?' <span class="tag cl">'+S.offers.length+'</span>':""),
        S.sub===s[0],"sub:"+s[0])).join("")+'</div>';
  view.innerHTML = head
    + '<div'+(S.sub==="lineup"?' style="flex:1;min-height:0;display:flex;flex-direction:column"':"")+'>'+body+'</div>'
    + (S.inspect?viewPlayerModal(S.inspect):"")
    + (S.modal==="reset"?viewResetModal():"");
}

/* ============================================================
   ACTIONS
   ============================================================ */
function startCareer(club){
  S.myClub=club;
  S.budgets=computeAllBudgets(S.players,S.tiers);
  S.academies=initAcademies(S.players);
  S.scouting=initScouting(S.players);
  S.reputation=initReputation(S.players);
  S.tableTier=S.tiers[club];
  S.fixtures={1:generateFixtures(divClubs(1)),2:generateFixtures(divClubs(2))};
  S.tables={1:initTable(divClubs(1)),2:initTable(divClubs(2))};
  S.phase="window"; S.windowType="preseason"; S.mw=0; S.season=1;
  S.lastForeignOrder=null; S.lastCupWinner=null;
  initWorld(S);
  S.news=[{season:1,type:"prize",big:true,text:"You take charge of "+club+" in the "+DIV_NAME[S.tiers[club]]+"."}];
  S.sub="play";
}

function simulate(count){
  if(S.phase!=="season"||S.busy) return;
  S.busy=true; render();
  setTimeout(()=>{
    const all=[];
    for(let i=0;i<count;i++){
      if(S.mw>=38) break;
      [1,2].forEach((tier)=>{
        const week=S.fixtures[tier][S.mw];
        if(!week) return;
        const r=runMatchweek(S.players,S.customSquads,S.tables[tier],week,S.season,S.mw,S.clubForm);
        S.players=r.players; S.tables[tier]=r.table; S.clubForm=r.clubForm;
        if(tier===myTier()) all.push.apply(all,r.results);
        S.history.push.apply(S.history,r.results.filter((x)=>x.home===S.myClub||x.away===S.myClub));
      });
      S.mw++;
      advanceWorld(S, S.mw);          // foreign leagues, Europe and the cup
    }
    S.lastResults=all;
    if(S.mw>=38){ S.phase="finished"; }
    else if(S.mw>=19 && S.windowType!=="january" && S.windowType!=="summer"){
      S.phase="window"; S.windowType="january";
      const ai=runAITransfers(S.players,S.budgets,ctxFor(),S.myClub,1);
      S.players=ai.players; S.budgets=ai.budgets; invalidateStats(); invalidateStats();
      S.offers=generateOffersForUser(S.players,S.budgets,S.myClub,ctxFor(),S.season);
    }
    S.busy=false; save(); render();
  },20);
}

function finishSeason(){
  const tier=myTier();
  const order=sortedTable(S.tables[tier]).map((r)=>r.club);
  const position=order.indexOf(S.myClub)+1;
  const prize=seasonPrize(position,tier);
  const cupNews=[];
  S.budgets = settleWorld(S, Object.assign({},S.budgets), cupNews);
  const res=endOfSeason({ players:S.players, budgets:S.budgets, tiers:S.tiers,
    customSquads:S.customSquads, tables:S.tables, season:S.season, myClub:S.myClub,
    academies:S.academies, reputation:S.reputation, comps:S.comps });
  S.players=res.players; S.budgets=res.budgets; S.tiers=res.tiers;
  S.cl=res.cl; S.euro={cl:S.comps.cl,el:S.comps.el,uecl:S.comps.uecl}; S.cup=S.comps.cup; S.academies=res.academies; S.reputation=res.reputation;
  S.lastOrder={1:res.order1,2:res.order2};
  S.news=S.news.concat(cupNews.map((n)=>Object.assign({season:S.season},n)));
  S.news=S.news.concat(res.news.map((n)=>Object.assign({season:S.season},n)));
  // Every fourth summer the world's champions meet.
  if(S.season % 4 === 0){
    S.cwc = runClubWorldCup(S.players, S.customSquads, S, S.season);
    Object.keys(S.cwc.prize).forEach((c)=>{ S.budgets[c]=round1((S.budgets[c]||0)+S.cwc.prize[c]); });
    S.news.push({season:S.season,type:"cl",big:true,
      text:S.cwc.champion+" are champions of the world."});
  }
  const ai=runAITransfers(S.players,S.budgets,ctxFor(),S.myClub,4);
  S.players=ai.players; S.budgets=ai.budgets; invalidateStats();
  S.news=S.news.concat(ai.news.filter((n)=>n.big||n.text.indexOf(S.myClub)>=0).map((n)=>Object.assign({season:S.season},n)));
  S.offers=generateOffersForUser(S.players,S.budgets,S.myClub,ctxFor(),S.season);
  S.lastPrize=Object.assign({position,tier,euroLabel:europeanLabel(position,tier),cl:round1((res.euro.cl.prize[S.myClub]||0)+(res.euro.el.prize[S.myClub]||0)
      +(res.euro.uecl.prize[S.myClub]||0)+(res.cup.prize[S.myClub]||0))},prize);
  S.phase="window"; S.windowType="summer"; S.lastResults=null;
  S.sub="play"; S.tableTier=S.tiers[S.myClub];
  save(); render();
}

function newSeason(){
  // Anyone you left out of contract over the summer now leaves for nothing.
  const walking = S.players.filter((p)=>p.club===S.myClub && (p.contract===undefined?3:p.contract)<=0);
  if(walking.length){
    S.players = S.players.map((p)=>walking.indexOf(p)>=0
      ? Object.assign({},p,{club:"Free Agent",contract:1}) : p);
    walking.forEach((p)=>{ clearFromLineup(p.id);
      S.news.push({season:S.season,type:"transfer",big:true,
        text:p.name+" ("+ratingOf(p)+") leaves on a free — his contract ran out."}); });
  }
  S.season++; S.mw=0; S.phase="season"; S.windowType="preseason";
  S.fixtures={1:generateFixtures(divClubs(1)),2:generateFixtures(divClubs(2))};
  S.tables={1:initTable(divClubs(1)),2:initTable(divClubs(2))};
  S.clubForm={}; S.offers=[]; S.lastResults=null; S.tableTier=myTier();
  initWorld(S);                       // fresh draws for the new season
  save(); render();
}

function doBuy(id){
  if(!windowOpen()) return flash("The transfer window is closed.","var(--clay)");
  const p=S.players.find((x)=>x.id===id); if(!p) return;
  const price=askingPrice(p), budget=S.budgets[S.myClub]||0;
  const squad=S.players.filter((x)=>x.club===S.myClub);
  if(budget<price) return flash("Not enough in the budget.","var(--clay)");
  if(squad.length>=26) return flash("Squad is full (26). Sell someone first.","var(--clay)");
  if(Math.random()>joinChance(p,S.myClub,S.players,ctxFor()))
    return flash(p.name+" turned you down — he wants a bigger club.","var(--clay)");
  const seller=p.club;
  S.players=S.players.map((x)=>x.id===id?Object.assign({},x,{club:S.myClub,contract:renewalYears(p)}):x);
  invalidateStats(S.myClub); invalidateStats(seller);
  S.budgets[S.myClub]=round1(budget-price);
  if(seller!=="Free Agent") S.budgets[seller]=round1((S.budgets[seller]||0)+price*0.92);
  S.news.push({season:S.season,type:"transfer",big:true,text:p.name+" ("+ratingOf(p)+") signs for "+S.myClub+" from "+seller+" for "+money(price)+"."});
  save(); flash("Signed "+p.name+" for "+money(price)+".","var(--amber)");
}
function doSell(id){
  if(!windowOpen()) return flash("The transfer window is closed.","var(--clay)");
  const p=S.players.find((x)=>x.id===id); if(!p) return;
  const squad=S.players.filter((x)=>x.club===S.myClub);
  if(squad.length<=16) return flash("You need at least 16 players in the squad.","var(--clay)");
  if(p.pos==="GK"&&squad.filter((x)=>x.pos==="GK").length<=1)
    return flash("That's your only goalkeeper — sign another one first.","var(--clay)");
  const price=salePrice(p);
  const suitors=ALL_CLUBS.filter((c)=>c!==S.myClub&&(S.budgets[c]||0)>=askingPrice(p))
    .filter((c)=>S.players.filter((x)=>x.club===c).length<26);
  let buyer = (FOREIGN_SET.has(p.originClub)&&Math.random()<0.5) ? p.originClub
    : suitors.length ? weightedPick(suitors.map((c)=>({item:c,w:Math.max(1,S.budgets[c]||0)}))) : "Free Agent";
  S.players=S.players.map((x)=>x.id===id?Object.assign({},x,{club:buyer}):x);
  invalidateStats(S.myClub); invalidateStats(buyer);
  S.budgets[S.myClub]=round1((S.budgets[S.myClub]||0)+price);
  if(buyer!=="Free Agent") S.budgets[buyer]=round1((S.budgets[buyer]||0)-askingPrice(p));
  clearFromLineup(id);
  S.news.push({season:S.season,type:"transfer",text:p.name+" leaves "+S.myClub+" for "+buyer+" — "+money(price)+"."});
  save(); flash("Sold "+p.name+" to "+(buyer==="Free Agent"?"nobody (released)":buyer)+" for "+money(price)+".","var(--amber)");
}
function clearFromLineup(id){
  const cs=S.customSquads[S.myClub]; if(!cs) return;
  Object.keys(cs.slots).forEach((k)=>{ if(cs.slots[k]===id) delete cs.slots[k]; });
}
function ensureLineup(){
  if(!S.customSquads[S.myClub]) S.customSquads[S.myClub]={formation:"4-3-3",slots:{}};
  return S.customSquads[S.myClub];
}

function handle(act){
  const [cmd,arg]=act.split(":");
  switch(cmd){
    case "pick": startCareer(arg); save(); break;
    case "ptier": case "tier": S.tableTier=+arg; break;
    case "sub": S.sub=arg; if(arg==="lineup") ensureLineup(); break;
    case "stat": S.statTab=arg; break;
    case "sim": simulate(+arg); return;
    case "endseason": finishSeason(); return;
    case "newseason": newSeason(); return;
    case "closewindow": S.phase="season"; save(); break;
    case "show": S.inspect=S.players.find((p)=>p.id===+arg)||null; break;
    case "closemodal": S.inspect=null; S.modal=null; break;
    case "reset": S.modal="reset"; break;
    case "doreset": localStorage.removeItem(SAVE_KEY); S=newState(); break;
    case "mode": S.tf.mode=arg; break;
    case "buy": doBuy(+arg); return;
    case "sell": doSell(+arg); return;
    case "accept": {
      if(!windowOpen()){ flash("The transfer window is closed.","var(--clay)"); return; }
      const o=S.offers.find((x)=>x.id===arg); if(!o) break;
      const p=S.players.find((x)=>x.id===o.playerId); if(!p) break;
      if(S.players.filter((x)=>x.club===S.myClub).length<=16){ flash("Squad too small.","var(--clay)"); return; }
      S.players=S.players.map((x)=>x.id===p.id?Object.assign({},x,{club:o.club}):x);
      S.budgets[S.myClub]=round1((S.budgets[S.myClub]||0)+o.fee);
      S.budgets[o.club]=round1((S.budgets[o.club]||0)-o.fee);
      clearFromLineup(p.id);
      invalidateStats(S.myClub); invalidateStats(o.club);
      S.offers=S.offers.filter((x)=>x.id!==o.id);
      S.news.push({season:S.season,type:"transfer",big:true,text:p.name+" sold to "+o.club+" for "+money(o.fee)+"."});
      save(); flash("Accepted "+money(o.fee)+" from "+o.club+".","var(--amber)"); return;
    }
    case "reject": S.offers=S.offers.filter((x)=>x.id!==arg); save(); break;
    case "slot": { const cs=ensureLineup(); S.activeSlot = S.activeSlot===arg?null:arg; break; }
    case "assign": { invalidateStats(S.myClub);
      const cs=ensureLineup(); if(!S.activeSlot) break;
      const pid=+arg;
      Object.keys(cs.slots).forEach((k)=>{ if(cs.slots[k]===pid) delete cs.slots[k]; });
      cs.slots[S.activeSlot]=pid;
      const defs=FORMATIONS[cs.formation];
      const nextEmpty=defs.find((s)=>s.id!==S.activeSlot&&cs.slots[s.id]==null);
      S.activeSlot=nextEmpty?nextEmpty.id:null;
      save(); break;
    }
    case "clearslot": { invalidateStats(S.myClub); const cs=ensureLineup(); if(S.activeSlot) delete cs.slots[S.activeSlot]; save(); break; }
    case "autofill": { invalidateStats(S.myClub); const cs=ensureLineup();
      cs.slots=pickBestXI(S.players.filter((p)=>p.club===S.myClub),cs.formation);
      S.activeSlot=null; save(); break; }
    case "form": { invalidateStats(S.myClub); const cs=ensureLineup();
      const ids=new Set(FORMATIONS[arg].map((s)=>s.id));
      const carried={}; Object.keys(cs.slots).forEach((k)=>{ if(ids.has(k)) carried[k]=cs.slots[k]; });
      cs.formation=arg;
      cs.slots=pickBestXI(S.players.filter((p)=>p.club===S.myClub),arg,carried);
      S.activeSlot=FORMATIONS[arg][0].id; save(); break; }
    case "academy": {
      const lvl=myAcademy(), cost=academyCost(lvl);
      if(lvl>=ACADEMY_MAX) break;
      if((S.budgets[S.myClub]||0)<cost){ flash("Not enough money.","var(--clay)"); return; }
      S.budgets[S.myClub]=round1(S.budgets[S.myClub]-cost);
      S.academies[S.myClub]=round1(lvl+0.5);
      save(); flash("Academy upgraded to "+S.academies[S.myClub].toFixed(1)+" stars.","var(--amber)"); return;
    }
    case "renew": {
      const p=S.players.find((x)=>x.id===+arg); if(!p) break;
      const fee=renewalFee(p);
      if((S.budgets[S.myClub]||0)<fee){ flash("You cannot afford the signing-on fee.","var(--clay)"); return; }
      S.budgets[S.myClub]=round1(S.budgets[S.myClub]-fee);
      const yrs=renewalYears(p);
      S.players=S.players.map((x)=>x.id===p.id?Object.assign({},x,{contract:yrs}):x);
      save(); flash(p.name+" signs a new "+yrs+"-year deal for "+money(fee)+".","var(--amber)"); return;
    }
    case "scout": {
      const lvl=myScouting(), cost=scoutCost(lvl);
      if(lvl>=ACADEMY_MAX) break;
      if((S.budgets[S.myClub]||0)<cost){ flash("Not enough money.","var(--clay)"); return; }
      S.budgets[S.myClub]=round1(S.budgets[S.myClub]-cost);
      S.scouting[S.myClub]=round1(lvl+0.5);
      save(); flash("Scouting improved to "+S.scouting[S.myClub].toFixed(1)+" stars.","var(--amber)"); return;
    }
    case "btier": S.browseTier=+arg; S.browseClub=null; break;
    case "etab": S.euroTab=arg; break;
    case "wl": S.worldLeague=arg; break;
    case "browse": S.browseClub=arg||null; break;
  }
  render();
}

document.addEventListener("click",(e)=>{
  const stop=e.target.closest("[data-stop]");
  const el=e.target.closest("[data-act]");
  if(!el) return;
  const act=el.getAttribute("data-act");
  if(act==="closemodal"&&stop&&el.getAttribute("data-act")!=="closemodal") return;
  if(stop&&act==="closemodal"&&el!==e.target.closest("[data-act]")) return;
  if(el.disabled) return;
  handle(act);
});
document.addEventListener("change",(e)=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.getAttribute("data-act"), v=el.value;
  const F=S.tf;
  if(act==="squadsort") S.squadSort=v;
  else if(act==="linesort") S.lineSort=v;
  else if(act==="fpos") F.pos=v;
  else if(act==="fscope") F.scope=v;
  else if(act==="fsort") F.sort=v;
  else if(act==="fdev") F.dev=v;
  else if(act==="finterest") F.interest=v;
  else if(act==="fprice") F.maxPrice=PRICE_STEPS[+v];
  else if(act==="frating") F.minRating=+v;
  else if(act==="fage") F.maxAge=+v;
  else return;
  if(act==="squadsort"||act==="linesort") render();
  else refreshTransferList();
});
// Sliders should update live while dragging, not only when released.
document.addEventListener("input",(e)=>{
  const el=e.target.closest('[data-act]'); if(!el||el.type!=="range") return;
  const act=el.getAttribute("data-act"), F=S.tf;
  if(act==="fprice") F.maxPrice=PRICE_STEPS[+el.value];
  else if(act==="frating") F.minRating=+el.value;
  else if(act==="fage") F.maxAge=+el.value;
  else return;
  refreshTransferList();
});
document.addEventListener("input",(e)=>{
  const el=e.target.closest('[data-act="q"]'); if(!el) return;
  S.tf.q=el.value;
  refreshTransferList();          // the box keeps focus because it is not rebuilt
});

/* ============================================================
   BOOT
   ============================================================ */
if(!load()) S=newState();
if(S.tf && S.tf.dev===undefined) S.tf.dev="ALL";
if(!S.academies && S.myClub) S.academies=initAcademies(S.players);
if(!S.scouting && S.myClub) S.scouting=initScouting(S.players);
if(!S.reputation && S.myClub) S.reputation=initReputation(S.players);
render();

</script>
