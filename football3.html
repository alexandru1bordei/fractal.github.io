<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Manager — Career</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
:root{
  --bg:#0B3D2E; --panel:#123B2C; --panel2:#164A36; --pitch:#0E4531;
  --chalk:#F2F5F0; --amber:#F5C242; --clay:#E2543D; --sky:#6FB4D8;
  --sage:#8FA99A; --green:#5FBF7A; --line:rgba(242,245,240,.14);
  --pitchline:rgba(242,245,240,.22);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--chalk);
  font:14px/1.45 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  overflow:hidden;
}
.mono{font-family:'JetBrains Mono',ui-monospace,'Cascadia Mono','Consolas',monospace}
.display{font-family:'Bebas Neue',Impact,'Haettenschweiler',sans-serif;letter-spacing:.02em}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
select,input{font:inherit;color:var(--chalk);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
select option{background:#0E2E22;color:var(--chalk)}
input[type=range]{accent-color:var(--amber);padding:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(242,245,240,.18);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;flex-direction:column;height:100%}
header{
  flex:0 0 auto;padding:10px 20px;border-bottom:1px solid var(--line);
  background:radial-gradient(circle at 50% 200%, var(--panel2) 0%, var(--bg) 65%);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap
}
.brand small{color:var(--amber);letter-spacing:.3em;font-size:10px;display:block}
.brand h1{font-size:30px;line-height:1}
.spacer{flex:1}
main{flex:1 1 auto;min-height:0;overflow-y:auto}
main.fill{overflow:hidden}
.wrap{max-width:1200px;margin:0 auto;padding:14px 20px}
main.fill .wrap{height:100%;display:flex;flex-direction:column;min-height:0}

.pill{
  font-family:'JetBrains Mono',monospace;font-size:12px;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
}
.pill.on{background:var(--amber);color:var(--bg);border-color:var(--amber)}
.pill.sky.on{background:var(--sky);border-color:var(--sky)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.card.lite{background:var(--panel2)}
.pad{padding:14px}
.muted{color:var(--sage)}
.amber{color:var(--amber)} .clay{color:var(--clay)} .green{color:var(--green)} .sky{color:var(--sky)}
.tiny{font-size:10px} .small{font-size:12px}
.tag{font-size:9px;padding:1px 5px;border-radius:4px;background:rgba(242,245,240,.08);color:var(--sage)}
.tag.xi{background:var(--amber);color:var(--bg)}
.tag.cl{background:rgba(111,180,216,.2);color:var(--sky)}
.stat{background:var(--panel2);border-radius:12px;padding:7px 11px;text-align:center;min-width:64px}
.stat b{display:block;font-family:'JetBrains Mono',monospace;font-size:17px}
.stat span{font-size:9px;letter-spacing:.12em;color:var(--sage)}
.grid{display:grid;gap:8px}
.scroll{overflow-y:auto;min-height:0}

table{width:100%;border-collapse:collapse;font-size:12px}
th{font-weight:400;color:var(--sage);text-align:right;padding:6px 5px;font-size:11px}
th.l,td.l{text-align:left}
td{text-align:right;padding:5px;border-top:1px solid var(--line);font-family:'JetBrains Mono',monospace}
tr.me{background:var(--panel2)}
tr.me td.l{color:var(--amber);font-weight:600}
.zone{display:inline-block;width:3px;height:12px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* lineup */
.lineup{display:flex;gap:12px;flex:1;min-height:0}
.pitchcol{width:310px;flex:0 0 auto;display:flex;flex-direction:column;min-height:0}
.pitchbox{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.pitch{
  position:relative;background:var(--pitch);border-radius:12px;overflow:hidden;
  aspect-ratio:3/4;width:min(100%, calc((100vh - 330px) * .75));
}
.pitch .mark{position:absolute;border:1px solid var(--pitchline)}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.slot .disc{
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;
  background:rgba(242,245,240,.12);color:var(--sage);border:2px solid var(--pitchline)
}
.slot.filled .disc{background:var(--amber);color:var(--bg);border-color:var(--amber)}
.slot.active .disc{background:var(--chalk);color:var(--bg);border-color:var(--chalk);box-shadow:0 0 0 4px rgba(242,245,240,.25)}
.slot em{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:8px;margin-top:2px;
  background:rgba(11,61,46,.6);padding:0 3px;border-radius:3px;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listcol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}

.prow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;background:var(--panel);
  font-family:'JetBrains Mono',monospace;font-size:12px;margin-bottom:4px;border:1px solid transparent}
.prow.sel{border-color:var(--amber);background:rgba(245,194,66,.16)}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.prow .pos{width:34px;text-align:center;font-size:10px;background:rgba(242,245,240,.08);border-radius:4px;padding:1px 0;color:var(--sage)}
.prow .rt{width:28px;text-align:right;font-weight:700}

.listrow{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);
  font-family:'JetBrains Mono',monospace;font-size:12px}
.listrow .grow{flex:1;min-width:0}
.listrow .l1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.listrow .l2{color:var(--sage);font-size:11px}

.modal{position:fixed;inset:0;background:rgba(4,20,14,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{width:100%;max-width:540px;max-height:90vh;overflow-y:auto;background:var(--panel2);
  border:1px solid var(--line);border-radius:16px;padding:18px}
.attr{background:var(--panel);border-radius:9px;padding:6px 9px}
.attr .bar{height:4px;border-radius:3px;background:rgba(242,245,240,.12);margin-top:4px}
.attr .bar i{display:block;height:4px;border-radius:3px}

.btn{border-radius:12px;padding:11px 14px;font-family:'Bebas Neue',Impact,sans-serif;font-size:18px;
  letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.primary{background:var(--amber);color:var(--bg)}
.btn.ghost{border:2px solid var(--sage);color:var(--chalk)}
.btn.danger{background:var(--clay);color:var(--chalk)}
.btn[disabled]{opacity:.5;cursor:default}
.badge{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;color:var(--bg);flex:0 0 auto}
.crest{width:34px;height:34px;border-radius:50%;background:var(--amber);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',Impact,sans-serif;font-size:13px;flex:0 0 auto}
.bracket{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.bracket .rnd{min-width:190px;flex:0 0 auto}
.bracket .tie{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 8px;margin-bottom:6px;font-size:11px;font-family:'JetBrains Mono',monospace}
@media(max-width:900px){
  /* On a phone the app is an ordinary scrolling document, not a fixed shell —
     the viewport-height layout collapses once the browser chrome moves. */
  html,body{height:auto;overflow:visible}
  #app{height:auto;min-height:100vh}
  main,main.fill{overflow:visible;min-height:0}
  main.fill .wrap{height:auto;display:block}
  .wrap{padding:12px}
  header{padding:10px 12px;gap:10px}
  .brand h1{font-size:24px}
  .spacer{flex:1 0 100%;height:0}
  .lineup{flex-direction:column;min-height:0}
  .pitchcol{width:auto}
  .pitchbox{min-height:0}
  .pitch{width:min(92%, 320px)}
  .listcol .scroll{max-height:52vh}
  .scroll{max-height:60vh !important}
  table{font-size:11px}
  th,td{padding:5px 3px}
  .stat{min-width:56px;padding:6px 8px}
  .stat b{font-size:15px}
  .pill{padding:6px 11px}
  .listrow{padding:8px 10px}
  .modal .box{max-height:88vh}
  .grid{grid-template-columns:1fr !important}
}
</style>
</head>

</div>

  RM:[.24,.12,.24,.24,.09,.07], LW:[.26,.18,.16,.28,.05,.07],
  RW:[.26,.18,.16,.28,.05,.07], ST:[.18,.32,.10,.18,.04,.18],
};
const POS_SHAPE = {
  GK:[-27,4,0,2,5,3], CB:[-2,-35,-10,-15,8,6], LB:[5,-23,1,0,6,-4], RB:[5,-23,1,0,6,-4],
  CDM:[-13,-7,5,-1,8,5], CM:[-8,-2,7,4,-4,-2], CAM:[-5,1,9,9,-21,-14],
  LM:[8,-3,3,7,-17,-9], RM:[8,-3,3,7,-17,-9], LW:[9,1,1,9,-39,-11], RW:[9,1,1,9,-39,-11], ST:[5,7,-12,2,-40,0],
};
const OVR_LIFT = 6;
const clamp = (v,lo,hi) => (v<lo?lo:v>hi?hi:v);
const round1 = (x) => Math.round(x*10)/10;

function ratingAt(a,pos){ const w=POS_W[pos]||POS_W.CM; let s=OVR_LIFT;
  for(let i=0;i<6;i++) s+=w[i]*a[i]; return clamp(Math.round(s),1,99); }
function ratingOf(p){ return ratingAt(p.a,p.pos); }

/* Positional familiarity: your own position is 100%, a listed alternative
   98%, and it falls away with every step across the pitch. */
const POS_ADJ = {
  GK:[], CB:["LB","RB","CDM"], LB:["CB","LM","LW"], RB:["CB","RM","RW"],
  CDM:["CB","CM"], CM:["CDM","CAM","LM","RM"], CAM:["CM","LW","RW","ST"],
  LM:["LB","CM","LW"], RM:["RB","CM","RW"], LW:["LM","CAM","ST","RW"],
  RW:["RM","CAM","ST","LW"], ST:["CAM","LW","RW"],
};
const FAM_BY_DIST = [1.0,0.96,0.91,0.86,0.81,0.77];
const POS_DIST = (() => { const d={}; ALL_POS.forEach((start)=>{ const dist={[start]:0}; const q=[start];
  while(q.length){ const cur=q.shift(); (POS_ADJ[cur]||[]).forEach((n)=>{ if(dist[n]===undefined){dist[n]=dist[cur]+1;q.push(n);} }); }
  d[start]=dist; }); return d; })();

function familiarity(player, slotPos){
  if(player.pos===slotPos) return 1;
  if((player.pos==="GK")!==(slotPos==="GK")) return 0.45;
  const d = POS_DIST[player.pos] ? POS_DIST[player.pos][slotPos] : undefined;
  const base = FAM_BY_DIST[Math.min(d===undefined?5:d,5)];
  return (player.positions||[]).includes(slotPos) ? Math.max(base,0.98) : base;
}
function effRating(player, slotPos){ return ratingAt(player.a, slotPos) * familiarity(player, slotPos); }

/* Hidden traits, derived from the id so they never need storing. */
function hash32(n){ let x=(n|0)+0x9e3779b9; x=Math.imul(x^(x>>>16),0x21f0aaad); x=Math.imul(x^(x>>>15),0x735a2d97); return (x^(x>>>15))>>>0; }
const unit = (id,salt) => hash32(id*7919+salt*104729)/4294967296;
const consistencyOf = (p) => 0.5+0.45*unit(p.id,11);
const growthTraitOf = (p) => 0.65+0.7*unit(p.id,37);

function gauss(mean,sd){ let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  return mean+sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function normCdf(z){ const t=1/(1+0.2316419*Math.abs(z)); const d=0.3989423*Math.exp((-z*z)/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-p:p; }

/* ============================================================
   MARKET VALUE
   ============================================================ */
const POS_VALUE_MULT = { GK:0.62,CB:0.85,LB:0.92,RB:0.92,CDM:0.95,CM:1.0,CAM:1.08,LM:1.02,RM:1.02,LW:1.1,RW:1.1,ST:1.12 };
function ageValueMult(age){ return 1.28/(1+Math.exp((age-29.2)/2.5))+0.06; }
function marketValue(p){
  const r = ratingOf(p);
  let v = 0.4*Math.pow(1.208, r-60);
  v *= ageValueMult(p.age);
  v *= 1 + 0.022*Math.max(0,(p.pot||r)-r)*clamp((26-p.age)/8,0,1);
  v *= POS_VALUE_MULT[p.pos]||1;
  v *= 0.9 + 0.14*clamp(((p.form===undefined?6.7:p.form)-6.2)/1.6,0,1.4);
  return clamp(round1(v),0.2,350);
}
// You buy above valuation and sell below it. That spread is the main reason a
// bank balance alone cannot win you the league.
function askingPrice(p){ const r=ratingOf(p); return round1(marketValue(p)*(1.2+0.35*clamp((r-78)/12,0,1))); }
function salePrice(p){ return round1(marketValue(p)*0.86); }

/* ============================================================
   WHO WILL SIGN FOR YOU
   A top player will not drop into a mid-table side, and certainly not into
   the Championship, however much money is waved at him.
   ============================================================ */
// The squad you have right now, which is what reputation drifts towards.
function squadPull(club, players){
  const rs = players.filter((p)=>p.club===club).map(ratingOf).sort((a,b)=>b-a).slice(0,14);
  return rs.length ? rs.reduce((a,b)=>a+b,0)/rs.length : 70;
}
/* Reputation moves slowly. Judging a club purely on this season's squad meant
   an ageing Arsenal lost its pull the moment its players declined, so nobody
   decent would sign, so it could never rebuild — it sat on £463M and got
   relegated. A name outlives a bad squad by several years. */
function initReputation(players){
  const r={};
  ALL_CLUBS.forEach((c)=>{ r[c] = FOREIGN_SET.has(c) ? (FOREIGN_PULL[c]||80) : squadPull(c,players); });
  return r;
}
function driftReputation(rep, players, order1, order2){
  const out = Object.assign({}, rep);
  ALL_CLUBS.forEach((c)=>{
    const now = FOREIGN_SET.has(c) ? (FOREIGN_PULL[c]||80) : squadPull(c,players);
    let target = now;
    const p1 = order1 ? order1.indexOf(c)+1 : 0;
    const p2 = order2 ? order2.indexOf(c)+1 : 0;
    if(p1>0) target += p1<=1?3:p1<=4?2:p1<=7?1:p1>=18?-2:0;
    else if(p2>0) target += p2<=2?1:p2>=18?-1.5:0;
    out[c] = round1((out[c]===undefined?now:out[c])*0.82 + target*0.18);
  });
  return out;
}

function clubPull(club, players, ctx){
  const rep = ctx && ctx.reputation ? ctx.reputation[club] : undefined;
  if(FOREIGN_SET.has(club)) return rep!==undefined ? rep : (FOREIGN_PULL[club]||80);
  // half what the squad is worth today, half what the club is still thought to be
  const now = squadPull(club, players);
  let pull = rep!==undefined ? (now*0.45 + rep*0.55) : now;
  const tier = ctx && ctx.tiers ? ctx.tiers[club] : 1;
  if(tier===2) pull -= 6;                       // second-tier football is a hard sell
  if(ctx && ctx.lastOrder){
    const pos = ctx.lastOrder.indexOf(club)+1;
    if(pos>=1) pull += pos<=1?4:pos<=4?2.5:pos<=7?1:pos>=17?-2.5:0;
  }
  if(ctx && ctx.clRunners && ctx.clRunners.has(club)) pull += 3;   // European football sells itself
  return pull;
}
function joinChance(player, club, players, ctx){
  const r = ratingOf(player);
  const gap = r - (clubPull(club, players, ctx) + 2.5);
  const youthBonus = player.age<=21 ? 2.5 : 0;
  return clamp(1/(1+Math.exp((gap-youthBonus)/1.6)), 0.01, 0.99);
}

/* ============================================================
   SIMULATION ENGINE — the original model, restored
   chance creation = 0.65*MID + 0.30*ATT + 0.05*DEF (per-team rating); the gap
   between the two creation ratings drives a saturating Poisson rate, and each
   chance converts as a Bernoulli trial against the opposing defence.
   MID_SATURATION=6 was tuned empirically: with a higher value (15), even the
   single strongest club in the league averaged only ~68pts over 100 simulated
   seasons — too little separation between skill levels. At 6 a genuinely
   dominant squad averages ~83pts without changing goals per match (~2.77,
   which matches real Premier League scoring).
   The form swing and the per-match performance roll are gone — a match is
   Poisson chances against Bernoulli conversion and nothing else. Home
   advantage is back but deliberately mild: 1.2 rating points rather than the
   2.1 it briefly was, which lifts the home side's win rate a few points
   without turning the fixture list into the whole story.
   ============================================================ */
const BASE_CHANCES = 5.0;
const MID_SATURATION = 6.0;
const CONVERSION_CAP = 0.55;
const MID_W = 0.65, ATT_W = 0.30, DEF_W = 0.05;
const HOME_ADV = 1.2;

const sigmoid = (x) => 1/(1+Math.exp(-x));
const creationRating = (t) => MID_W*t.mid + ATT_W*t.att + DEF_W*t.def;
function expectedChances(team,opp){ return 2*BASE_CHANCES*sigmoid((creationRating(team)-creationRating(opp))/MID_SATURATION); }
function samplePoisson(lambda){ if(lambda<=0)return 0; const L=Math.exp(-lambda); let k=0,p=1;
  do{k+=1;p*=Math.random();}while(p>L); return k-1; }
function goalProbability(attack,oppDefense){ if(attack<=0&&oppDefense<=0) return 0.5*CONVERSION_CAP;
  return (CONVERSION_CAP*attack)/(attack+oppDefense); }
function resolveChances(n,attack,oppDefense){ const p=goalProbability(attack,oppDefense); let g=0;
  for(let i=0;i<n;i++) if(Math.random()<p) g++; return g; }
function simulateMatch(home,away,opts){
  const neutral = opts && opts.neutral;
  const H = neutral ? home : { att:home.att+HOME_ADV, mid:home.mid+HOME_ADV, def:home.def+HOME_ADV };
  const A = away;
  const hc = samplePoisson(expectedChances(H,A)), ac = samplePoisson(expectedChances(A,H));
  return { homeChances:hc, awayChances:ac,
    homeGoals: resolveChances(hc,H.att,A.def), awayGoals: resolveChances(ac,A.att,H.def),
    homeConv: goalProbability(H.att,A.def), awayConv: goalProbability(A.att,H.def) };
}
function simulateMany(home,away,n){
  let hw=0,dr=0,aw=0,hg=0,ag=0,hc=0,ac=0;
  for(let i=0;i<n;i++){ const r=simulateMatch(home,away);
    if(r.homeGoals>r.awayGoals)hw++; else if(r.homeGoals<r.awayGoals)aw++; else dr++;
    hg+=r.homeGoals; ag+=r.awayGoals; hc+=r.homeChances; ac+=r.awayChances; }
  return { n, homeWinPct:hw/n, drawPct:dr/n, awayWinPct:aw/n,
    avgHomeGoals:hg/n, avgAwayGoals:ag/n, avgHomeChances:hc/n, avgAwayChances:ac/n };
}

/* Goals go to real players, weighted by finishing and by how far up the pitch
   they were asked to play. Striker weight and the exponent set the golden
   boot; at 1.0/2.0 the league's top scorer averaged 36 a season. */
const SCORE_W = { ST:0.8,LW:0.62,RW:0.62,CAM:0.5,LM:0.35,RM:0.35,CM:0.22,CDM:0.1,LB:0.07,RB:0.07,CB:0.09,GK:0.002 };
const ASSIST_W = { CAM:1.0,LW:0.85,RW:0.85,LM:0.8,RM:0.8,CM:0.7,LB:0.55,RB:0.55,ST:0.45,CDM:0.35,CB:0.12,GK:0.02 };
const SHO_EXPONENT = 1.7;
function weightedPick(entries){
  const total = entries.reduce((a,e)=>a+e.w,0);
  if(total<=0) return null;
  let r = Math.random()*total;
  for(const e of entries){ r-=e.w; if(r<=0) return e.item; }
  return entries[entries.length-1].item;
}
function pickScorers(lineup, goals){
  const events=[];
  if(!lineup||!lineup.length) return events;
  const sw = lineup.map((x)=>({item:x, w:(SCORE_W[x.slotPos]||0.1)*Math.pow(x.player.a[1]/60,SHO_EXPONENT)}));
  for(let i=0;i<goals;i++){
    const scorer = weightedPick(sw);
    if(!scorer) break;
    let assist=null;
    if(Math.random()<0.72){
      const aw = lineup.filter((x)=>x.player.id!==scorer.player.id)
        .map((x)=>({item:x, w:(ASSIST_W[x.slotPos]||0.1)*Math.pow(x.player.a[2]/60,1.6)}));
      assist = weightedPick(aw);
    }
    events.push({ scorerId:scorer.player.id, scorer:scorer.player.name,
      assistId: assist?assist.player.id:null, assist: assist?assist.player.name:null });
  }
  return events;
}
function matchRating(entry, ctx){
  let r = 6.0;
  r += ctx.goals*0.95 + ctx.assists*0.55;
  r += ctx.won?0.35:ctx.drew?0.05:-0.25;
  const cat = POS_CAT[entry.slotPos];
  if(cat==="DEF"||entry.slotPos==="GK"){
    r += ctx.conceded===0?0.55:-0.16*ctx.conceded;
    if(entry.slotPos==="GK") r += ctx.conceded===0?0.15:0;
  }
  if(cat==="ATT"&&ctx.goals===0&&ctx.assists===0) r -= 0.2;
  r += (effRating(entry.player, entry.slotPos)-78)*0.018;
  r += gauss(0, 0.62*(1.35-consistencyOf(entry.player)));
  return clamp(round1(r),3.0,10);
}

/* ============================================================
   BEST ELEVEN — chosen for the team, not slot by slot
   Filling slots in order and giving each the best man left is what makes an
   auto-pick look stupid: a holding midfielder gets taken by the centre-back
   slot processed before him. This maximises the total instead, from three
   different starting points so it does not settle in a poor local optimum.
   ============================================================ */
function pickBestXI(roster, formationKey, locked){
  const slots = FORMATIONS[formationKey]||FORMATIONS["4-3-3"];
  const players = roster.slice();
  if(!players.length) return {};
  const legal = (p,s) => (s.pos==="GK" ? p.pos==="GK" : p.pos!=="GK");
  const score = (p,s) => (legal(p,s) ? effRating(p,s.pos) : -1e6);
  const idx = new Map(players.map((p,i)=>[p.id,i]));
  const baseAt = new Array(slots.length).fill(-1);
  const baseUsed = new Set();
  const frozen = new Set();
  if(locked){
    slots.forEach((s,si)=>{ const id=locked[s.id]; if(id==null) return;
      const pi=idx.get(id); if(pi===undefined||baseUsed.has(pi)) return;
      baseAt[si]=pi; baseUsed.add(pi); frozen.add(si); });
  }
  const val = (si,pi) => (pi===-1?0:score(players[pi],slots[si]));
  function optimise(seed){
    const at = baseAt.slice(), used = new Set(baseUsed);
    seed(at,used);
    slots.forEach((s,si)=>{ if(at[si]!==-1) return;
      for(let pi=0;pi<players.length;pi++) if(!used.has(pi)&&legal(players[pi],s)){at[si]=pi;used.add(pi);break;} });
    let improved=true,guard=0;
    while(improved&&guard++<40){
      improved=false;
      for(let i=0;i<slots.length;i++){
        if(frozen.has(i)) continue;
        for(let j=0;j<slots.length;j++){
          if(i===j||frozen.has(j)) continue;
          const a=at[i],b=at[j];
          if(val(i,b)+val(j,a) > val(i,a)+val(j,b)+1e-9){ at[i]=b; at[j]=a; improved=true; }
        }
        for(let pi=0;pi<players.length;pi++){
          if(used.has(pi)) continue;
          const cur=at[i];
          if(val(i,pi) > val(i,cur)+1e-9){ if(cur!==-1) used.delete(cur); used.add(pi); at[i]=pi; improved=true; }
        }
      }
    }
    let total=0; for(let i=0;i<slots.length;i++) total+=val(i,at[i]);
    return {at,total};
  }
  const seedPairs = (at,used)=>{
    const pairs=[];
    slots.forEach((s,si)=>{ if(frozen.has(si)) return;
      players.forEach((p,pi)=>{ if(legal(p,s)) pairs.push({si,pi,v:score(p,s)}); }); });
    pairs.sort((a,b)=>b.v-a.v);
    pairs.forEach(({si,pi})=>{ if(at[si]===-1&&!used.has(pi)){at[si]=pi;used.add(pi);} });
  };
  const seedOrder = (rev)=>(at,used)=>{
    const order = slots.map((s,si)=>si).filter((si)=>!frozen.has(si));
    if(rev) order.reverse();
    order.forEach((si)=>{ let best=-1,bv=-Infinity;
      players.forEach((p,pi)=>{ if(used.has(pi)||!legal(p,slots[si])) return;
        const v=score(p,slots[si]); if(v>bv){bv=v;best=pi;} });
      if(best!==-1){at[si]=best;used.add(best);} });
  };
  let best=null;
  [seedPairs, seedOrder(false), seedOrder(true)].forEach((seed)=>{
    const r=optimise(seed); if(!best||r.total>best.total) best=r;
  });
  const chosen={};
  slots.forEach((s,si)=>{ if(best.at[si]!==-1) chosen[s.id]=players[best.at[si]].id; });
  return chosen;
}

function resolveLineup(roster, formationKey, slotMap){
  const slots = FORMATIONS[formationKey]||FORMATIONS["4-3-3"];
  const byId = new Map(roster.map((p)=>[p.id,p]));
  const used = new Set(); const out=[]; const missing=[];
  slots.forEach((s)=>{
    const id = slotMap?slotMap[s.id]:null;
    const p = id!=null?byId.get(id):null;
    if(p&&!used.has(p.id)){ used.add(p.id); out.push({slotId:s.id,slotPos:s.pos,player:p}); }
    else missing.push(s);
  });
  missing.forEach((s)=>{
    const cands = roster.filter((p)=>!used.has(p.id)&&(s.pos==="GK"?p.pos==="GK":p.pos!=="GK"));
    const pick = cands.sort((a,b)=>effRating(b,s.pos)-effRating(a,s.pos))[0];
    if(pick){ used.add(pick.id); out.push({slotId:s.id,slotPos:s.pos,player:pick,auto:true}); }
  });
  return out;
}
/* How many bodies you commit to each third, not just how good they are.
   The reference shape is 4-3-3: five in the defensive band counting the
   keeper, three in midfield, three up front. Pack an extra body into a band
   and that band gets stronger; strip one out and it suffers.
   So a back five concedes less and threatens less, a back three the reverse —
   which is the whole point of picking a formation. */
const SHAPE_REF = { DEF:5, MID:3, ATT:3 };
const SHAPE_WEIGHT = { DEF:2.2, MID:1.8, ATT:2.4 };
function statsFromLineup(lineup){
  const band=(cat)=>{
    const v=lineup.filter((x)=>POS_CAT[x.slotPos]===cat).map((x)=>effRating(x.player,x.slotPos));
    if(!v.length) return 0;
    const avg=v.reduce((a,b)=>a+b,0)/v.length;
    return round1(avg + SHAPE_WEIGHT[cat]*(v.length - SHAPE_REF[cat]));
  };
  return { att:band("ATT"), mid:band("MID"), def:band("DEF") };
}
/* Squads do not change during a season — transfers only happen in windows and
   development only at the end — so a club's strength can be worked out once
   and reused. Recomputing it for 171 clubs every matchweek was most of the
   simulation's cost. Anything that does change a squad calls invalidateStats. */
let STAT_CACHE = {};
function invalidateStats(club){ if(club) delete STAT_CACHE[club]; else STAT_CACHE = {}; }
function cachedStats(club, players, customSquads){
  const hit = STAT_CACHE[club];
  if(hit) return hit;
  return (STAT_CACHE[club] = teamStats(club, players, customSquads));
}

function teamStats(club, players, customSquads){
  const roster = players.filter((p)=>p.club===club);
  const cs = customSquads[club];
  const filled = cs?Object.values(cs.slots).filter((v)=>v!=null).length:0;
  const useCustom = cs&&filled>=7;
  const formation = useCustom?cs.formation:"4-3-3";
  const slotMap = useCustom?cs.slots:pickBestXI(roster,formation);
  const lineup = resolveLineup(roster,formation,slotMap);
  const s = statsFromLineup(lineup);
  const cons = lineup.length?lineup.reduce((a,x)=>a+consistencyOf(x.player),0)/lineup.length:0.75;
  return { club, att:s.att, mid:s.mid, def:s.def, consistency:cons, lineup,
    roster:[...roster].sort((a,b)=>ratingOf(b)-ratingOf(a)),
    source: useCustom?("Custom XI ("+formation+")"):"Auto Best XI (4-3-3)", formation, slots:slotMap };
}

/* ============================================================
   FIXTURES & TABLE
   ============================================================ */
function shuffle(arr){ const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; } return a; }
function generateFixtures(clubs){
  const list = shuffle(clubs), n=list.length, fixed=list[0];
  let rot = list.slice(1); const half=[];
  for(let r=0;r<n-1;r++){
    const arr=[fixed].concat(rot), round=[];
    for(let i=0;i<n/2;i++){ const home=arr[i], away=arr[n-1-i];
      round.push(r%2===0?{home,away}:{home:away,away:home}); }
    half.push(round); rot.unshift(rot.pop());
  }
  return half.concat(half.map((rd)=>rd.map((m)=>({home:m.away,away:m.home}))));
}
function initTable(clubs){ const t={}; clubs.forEach((c)=>{t[c]={club:c,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};}); return t; }
function applyResult(table,home,away,hg,ag){
  const t = Object.assign({},table); t[home]=Object.assign({},table[home]); t[away]=Object.assign({},table[away]);
  const h=t[home], a=t[away];
  h.p++;a.p++;h.gf+=hg;h.ga+=ag;a.gf+=ag;a.ga+=hg;
  if(hg>ag){h.w++;h.pts+=3;a.l++;} else if(hg<ag){a.w++;a.pts+=3;h.l++;} else {h.d++;a.d++;h.pts++;a.pts++;}
  return t;
}
function sortedTable(table){
  return Object.values(table).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||x.club.localeCompare(y.club));
}
function ordinal(n){ const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }


/* ============================================================
   PRIZE MONEY
   Thin but not punishing. League placings pay for the lights; European
   football is where the money actually is, which is what pulls the big clubs
   away from everyone else and makes climbing genuinely hard.
   ============================================================ */
function meritMoney(position, tier){
  return tier===2 ? round1(1.4 + 8.4*Math.exp(-(position-1)/5.5))
                  : round1(3.5 + 30.8*Math.exp(-(position-1)/5.5));
}
function europeanMoney(position, tier){
  if(tier!==1) return 0;
  if(position<=4) return 9.8;
  if(position===5) return 6.3;
  if(position<=7) return 4.2;
  return 0;
}
function titleBonus(position, tier){ return position===1 ? (tier===2?4.2:7) : 0; }
function promotionMoney(position, tier){
  if(tier!==2) return 0;
  if(position<=2) return 42;
  return 0;                       // the play-off winner is paid separately
}
// Going down pays nothing. Being relegated is a punishment, not an income.
function relegationParachute(){ return 0; }

function seasonPrize(position, tier){

/* ============================================================
   AGEING, DEVELOPMENT, RETIREMENT, ACADEMIES
   ============================================================ */
// Players now mature late. A teenager improves slowly, the real gains land
// between 22 and 27, and nobody arrives at their ceiling at nineteen.
function growthFactor(age){
  if(age<=18) return 0.07;
  if(age<=21) return 0.12;
  if(age<=24) return 0.16;
  if(age<=27) return 0.14;
  if(age<=29) return 0.08;
  return 0;
}
// The peak is a plateau from about 27 to 30, then it goes.
function declineFactor(age){ return age<=30?0:clamp(0.24*(age-30)+0.045*Math.pow(age-30,2),0,5.5); }
const DECLINE_BIAS = [1.7,0.75,0.35,0.9,0.7,1.5];
function applyRatingDelta(p, delta){
  const w = POS_W[p.pos]||POS_W.CM;
  const bias = delta<0 ? DECLINE_BIAS : w.map((x,i)=>0.6+2.2*w[i]);
  let wsum=0; for(let i=0;i<6;i++) wsum+=w[i]*bias[i];
  if(wsum<=0) return p.a;
  const target = clamp(ratingAt(p.a,p.pos)+delta,20,99);
  const ints = p.a.map((v,i)=>Math.round(clamp(v+(delta*bias[i])/wsum+gauss(0,0.5),20,99)));
  for(let k=0;k<8;k++){
    const err = target-ratingAt(ints,p.pos);
    if(Math.abs(err)<0.5) break;
    const order=[0,1,2,3,4,5].sort((i,j)=>w[j]-w[i]);
    let moved=false;
    for(const i of order){ const step=err>0?1:-1;
      if(ints[i]+step>=20&&ints[i]+step<=99){ints[i]+=step;moved=true;break;} }
    if(!moved) break;
  }
  return ints;
}
/* A ceiling is what he could become in a perfect career, not what he will
   become. Each player carries a hidden "reach" — how much of that ceiling he
   actually gets to — so an 88-potential prospect typically tops out somewhere
   between 84 and 88 depending on luck and on how much football he plays. */
const reachOf = (p) => 0.62 + 0.38*unit(p.id, 61);
function effectiveCeiling(p){
  const pot = p.pot || ratingAt(p.a,p.pos);
  return Math.max(ratingAt(p.a,p.pos), Math.round(pot - (1-reachOf(p))*11));
}
function developPlayer(p){
  const r = ratingAt(p.a,p.pos);
  const ceiling = effectiveCeiling(p);
  const gap = Math.max(0, ceiling - r);
  // A player who never got on the pitch is neither in form nor out of it.
  const played = p.st && p.st.apps>0;
  const formF = played ? clamp((p.seasonForm-6.3)/1.2,-0.6,1.2) : 0;
  // Playing time matters directly: a young player who sat out the season
  // develops about a quarter slower than one who played it.
  const minutesF = played ? clamp(0.75 + 0.45*(p.st.apps/30), 0.75, 1.20) : 0.55;
  const growth = gap*growthFactor(p.age)*growthTraitOf(p)*(1.0+0.5*formF)*minutesF;
  const decline = declineFactor(p.age)*(1.0-0.28*formF)*(0.9+0.25*(1-minutesF));
  // The ceiling is a ceiling — without this clip the random term ratchets a
  // lucky player past his potential year after year.
  const delta = Math.min(growth-decline+gauss(0,1.05), gap);   // never past the reachable ceiling
  const a = applyRatingDelta(p, delta);
  const newAge = p.age+1;
  let pot = p.pot||r;
  if(p.age<=23 && formF>0.8 && Math.random()<0.08) pot = Math.min(88, pot+1);
  // Past the age where anyone improves, the ceiling comes down to meet him.
  if(newAge>=31) pot = ratingAt(a,p.pos); else pot = Math.max(ratingAt(a,p.pos), pot);
  return Object.assign({},p,{a,pot,age:newAge});
}
/* Retirement used to start biting at thirty, which put a 76-rated
   thirty-year-old out of the game entirely — that is not a career, it is an
   injury. The hazard now starts at 31, centres on 36.5 for an outfield player
   and 39.5 for a keeper, and a better player hangs on longer. */
function retirementChance(p){
  const r = ratingAt(p.a,p.pos);
  if(p.age<31) return 0;
  const mu = (p.pos==="GK"?39.5:36.5)+clamp((r-78)*0.16,-1.5,2.5), sd=2.6;
  const surv = 1-normCdf((p.age-mu)/sd);
  if(surv<=0.02) return 1;
  return clamp((normCdf((p.age+1-mu)/sd)-normCdf((p.age-mu)/sd))/surv,0,1);
}

// Every club has an academy rated in half-stars, and that rating is the only
// thing deciding how good its graduates can become. Liverpool start around
// four stars, a struggling Championship side around one; you can buy your own
// upward half a star at a time.
const ACADEMY_MIN = 1.0, ACADEMY_TOP = 5;
// A Championship club is not a youth wasteland and a Premier League club is
// not a factory. The spread runs 1.5 to 4.5 stars, not 0.5 to 4.5 — the gap
// between the divisions was doing far too much work.
function academyFromSquad(club, players){
  const rs = players.filter((p)=>p.club===club).map(ratingOf).sort((a,b)=>b-a).slice(0,11);
  const avg = rs.length ? rs.reduce((a,b)=>a+b,0)/rs.length : 70;
  return clamp(Math.round((1.5 + (avg-69)*(3.0/17))*2)/2, 1.5, 4.5);
}
function initAcademies(players){
  const a={};
  ALL_CLUBS.forEach((c)=>{ a[c]=academyFromSquad(c,players); });
  return a;
}
// Scouting decides how precisely you can read another club's players. Every
// club starts with a network sized to what it is — nobody begins blind.
function initScouting(players){
  const s={};
  ALL_CLUBS.forEach((c)=>{ s[c]=clamp(academyFromSquad(c,players)-0.5,1.0,4.0); });
  return s;
}
function makeYouth(club, id, academy, forcePos){
  const r0=unit(id,51), r1=unit(id,52);
  const pos = forcePos||randomYouthPos();
  const age = 16+Math.floor(Math.random()*3);
  // Half a star is worth about one and a half points of ceiling.
  // Measured over 14-season runs: this centre holds the league's top elevens
  // near 78 with about eight players above 88, and the average rating now
  // peaks at 28-29 rather than at 19.
  const potCenter = 72 + 3.6*clamp(academy||ACADEMY_MIN, ACADEMY_MIN, ACADEMY_TOP);
  // One prospect in fifty is special, and even he tops out at 88.
  const wonder = Math.random()<0.02;
  const pot = clamp(Math.round(gauss(potCenter,4.0)+(wonder?6+Math.random()*5:0)),52,88);
  const base = clamp(Math.round(pot-(9+Math.random()*13)),40,pot-4);
  const shape=POS_SHAPE[pos], w=POS_W[pos];
  const raw = shape.map((s)=>s+gauss(0,3.0));
  let acc=OVR_LIFT; for(let i=0;i<6;i++) acc+=w[i]*raw[i];
  const a = raw.map((v)=>clamp(Math.round(v+(base-acc)),20,92));
  for(let k=0;k<10;k++){
    const err=base-ratingAt(a,pos);
    if(Math.abs(err)<0.5) break;
    const order=[0,1,2,3,4,5].sort((i,j)=>w[j]-w[i]);
    a[order[0]]=clamp(a[order[0]]+(err>0?1:-1),20,92);
  }
  return { id, name:FIRST_NAMES[Math.floor(r0*FIRST_NAMES.length)]+" "+LAST_NAMES[Math.floor(r1*LAST_NAMES.length)],
    club, originClub:club, country:"England", age, pos, positions:DEFAULT_POSITIONS[pos],
    cat:POS_CAT[pos], pot, a, form:6.5, seasonForm:6.5, youth:true,
    st:emptyStats(), career:emptyCareer(), contract:3 };
}
/* ============================================================
   CONTRACTS
   Every player is on a deal of one to five years. It ticks down each summer,
   and when it runs out he leaves on a free unless somebody renews him. Your
   own renewals cost a signing-on fee and are yours to decide; the AI keeps
   whoever it still rates and lets the rest walk.
   ============================================================ */
const CONTRACT_MIN = 1, CONTRACT_MAX = 5;
// Young players sign long, veterans sign short, and nobody over 35 gets more
// than two years. Expiries are spread so they don't all fall due at once.
function contractSpan(age){
  if(age <= 23) return { min:2, max:7 };
  if(age <= 34) return { min:1, max:5 };
  return { min:1, max:2 };
}
function initialContract(p){
  const s = contractSpan(p.age);
  return s.min + Math.floor(unit(p.id, 77) * (s.max - s.min + 1));
}
// A signing-on fee, not a transfer. 12% of value on top of the 6% of squad
// value that goes out in wages every season.
function renewalFee(p){ return round1(Math.max(0.2, marketValue(p) * 0.12)); }
function renewalYears(p){
  const s = contractSpan(p.age);
  return Math.max(s.min, Math.min(s.max, p.age <= 23 ? 5 : p.age <= 29 ? 4 : p.age <= 34 ? 3 : 2));
}

const emptyStats=()=>({apps:0,goals:0,assists:0,cs:0,ratSum:0});
const emptyCareer=()=>({apps:0,goals:0,assists:0,titles:0,promotions:0,cl:0});
function initPlayer(p){
  return Object.assign({},p,{ form:round1(6.4+(ratingOf(p)-76)*0.022),
    seasonForm:round1(6.4+(ratingOf(p)-76)*0.022), st:emptyStats(), career:emptyCareer(),
    contract: initialContract(p) });
}

/* ============================================================
   MATCHWEEK
   ============================================================ */
const nextForm=(prev,pts)=>clamp((prev||0)*0.72+(pts-1.35)*0.42,-1.8,1.8);
function runMatchweek(players, customSquads, table, weekFixtures, season, mw, clubForm){
  const byId=new Map();
  players.forEach((p)=>byId.set(p.id, Object.assign({},p,{st:Object.assign({},p.st)})));
  const snapshot=Array.from(byId.values());
  const getStats=(club)=>cachedStats(club,snapshot,customSquads);
  let newTable=table; const results=[];
  weekFixtures.forEach((f)=>{
    const h=getStats(f.home), a=getStats(f.away);
    const r=simulateMatch(h,a,{homeForm:clubForm[f.home]||0, awayForm:clubForm[f.away]||0});
    const he=pickScorers(h.lineup,r.homeGoals), ae=pickScorers(a.lineup,r.awayGoals);
    const credit=(lineup,events,scored,conceded)=>{
      const gb={},ab={};
      events.forEach((e)=>{ gb[e.scorerId]=(gb[e.scorerId]||0)+1; if(e.assistId) ab[e.assistId]=(ab[e.assistId]||0)+1; });
      lineup.forEach((entry)=>{
        const p=byId.get(entry.player.id); if(!p) return;
        const g=gb[p.id]||0, as=ab[p.id]||0;
        const rt=matchRating(entry,{goals:g,assists:as,conceded,won:scored>conceded,drew:scored===conceded});
        p.st.apps+=1; p.st.goals+=g; p.st.assists+=as;
        if(conceded===0&&POS_CAT[entry.slotPos]==="DEF") p.st.cs+=1;
        p.st.ratSum+=rt;
        p.form=round1(clamp((p.form||6.5)*0.72+rt*0.28,3.5,9.8));
        p.seasonForm=round1(p.st.ratSum/p.st.apps);
      });
    };
    credit(h.lineup,he,r.homeGoals,r.awayGoals);
    credit(a.lineup,ae,r.awayGoals,r.homeGoals);
    newTable=applyResult(newTable,f.home,f.away,r.homeGoals,r.awayGoals);
    results.push({season,mw:mw+1,home:f.home,away:f.away,hg:r.homeGoals,ag:r.awayGoals,homeScorers:he,awayScorers:ae});
  });
  const nf=Object.assign({},clubForm);
  results.forEach((res)=>{
    const hp=res.hg>res.ag?3:res.hg===res.ag?1:0;
    nf[res.home]=nextForm(nf[res.home],hp);
    nf[res.away]=nextForm(nf[res.away],hp===3?0:hp===1?1:3);
  });
  return { players:Array.from(byId.values()), table:newTable, results, clubForm:nf };
}

/* ============================================================
   EUROPEAN COMPETITIONS
   Three of them, graded. What you earn depends entirely on how far you go:
   every club banks an entry fee, then picks up money per group result and a
   further payment for reaching each knockout round. Winning the Champions
   League outright is worth roughly ten times a Conference League campaign.
   ============================================================ */
const EURO_COMPS = {
  cl:   { key:"cl",   name:"Champions League",  size:32, engFrom:1, engTo:5,
          money:{ entry:12.6, win:1.7, draw:0.55, r16:7, qf:9.8, sf:12.6, final:16.8, champion:22.4 } },
  el:   { key:"el",   name:"Europa League",     size:16, engFrom:6, engTo:6,
          money:{ entry:5.6, win:0.85, draw:0.28, r16:0, qf:4.2, sf:5.6, final:7, champion:9.8 } },
  uecl: { key:"uecl", name:"Conference League", size:8,  engFrom:7, engTo:7,
          money:{ entry:2.8, win:0.5, draw:0.17, r16:0, qf:0, sf:2.8, final:3.5, champion:4.9 } },
};

// One competition: seeded groups of four, two-legged knockouts, one-off final.
function runEuroCup(cfg, entrants, players, customSquads, season){
  const teams = entrants.slice(0, cfg.size);
  const prize = {}; const add=(c,v)=>{ if(v) prize[c]=round1((prize[c]||0)+v); };
  const M = cfg.money;
  teams.forEach((c)=>add(c,M.entry));
  const statsOf={}; teams.forEach((c)=>{ statsOf[c]=teamStats(c,players,customSquads); });
  const matches=[]; const reached={};
  const strength=(c)=>statsOf[c].att+statsOf[c].mid+statsOf[c].def;

  // seed into pots so the draw stops throwing four giants into one group
  const ranked = teams.slice().sort((a,b)=>strength(b)-strength(a));
  const nGroups = teams.length/4;
  const pots=[];
  for(let p=0;p<4;p++) pots.push(shuffle(ranked.slice(p*nGroups,(p+1)*nGroups)));
  const groups=[];
  for(let g=0;g<nGroups;g++) groups.push(pots.map((pot)=>pot[g]).filter(Boolean));

  const advancing=[];
  groups.forEach((grp,gi)=>{
    let t=initTable(grp);
    generateFixtures(grp).forEach((round)=>round.forEach((f)=>{
      const r=simulateMatch(statsOf[f.home],statsOf[f.away]);
      t=applyResult(t,f.home,f.away,r.homeGoals,r.awayGoals);
      matches.push({comp:cfg.key,stage:"Group "+String.fromCharCode(65+gi),
        home:f.home,away:f.away,hg:r.homeGoals,ag:r.awayGoals,season});
      if(r.homeGoals>r.awayGoals) add(f.home,M.win);
      else if(r.homeGoals<r.awayGoals) add(f.away,M.win);
      else { add(f.home,M.draw); add(f.away,M.draw); }
    }));
    const order=sortedTable(t);
    advancing.push(order[0].club, order[1].club);
    grp.forEach((c)=>{ reached[c]="Group stage"; });
  });

  const plan=[["r16","Round of 16"],["qf","Quarter-final"],["sf","Semi-final"],["final","Final"]];
  const rounds=plan.slice(plan.length - Math.round(Math.log2(advancing.length)));
  let alive=shuffle(advancing);
  const bracket=[];
  rounds.forEach(([key,label])=>{
    alive.forEach((c)=>{ add(c,M[key]); reached[c]=label; });
    const next=[]; const ties=[];
    for(let i=0;i<alive.length;i+=2){
      const A=alive[i], B=alive[i+1];
      if(!B){ next.push(A); continue; }
      let hg,ag,pens=false;
      if(key==="final"){
        const r=simulateMatch(statsOf[A],statsOf[B]);
        hg=r.homeGoals; ag=r.awayGoals;
      } else {
        // two legs, so one freak result no longer decides a tie
        const l1=simulateMatch(statsOf[A],statsOf[B]), l2=simulateMatch(statsOf[B],statsOf[A]);
        hg=l1.homeGoals+l2.awayGoals; ag=l1.awayGoals+l2.homeGoals;
      }
      let winner;
      if(hg>ag) winner=A; else if(hg<ag) winner=B;
      else { pens=true; winner = strength(A)+Math.random()*6 >= strength(B)+Math.random()*6 ? A : B; }
      next.push(winner);
      ties.push({home:A,away:B,hg,ag,pens,winner});
      matches.push({comp:cfg.key,stage:label,home:A,away:B,hg,ag,pens,season});
    }
    bracket.push({label,ties});
    alive=next;
  });
  const champion=alive[0];
  if(champion){ add(champion,M.champion); reached[champion]="Winner"; }
  return { key:cfg.key, name:cfg.name, champion, prize, matches, bracket, teams, reached };
}

// Work out who is in what, then play all three.
function runEurope(order1, players, customSquads, season, cupWinner){
  const uefa = FOREIGN_CLUBS.filter((c)=>CL_ELIGIBLE.has(c))
    .sort((a,b)=>(FOREIGN_PULL[b]||0)-(FOREIGN_PULL[a]||0));
  let cursor = 0;
  const out = {};
  ["cl","el","uecl"].forEach((k)=>{
    const cfg = EURO_COMPS[k];
    let eng = order1.slice(cfg.engFrom-1, cfg.engTo);
    // the cup winner takes a Europa place of his own
    if(k==="el" && cupWinner && eng.indexOf(cupWinner)<0) eng = eng.concat([cupWinner]);
    const need = cfg.size - eng.length;
    const abroad = uefa.slice(cursor, cursor+need);
    cursor += need;
    out[k] = runEuroCup(cfg, eng.concat(abroad), players, customSquads, season);
  });
  return out;
}

/* ============================================================
   THE ENGLISH CUP
   Every club in both divisions, straight knockout, one leg, penalties if
   level. The smaller clubs get a real shot at a trophy and a payday.
   ============================================================ */
const CUP_MONEY = { r1:0.4, r32:0.85, r16:1.7, qf:3.1, sf:4.9, final:7, champion:11.2 };
function runEnglishCup(players, customSquads, tiers, season){
  const all = ENGLISH_CLUBS.slice();
  const statsOf={}; all.forEach((c)=>{ statsOf[c]=teamStats(c,players,customSquads); });
  const strength=(c)=>statsOf[c].att+statsOf[c].mid+statsOf[c].def;
  const prize={}; const add=(c,v)=>{ if(v) prize[c]=round1((prize[c]||0)+v); };
  const matches=[]; const reached={};
  all.forEach((c)=>{ reached[c]="First round"; });

  const seeded = all.slice().sort((a,b)=>strength(b)-strength(a));
  const byes = seeded.slice(0, all.length-16);            // the stronger half sit out round one
  const prelim = shuffle(seeded.slice(all.length-16));
  const tie=(A,B,stage)=>{
    const r=simulateMatch(statsOf[A],statsOf[B]);
    let hg=r.homeGoals, ag=r.awayGoals, pens=false, winner;
    if(hg>ag) winner=A; else if(hg<ag) winner=B;
    else { pens=true; winner = strength(A)+Math.random()*8 >= strength(B)+Math.random()*8 ? A : B; }
    matches.push({stage,home:A,away:B,hg,ag,pens,season});
    return winner;
  };
  prelim.forEach((c)=>add(c,CUP_MONEY.r1));
  const r1w=[];
  for(let i=0;i<prelim.length;i+=2) r1w.push(tie(prelim[i],prelim[i+1],"First round"));

  let alive = shuffle(byes.concat(r1w));
  const stages=[["r32","Second round"],["r16","Round of 16"],["qf","Quarter-final"],
                ["sf","Semi-final"],["final","Final"]];
  const bracket=[];
  stages.forEach(([key,label])=>{
    alive.forEach((c)=>{ add(c,CUP_MONEY[key]); reached[c]=label; });
    const next=[], ties=[];
    for(let i=0;i<alive.length;i+=2){
      const A=alive[i], B=alive[i+1];
      if(!B){ next.push(A); continue; }
      const w=tie(A,B,label);
      next.push(w);
      const m=matches[matches.length-1];
      ties.push({home:A,away:B,hg:m.hg,ag:m.ag,pens:m.pens,winner:w});
    }
    bracket.push({label,ties});
    alive=next;
  });
  const champion=alive[0];
  if(champion){ add(champion,CUP_MONEY.champion); reached[champion]="Winner"; }
  return { name:"English Cup", champion, prize, matches, bracket, reached };
}

/* ============================================================
   AI TRANSFER MARKET
   ============================================================ */
function squadCounts(players){ const c={}; players.forEach((p)=>{c[p.club]=(c[p.club]||0)+1;}); return c; }
function keeperCount(players,club){ return players.filter((p)=>p.club===club&&p.pos==="GK").length; }
function weakestSlots(players, club){
  const roster=players.filter((p)=>p.club===club);
  const slots=FORMATIONS["4-3-3"];
  const map=pickBestXI(roster,"4-3-3");
  const byId=new Map(roster.map((p)=>[p.id,p]));
  return slots.map((s)=>{ const p=map[s.id]!=null?byId.get(map[s.id]):null;
    return {pos:s.pos, current:p?effRating(p,s.pos):0}; }).sort((a,b)=>a.current-b.current);
}
function runAITransfers(players, budgets, ctx, userClub, maxPerClub){
  let list=players.map((p)=>Object.assign({},p));
  const bud=Object.assign({},budgets); const news=[];
  const clubs=shuffle(ALL_CLUBS.filter((c)=>c!==userClub));
  let counts=squadCounts(list);
  clubs.forEach((club)=>{
    let deals=0, guard=0;
    while(deals<maxPerClub && guard++<24){
      const size=counts[club]||0;
      if(size>25){
        const keepers=keeperCount(list,club);
        const out=list.filter((p)=>p.club===club&&!(p.pos==="GK"&&keepers<=2)).sort((a,b)=>ratingOf(a)-ratingOf(b))[0];
        // Releasing a player pays nothing — he walks for free. Paying clubs
        // for releases while the club that picked him up paid nothing was
        // minting money out of thin air, which is how a declining Arsenal
        // ended up sitting on £676M it could never spend.
        if(out){ list=list.map((p)=>p.id===out.id?Object.assign({},p,{club:"Free Agent"}):p);
          counts=squadCounts(list); deals++; continue; }
      }
      if(size>=25) break;
      const budget=bud[club]||0;
      const flush = budget > 120;
      // A rich club should not just patch its worst position season after
      // season — that levels every squad towards the middle and leaves the
      // big clubs quietly rotting. With money in the bank it looks across its
      // four weakest spots and buys the best player it can actually get.
      const weak = weakestSlots(list,club);
      const gap = flush ? weak[Math.floor(Math.random()*Math.min(4,weak.length))] : weak[0];
      if(!gap) break;
      // A club sitting on money will take a smaller upgrade rather than hoard.
      const minGain = flush ? 1.0 : 2.5;
      const targets=list
        .filter((p)=>p.club!==club&&p.club!=="Free Agent"&&p.club!==userClub&&(counts[p.club]||0)>17)
        .filter((p)=>(gap.pos==="GK"?p.pos==="GK":p.pos!=="GK"))
        .filter((p)=>p.pos!=="GK"||keeperCount(list,p.club)>2)
        .filter((p)=>effRating(p,gap.pos)>gap.current+minGain)
        .map((p)=>({p,price:askingPrice(p),gain:effRating(p,gap.pos)-gap.current,
                    chance:joinChance(p,club,list,ctx)}))
        .filter((t)=>t.price<=budget)
        // Chasing players who will obviously say no is exactly how a declining
        // club ended up with a vast bank balance and a relegation. Rank by what
        // the move is worth multiplied by the odds of it actually happening.
        .filter((t)=>t.chance>0.15)
        // Value per million when money is tight; raw quality when it is not.
        .sort((a,b)=> flush ? (b.gain*b.chance)-(a.gain*a.chance)
                            : (b.gain*b.chance)/Math.max(4,b.price)-(a.gain*a.chance)/Math.max(4,a.price))
        .slice(0,12);
      if(!targets.length){
        const roster=list.filter((p)=>p.club===club);
        const keepers=keeperCount(list,club);
        const spare=roster.filter((p)=>p.age>=30||ratingOf(p)<72)
          .filter((p)=>!(p.pos==="GK"&&keepers<=2))
          .sort((a,b)=>marketValue(b)-marketValue(a))[0];
        if(spare&&roster.length>19&&Math.random()<0.5){
          // Sell him to a club that actually wants him; money changes hands
          // between two clubs rather than appearing from nowhere.
          const fee=askingPrice(spare);
          const buyer=ALL_CLUBS.filter((c)=>c!==club&&c!==userClub&&(bud[c]||0)>=fee
              &&(counts[c]||0)<25&&Math.random()<joinChance(spare,c,list,ctx))[0];
          if(buyer){
            list=list.map((p)=>p.id===spare.id?Object.assign({},p,{club:buyer}):p);
            bud[buyer]=round1((bud[buyer]||0)-fee);
            bud[club]=round1((bud[club]||0)+fee*0.92);
          } else {
            list=list.map((p)=>p.id===spare.id?Object.assign({},p,{club:"Free Agent"}):p);
          }
          counts=squadCounts(list); deals++; continue;
        }
        break;
      }
      const pick=targets[Math.floor(Math.random()*Math.min(5,targets.length))];
      const seller=pick.p.club;
      if(Math.random()>joinChance(pick.p,club,list,ctx)){ guard++; continue; }
      list=list.map((p)=>p.id===pick.p.id?Object.assign({},p,{club}):p);
      counts=squadCounts(list);
      bud[club]=round1(budget-pick.price);
      bud[seller]=round1((bud[seller]||0)+pick.price*0.92);
      news.push({type:"transfer",big:ratingOf(pick.p)>=83,
        text:pick.p.name+" ("+ratingOf(pick.p)+") joins "+club+" from "+seller+" for £"+pick.price+"M."});
      deals++;
    }
  });
  // Free agents look for a club that suits them rather than being handed to
  // whoever is short of bodies — that is how a 90-rated player used to appear
  // in your squad out of nowhere.
  counts=squadCounts(list);
  ALL_CLUBS.forEach((club)=>{
    if(club===userClub) return;
    let guard=0;
    while((counts[club]||0)<18 && guard++<14){
      const pool=list.filter((p)=>p.club==="Free Agent").sort((a,b)=>ratingOf(b)-ratingOf(a));
      const fa=pool.find((p)=>Math.random()<joinChance(p,club,list,ctx)) || pool[pool.length-1];
      if(!fa) break;
      // A free transfer still costs a signing-on fee, and that money leaves
      // the economy rather than circulating back into it.
      const fee=round1(marketValue(fa)*0.45);
      if((bud[club]||0)<fee && (counts[club]||0)>=16) break;
      bud[club]=round1(Math.max(0,(bud[club]||0)-fee));
      list=list.map((p)=>p.id===fa.id?Object.assign({},p,{club}):p);
      counts=squadCounts(list);
    }
  });
  return { players:list, budgets:bud, news };
}
function generateOffersForUser(players, budgets, userClub, ctx, season){
  const roster=players.filter((p)=>p.club===userClub);
  if(roster.length<=17) return [];
  const offers=[];
  const wanted=roster.filter((p)=>ratingOf(p)>=74).sort((a,b)=>marketValue(b)-marketValue(a)).slice(0,10);
  const count=Math.floor(Math.random()*3);
  for(let i=0;i<count&&wanted.length;i++){
    const t=wanted[Math.floor(Math.random()*wanted.length)];
    if(offers.some((o)=>o.playerId===t.id)) continue;
    const price=askingPrice(t);
    const suitors=ALL_CLUBS.filter((c)=>c!==userClub&&(budgets[c]||0)>=price)
      .filter((c)=>Math.random()<(FOREIGN_SET.has(c)?0.5:0.28));
    if(!suitors.length) continue;
    const club=suitors[Math.floor(Math.random()*suitors.length)];
    offers.push({ id:season+"-"+t.id+"-"+club, playerId:t.id, name:t.name, club,
      fee:round1(marketValue(t)*(0.88+Math.random()*0.22)) });
  }
  return offers;
}

/* ============================================================
   END OF SEASON
   Prize money, promotion and relegation, a year of ageing, retirements and
   academy intake — for both divisions at once.
   ============================================================ */
function playoffWinner(order, players, customSquads){
  // 3rd–6th, two semi-finals and a final, all one-off games.
  const [a,b,c,d]=[order[2],order[3],order[4],order[5]];
  if(!d) return order[2];
  const S=(x)=>teamStats(x,players,customSquads);
  const tie=(x,y)=>{ const l1=simulateMatch(S(x),S(y)), l2=simulateMatch(S(y),S(x));
    const a=l1.homeGoals+l2.awayGoals, b=l1.awayGoals+l2.homeGoals;
    return a===b ? (Math.random()<0.5?x:y) : (a>b?x:y); };
  const f1=tie(a,d), f2=tie(b,c);
  return tie(f1,f2);
}

function endOfSeason(state){
  let players = state.players;
  const budgets = Object.assign({},state.budgets);
  const tiers = Object.assign({},state.tiers);
  const news = [];
  const order1 = sortedTable(state.tables[1]).map((r)=>r.club);
  const order2 = sortedTable(state.tables[2]).map((r)=>r.club);

  // Running costs. A squad has to be paid for every season, at roughly 6% of
  // what it is worth, so prize money does not simply pile up untouched — a
  // club that keeps an expensive squad and wins nothing bleeds.
  ALL_CLUBS.forEach((c)=>{
    const wage = round1(players.filter((p)=>p.club===c).reduce((a,p)=>a+marketValue(p),0)*0.06);
    budgets[c] = round1(Math.max(0,(budgets[c]||0) - wage));
  });
  order1.forEach((c,i)=>{ budgets[c]=round1((budgets[c]||0)+seasonPrize(i+1,1).total); });
  order2.forEach((c,i)=>{ budgets[c]=round1((budgets[c]||0)+seasonPrize(i+1,2).total); });
  FOREIGN_CLUBS.forEach((c)=>{ budgets[c]=round1((budgets[c]||0)+17+Math.random()*14); });

  // The cups were played through the season by the world module; the money
  // they generated is banked here, before the window opens.
  const euro = state.comps ? { cl:state.comps.cl, el:state.comps.el, uecl:state.comps.uecl } : null;
  const cup  = state.comps ? state.comps.cup : null;
  const cl   = euro ? euro.cl : null;

  // promotion and relegation
  const down = order1.slice(17);
  const upAuto = order2.slice(0,2);
  const upPlayoff = playoffWinner(order2, players, state.customSquads);
  const up = upAuto.concat([upPlayoff]);
  down.forEach((c)=>{ tiers[c]=2; });
  up.forEach((c)=>{ tiers[c]=1; });
  budgets[upPlayoff]=round1((budgets[upPlayoff]||0)+36);
  news.push({type:"promotion",big:true,text:"Promoted: "+up.join(", ")+". Relegated: "+down.join(", ")+"."});

  const champion1 = order1[0];
  players = players.map((p)=>{
    const won = p.club===champion1;
    const promoted = up.indexOf(p.club)>=0;
    return Object.assign({},p,{ career:{
      apps:(p.career.apps||0)+p.st.apps, goals:(p.career.goals||0)+p.st.goals,
      assists:(p.career.assists||0)+p.st.assists,
      titles:(p.career.titles||0)+(won?1:0),
      promotions:(p.career.promotions||0)+(promoted?1:0),
      cl:(p.career.cl||0)+((euro&&euro.cl&&p.club===euro.cl.champion)?1:0) } });
  });

  players = players.map(developPlayer);

  const retired=[];
  players = players.filter((p)=>{
    if(p.age>43){ retired.push(p); return false; }
    if(Math.random()<retirementChance(p)){ retired.push(p); return false; }
    return true;
  });
  // Anyone of yours who hangs up his boots is reported, however modest — a
  // player vanishing from your squad with no explanation is a bug in all but
  // name.
  retired.filter((p)=>p.club===state.myClub).forEach((p)=>{
    news.push({type:"retirement",big:true,
      text:p.name+" ("+ratingOf(p)+") retires at "+p.age+" after "+p.career.apps+" appearances for you."});
  });
  retired.filter((p)=>p.club!==state.myClub)
    .sort((a,b)=>ratingOf(b)-ratingOf(a)).slice(0,10).forEach((p)=>{
    news.push({type:"retirement",big:ratingOf(p)>=84,
      text:p.name+" retires at "+p.age+" — "+p.career.apps+" apps, "+p.career.goals+" goals"+
        (p.career.titles?", "+p.career.titles+" title"+(p.career.titles>1?"s":""):"")+"."});
  });

  // Contracts tick down. Anyone out of deal leaves on a free unless his club
  // wants him — the AI renews whoever it still rates, and yours are your call
  // (they show as expiring on the squad screen).
  const expired = [];
  players = players.map((p)=>{
    const yrs = (p.contract===undefined ? initialContract(p) : p.contract) - 1;
    return Object.assign({}, p, { contract: yrs });
  });
  const squadSize = squadCounts(players);
  players = players.map((p)=>{
    if(p.contract > 0) return p;
    // Yours are your call — they sit out of contract until you either renew
    // them or kick off the season without them.
    if(p.club === state.myClub) return p;
    const worth = ratingOf(p) >= 68 || p.age <= 23;
    const room  = (squadSize[p.club]||0) <= 24;
    if(worth && room && (budgets[p.club]||0) > renewalFee(p)){
      budgets[p.club] = round1(budgets[p.club] - renewalFee(p));
      return Object.assign({}, p, { contract: renewalYears(p) });
    }
    expired.push(p);
    return Object.assign({}, p, { club:"Free Agent", contract: 1 });
  });

  // Relegation costs you your best players.
  down.forEach((club)=>{
    const stars = players.filter((p)=>p.club===club && ratingOf(p)>=77);
    stars.forEach((s)=>{
      if(Math.random()<0.55){
        const buyers = ALL_CLUBS.filter((c)=>tiers[c]===1||FOREIGN_SET.has(c))
          .filter((c)=>(budgets[c]||0)>=askingPrice(s));
        if(!buyers.length) return;
        const to = buyers[Math.floor(Math.random()*buyers.length)];
        const fee = askingPrice(s);
        players = players.map((p)=>p.id===s.id?Object.assign({},p,{club:to}):p);
        budgets[to]=round1((budgets[to]||0)-fee);
        budgets[club]=round1((budgets[club]||0)+fee*0.92);
        if(club===state.myClub) news.push({type:"transfer",big:true,
          text:s.name+" leaves relegated "+club+" for "+to+" — £"+fee+"M."});
      }
    });
  });

  // academy intake
  let nextId = players.reduce((m,p)=>Math.max(m,p.id),0)+1;
  // Every club except yours has its academy re-rated from the squad it now
  // has, so a club on the way up grows a better academy and a fading one loses
  // it. Yours only moves when you pay for it.
  const academies = Object.assign({}, state.academies||{});
  ALL_CLUBS.forEach((c)=>{ if(c!==state.myClub) academies[c]=academyFromSquad(c,players); });
  if(academies[state.myClub]===undefined) academies[state.myClub]=academyFromSquad(state.myClub,players);
  const have=squadCounts(players);
  ALL_CLUBS.forEach((club)=>{
    const has = have[club]||0;
    const want = 19+Math.floor(Math.random()*3);
    let intake = clamp(want-has,0,5);
    if(club===state.myClub && intake===0 && has<24) intake=1;
    let needKeepers = Math.max(0, 2-keeperCount(players,club));
    if(needKeepers>0) intake=Math.max(intake,needKeepers);
    for(let i=0;i<intake;i++){
      const y=makeYouth(club, nextId++, academies[club], needKeepers>0?"GK":null);
      if(y.pos==="GK") needKeepers--;
      players.push(y);
      if(club===state.myClub) news.push({type:"youth",
        text:"Academy: "+y.name+" ("+y.pos+", "+y.age+") — "+ratingOf(y)+" now, ceiling "+y.pot+"."});
    }
  });

  players = players.map((p)=>Object.assign({},p,{st:emptyStats(),seasonForm:6.5}));
  const reputation = driftReputation(state.reputation||initReputation(players), players, order1, order2);
  return { players, budgets, tiers, academies, reputation, news, order1, order2,
           up, down, cl, euro, cup, retired, expired };
}

function topScorers(players, clubs, limit){
  const set=new Set(clubs);
  return players.filter((p)=>p.st&&p.st.goals>0&&set.has(p.club))
    .sort((a,b)=>b.st.goals-a.st.goals||b.st.assists-a.st.assists||ratingOf(b)-ratingOf(a))
    .slice(0,limit||12);
}
function topRated(players, clubs, limit){
  const set=new Set(clubs);
  return players.filter((p)=>p.st&&p.st.apps>=5&&set.has(p.club))
    .sort((a,b)=>b.seasonForm-a.seasonForm).slice(0,limit||12);
}


/* ============================================================
   THE REST OF THE FOOTBALL WORLD
   Every national league plays its own season alongside yours, week by week,
   and the European competitions are drawn from those tables and played out on
   scheduled matchdays rather than resolved in one lump at the end. Once every
   four years the Club World Cup takes the best of every continent.
   ============================================================ */
const FOREIGN_LEAGUES = Object.keys(LEAGUE_INFO);
const UEFA_LEAGUES = FOREIGN_LEAGUES.filter((l)=>["BRA","MLS","SAU"].indexOf(l)<0);
function clubsInLeague(l){ return Object.keys(LEAGUE_OF).filter((c)=>LEAGUE_OF[c]===l).sort(); }

// Which matchweeks each competition uses.
const EURO_SCHEDULE = {
  group:[3,5,7,9,11,13],
  r16:[20,22], qf:[25,27], sf:[30,32], final:[35],
};
const CUP_SCHEDULE = { "First round":4, "Second round":10, "Round of 16":16,
  "Quarter-final":24, "Semi-final":31, "Final":37 };

/* ---------- national leagues abroad ---------- */
function initForeignLeagues(){
  const out={};
  FOREIGN_LEAGUES.forEach((l)=>{
    const cs=clubsInLeague(l);
    if(cs.length<2) return;
    const fx=generateFixtures(cs);            // double round robin
    out[l]={ clubs:cs, table:initTable(cs), fixtures:fx, played:0,
             rounds:fx.length, name:LEAGUE_INFO[l].name };
  });
  return out;
}
// Spread each league's rounds evenly across the 38 English matchweeks.
function foreignRoundsDue(lg, mw){
  const target = Math.floor(mw * lg.rounds / 38);
  return Math.max(0, target - lg.played);
}
function advanceForeignLeagues(S, mw, stats){
  Object.keys(S.foreign||{}).forEach((l)=>{
    const lg=S.foreign[l];
    let due=foreignRoundsDue(lg,mw);
    while(due-- > 0 && lg.played < lg.rounds){
      lg.fixtures[lg.played].forEach((f)=>{
        const r=simulateMatch(stats(f.home),stats(f.away));
        lg.table=applyResult(lg.table,f.home,f.away,r.homeGoals,r.awayGoals);
      });
      lg.played++;
    }
  });
}

/* ---------- who qualifies for what ---------- */
function europeanEntrants(S){
  // England first, from last season's league table and cup
  const eng1 = S.lastOrder && S.lastOrder[1] && S.lastOrder[1].length
    ? S.lastOrder[1] : divisionClubs(1,S.tiers);
  const cupWinner = S.lastCupWinner;
  const cl=[], el=[], uecl=[];
  eng1.slice(0,5).forEach((c)=>cl.push(c));
  if(eng1[5]) el.push(eng1[5]);
  if(cupWinner && el.indexOf(cupWinner)<0 && cl.indexOf(cupWinner)<0) el.push(cupWinner);
  if(eng1[6]) uecl.push(eng1[6]);

  UEFA_LEAGUES.forEach((l)=>{
    const info=LEAGUE_INFO[l];
    const prev=S.lastForeignOrder && S.lastForeignOrder[l];
    const order = prev && prev.length ? prev : clubsInLeague(l)
      .slice().sort((a,b)=>(FOREIGN_PULL[b]||70)-(FOREIGN_PULL[a]||70));
    let i=0;
    for(let k=0;k<info.ucl && i<order.length;k++,i++) cl.push(order[i]);
    for(let k=0;k<info.uel && i<order.length;k++,i++) el.push(order[i]);
    for(let k=0;k<info.uecl && i<order.length;k++,i++) uecl.push(order[i]);
  });
  const rank=(c)=>-(FOREIGN_PULL[c]||75);
  return { cl:cl.sort((a,b)=>rank(a)-rank(b)).slice(0,32),
           el:el.sort((a,b)=>rank(a)-rank(b)).slice(0,32),
           uecl:uecl.sort((a,b)=>rank(a)-rank(b)).slice(0,24) };
}

/* ---------- a European competition, played over the season ---------- */
function drawEuroCup(cfg, teams, stats){
  const size = teams.length >= 32 ? 32 : teams.length >= 16 ? 16 : 8;
  const field = teams.slice(0,size);
  const strength=(c)=>{ const s=stats(c); return s.att+s.mid+s.def; };
  const ranked=field.slice().sort((a,b)=>strength(b)-strength(a));
  const nGroups=field.length/4;
  const pots=[];
  for(let p=0;p<4;p++) pots.push(shuffle(ranked.slice(p*nGroups,(p+1)*nGroups)));
  const groups=[];
  for(let g=0;g<nGroups;g++){
    const grp=pots.map((pot)=>pot[g]).filter(Boolean);
    groups.push({ clubs:grp, table:initTable(grp), fixtures:generateFixtures(grp) });
  }
  return { key:cfg.key, name:cfg.name, field, groups, groupsPlayed:0,
           stage:"group", alive:[], bracket:[], matches:[], prize:{}, reached:{},
           champion:null };
}
function euroPay(comp, club, amount){
  if(!amount) return;
  comp.prize[club]=round1((comp.prize[club]||0)+amount);
}
function playEuroGroupRound(comp, cfg, stats, season){
  const M=cfg.money;
  comp.groups.forEach((g,gi)=>{
    const round=g.fixtures[comp.groupsPlayed];
    if(!round) return;
    round.forEach((f)=>{
      const r=simulateMatch(stats(f.home),stats(f.away));
      g.table=applyResult(g.table,f.home,f.away,r.homeGoals,r.awayGoals);
      comp.matches.push({stage:"Group "+String.fromCharCode(65+gi),home:f.home,away:f.away,
        hg:r.homeGoals,ag:r.awayGoals,season});
      if(r.homeGoals>r.awayGoals) euroPay(comp,f.home,M.win);
      else if(r.homeGoals<r.awayGoals) euroPay(comp,f.away,M.win);
      else { euroPay(comp,f.home,M.draw); euroPay(comp,f.away,M.draw); }
    });
  });
  comp.groupsPlayed++;
  if(comp.groupsPlayed>=6){
    const adv=[];
    comp.groups.forEach((g)=>{ const o=sortedTable(g.table); adv.push(o[0].club,o[1].club);
      g.clubs.forEach((c)=>{ comp.reached[c]="Group stage"; }); });
    comp.alive=shuffle(adv);
    comp.stage="knockout";
  }
}
const KO_PLAN=[["r16","Round of 16"],["qf","Quarter-final"],["sf","Semi-final"],["final","Final"]];
function euroRoundsFor(n){ return KO_PLAN.slice(KO_PLAN.length - Math.round(Math.log2(n))); }
// leg 1 or leg 2 of the current knockout round
function playEuroKnockout(comp, cfg, stats, season, leg){
  if(comp.stage!=="knockout" || !comp.alive.length) return;
  const plan=euroRoundsFor(comp.alive.length);
  if(!plan.length){ return; }
  const [key,label]=plan[0];
  const M=cfg.money;
  if(leg===1){
    comp.alive.forEach((c)=>{ euroPay(comp,c,M[key]); comp.reached[c]=label; });
    comp.pending=[];
    for(let i=0;i<comp.alive.length;i+=2){
      const A=comp.alive[i], B=comp.alive[i+1];
      if(!B){ comp.pending.push({home:A,away:null,hg:0,ag:0,winner:A}); continue; }
      if(key==="final"){
        const r=simulateMatch(stats(A),stats(B),{neutral:true});
        comp.pending.push({home:A,away:B,hg:r.homeGoals,ag:r.awayGoals,single:true});
        comp.matches.push({stage:label,home:A,away:B,hg:r.homeGoals,ag:r.awayGoals,season});
      } else {
        const r=simulateMatch(stats(A),stats(B));
        comp.pending.push({home:A,away:B,hg:r.homeGoals,ag:r.awayGoals});
        comp.matches.push({stage:label+" (1st leg)",home:A,away:B,hg:r.homeGoals,ag:r.awayGoals,season});
      }
    }
    if(key==="final") settleEuroRound(comp,cfg,label);
  } else {
    (comp.pending||[]).forEach((t)=>{
      if(!t.away || t.single) return;
      const r=simulateMatch(stats(t.away),stats(t.home));
      t.hg += r.awayGoals; t.ag += r.homeGoals;
      comp.matches.push({stage:label+" (2nd leg)",home:t.away,away:t.home,
        hg:r.homeGoals,ag:r.awayGoals,season});
    });
    settleEuroRound(comp,cfg,label);
  }
}
function settleEuroRound(comp, cfg, label){
  const ties=[]; const next=[];
  (comp.pending||[]).forEach((t)=>{
    if(!t.away){ next.push(t.home); return; }
    let winner, pens=false;
    if(t.hg>t.ag) winner=t.home; else if(t.ag>t.hg) winner=t.away;
    else { pens=true; winner=Math.random()<0.5?t.home:t.away; }
    ties.push({home:t.home,away:t.away,hg:t.hg,ag:t.ag,pens,winner});
    next.push(winner);
  });
  comp.bracket.push({label,ties});
  comp.alive=next;
  comp.pending=null;
  if(comp.alive.length===1){
    comp.champion=comp.alive[0];
    comp.reached[comp.champion]="Winner";
    euroPay(comp,comp.champion,cfg.money.champion);
    comp.stage="done";
  }
}

/* ---------- the domestic cup, round by round ---------- */
function initEnglishCup(S, stats){
  const all=ENGLISH_CLUBS.slice();
  const strength=(c)=>{ const s=stats(c); return s.att+s.mid+s.def; };
  const seeded=all.slice().sort((a,b)=>strength(b)-strength(a));
  return { name:"English Cup", byes:seeded.slice(0,all.length-16),
           alive:shuffle(seeded.slice(all.length-16)), stage:"First round",
           bracket:[], matches:[], prize:{}, reached:{}, champion:null };
}
function playCupRound(cup, stats, season, label){
  const key={"First round":"r1","Second round":"r32","Round of 16":"r16",
    "Quarter-final":"qf","Semi-final":"sf","Final":"final"}[label];
  cup.alive.forEach((c)=>{ euroPay(cup,c,CUP_MONEY[key]); cup.reached[c]=label; });
  const next=[], ties=[];
  for(let i=0;i<cup.alive.length;i+=2){
    const A=cup.alive[i], B=cup.alive[i+1];
    if(!B){ next.push(A); continue; }
    const r=simulateMatch(stats(A),stats(B),{neutral:label==="Final"});
    let winner,pens=false;
    if(r.homeGoals>r.awayGoals) winner=A; else if(r.homeGoals<r.awayGoals) winner=B;
    else { pens=true; winner=Math.random()<0.5?A:B; }
    next.push(winner);
    ties.push({home:A,away:B,hg:r.homeGoals,ag:r.awayGoals,pens,winner});
    cup.matches.push({stage:label,home:A,away:B,hg:r.homeGoals,ag:r.awayGoals,pens,season});
  }
  cup.bracket.push({label,ties});
  // after the opening round the seeded clubs join in
  cup.alive = label==="First round" ? shuffle(cup.byes.concat(next)) : next;
  if(cup.alive.length===1){
    cup.champion=cup.alive[0]; cup.reached[cup.champion]="Winner";
    euroPay(cup,cup.champion,CUP_MONEY.champion);
  }
}

/* ---------- Club World Cup, every fourth summer ---------- */
const CWC_MONEY = { entry:14, win:2.5, draw:0.8, qf:9, sf:13, final:18, champion:30 };
function runClubWorldCup(players, customSquads, S, season){
  const st=(c)=>cachedStats(c,players,customSquads);
  const strength=(c)=>{ const s=st(c); return s.att+s.mid+s.def; };
  const pickTop=(league,n)=>{
    const prev=S.lastForeignOrder&&S.lastForeignOrder[league];
    const order=prev&&prev.length?prev:clubsInLeague(league).slice()
      .sort((a,b)=>strength(b)-strength(a));
    return order.slice(0,n);
  };
  let field=[];
  // Europe twelve, South America six, North America four, Asia two, plus England
  ["ESP","ITA","GER","FRA"].forEach((l)=>{ field=field.concat(pickTop(l,2)); });
  ["POR","NED","TUR","BEL"].forEach((l)=>{ field=field.concat(pickTop(l,1)); });
  field=field.concat(pickTop("BRA",6), pickTop("MLS",4), pickTop("SAU",2));
  const eng=(S.lastOrder&&S.lastOrder[1]&&S.lastOrder[1].length?S.lastOrder[1]:divisionClubs(1,S.tiers)).slice(0,4);
  field=field.concat(eng);
  field=field.filter((c,i)=>field.indexOf(c)===i).slice(0,32);

  const prize={}; const pay=(c,v)=>{ if(v) prize[c]=round1((prize[c]||0)+v); };
  field.forEach((c)=>pay(c,CWC_MONEY.entry));
  const matches=[], reached={};
  const ranked=field.slice().sort((a,b)=>strength(b)-strength(a));
  const pots=[]; for(let p=0;p<4;p++) pots.push(shuffle(ranked.slice(p*8,(p+1)*8)));
  const advancing=[];
  for(let g=0;g<8;g++){
    const grp=pots.map((pot)=>pot[g]).filter(Boolean);
    let t=initTable(grp);
    grp.forEach((A)=>grp.forEach((B)=>{
      if(A>=B) return;
      const r=simulateMatch(st(A),st(B),{neutral:true});
      t=applyResult(t,A,B,r.homeGoals,r.awayGoals);
      matches.push({stage:"Group "+String.fromCharCode(65+g),home:A,away:B,hg:r.homeGoals,ag:r.awayGoals,season});
      if(r.homeGoals>r.awayGoals) pay(A,CWC_MONEY.win);
      else if(r.homeGoals<r.awayGoals) pay(B,CWC_MONEY.win);
      else { pay(A,CWC_MONEY.draw); pay(B,CWC_MONEY.draw); }
    }));
    grp.forEach((c)=>{ reached[c]="Group stage"; });
    const o=sortedTable(t); advancing.push(o[0].club,o[1].club);
  }
  let alive=shuffle(advancing);
  const bracket=[];
  [["r16","Round of 16"],["qf","Quarter-final"],["sf","Semi-final"],["final","Final"]].forEach(([k,label])=>{
    if(alive.length<2) return;
    alive.forEach((c)=>{ pay(c,CWC_MONEY[k]||0); reached[c]=label; });
    const next=[],ties=[];
    for(let i=0;i<alive.length;i+=2){
      const A=alive[i],B=alive[i+1];
      if(!B){ next.push(A); continue; }
      const r=simulateMatch(st(A),st(B),{neutral:true});
      let w,pens=false;
      if(r.homeGoals>r.awayGoals) w=A; else if(r.homeGoals<r.awayGoals) w=B;
      else { pens=true; w=Math.random()<0.5?A:B; }
      next.push(w); ties.push({home:A,away:B,hg:r.homeGoals,ag:r.awayGoals,pens,winner:w});
      matches.push({stage:label,home:A,away:B,hg:r.homeGoals,ag:r.awayGoals,pens,season});
    }
    bracket.push({label,ties}); alive=next;
  });
  const champion=alive[0];
  if(champion){ pay(champion,CWC_MONEY.champion); reached[champion]="Winner"; }
  return { name:"Club World Cup", champion, prize, matches, bracket, field, reached };
}

/* ---------- wiring it all into the season ---------- */
function initWorld(S){
  invalidateStats();                       // fresh season, fresh squads
  const st=(c)=>cachedStats(c,S.players,S.customSquads);
  S.foreign = initForeignLeagues();
  const ent = europeanEntrants(S);
  S.comps = {
    cl:  drawEuroCup(EURO_COMPS.cl,  ent.cl,  st),
    el:  drawEuroCup(EURO_COMPS.el,  ent.el,  st),
    uecl:drawEuroCup(EURO_COMPS.uecl,ent.uecl,st),
    cup: initEnglishCup(S, st),
  };
}
// Called once per English matchweek: everything else in the world moves too.
function advanceWorld(S, mw){
  const st=(c)=>cachedStats(c,S.players,S.customSquads);
  advanceForeignLeagues(S, mw, st);
  if(!S.comps) return;
  ["cl","el","uecl"].forEach((k)=>{
    const comp=S.comps[k], cfg=EURO_COMPS[k];
    if(!comp) return;
    if(comp.stage==="group" && EURO_SCHEDULE.group.indexOf(mw)>=0) playEuroGroupRound(comp,cfg,st,S.season);
    else if(comp.stage==="knockout"){
      ["r16","qf","sf","final"].forEach((round)=>{
        const legs=EURO_SCHEDULE[round];
        if(legs.indexOf(mw)>=0) playEuroKnockout(comp,cfg,st,S.season,legs.indexOf(mw)+1);
      });
    }
  });
  const cup=S.comps.cup;
  if(cup && !cup.champion){
    Object.keys(CUP_SCHEDULE).forEach((label)=>{
      if(CUP_SCHEDULE[label]===mw && cup.stage===label){
        playCupRound(cup,st,S.season,label);
        const order=Object.keys(CUP_SCHEDULE);
        cup.stage=order[order.indexOf(label)+1]||"done";
      }
    });
  }
}
// Bank everything the cups paid out, and remember the tables for next year.
function settleWorld(S, budgets, news){
  const order={};
  Object.keys(S.foreign||{}).forEach((l)=>{
    order[l]=sortedTable(S.foreign[l].table).map((r)=>r.club);
  });
  S.lastForeignOrder=order;
  ["cl","el","uecl"].forEach((k)=>{
    const c=S.comps&&S.comps[k]; if(!c) return;
    Object.keys(c.prize).forEach((club)=>{ budgets[club]=round1((budgets[club]||0)+c.prize[club]); });
    if(c.champion) news.push({type:"cl",big:k==="cl",text:c.champion+" win the "+c.name+"."});
  });
  const cup=S.comps&&S.comps.cup;
  if(cup){
    Object.keys(cup.prize).forEach((club)=>{ budgets[club]=round1((budgets[club]||0)+cup.prize[club]); });
    if(cup.champion){ news.push({type:"cl",big:true,text:cup.champion+" win the English Cup."});
      S.lastCupWinner=cup.champion; }
  }
  return budgets;
}
