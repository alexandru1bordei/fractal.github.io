<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Manager — Career</title>
<style>
:root{
  --bg:#0B3D2E; --panel:#123B2C; --panel2:#164A36; --pitch:#0E4531;
  --chalk:#F2F5F0; --amber:#F5C242; --clay:#E2543D; --sky:#6FB4D8;
  --sage:#8FA99A; --green:#5FBF7A; --line:rgba(242,245,240,.14);
  --pitchline:rgba(242,245,240,.22);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--chalk);
  font:14px/1.45 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  overflow:hidden;
}
.mono{font-family:'JetBrains Mono',ui-monospace,'Cascadia Mono','Consolas',monospace}
.display{font-family:'Bebas Neue',Impact,'Haettenschweiler',sans-serif;letter-spacing:.02em}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
select,input{font:inherit;color:var(--chalk);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
select option{background:#0E2E22;color:var(--chalk)}
input[type=range]{accent-color:var(--amber);padding:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(242,245,240,.18);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;flex-direction:column;height:100%}
header{
  flex:0 0 auto;padding:10px 20px;border-bottom:1px solid var(--line);
  background:radial-gradient(circle at 50% 200%, var(--panel2) 0%, var(--bg) 65%);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap
}
.brand small{color:var(--amber);letter-spacing:.3em;font-size:10px;display:block}
.brand h1{font-size:30px;line-height:1}
.spacer{flex:1}
main{flex:1 1 auto;min-height:0;overflow-y:auto}
main.fill{overflow:hidden}
.wrap{max-width:1200px;margin:0 auto;padding:14px 20px}
main.fill .wrap{height:100%;display:flex;flex-direction:column;min-height:0}

.pill{
  font-family:'JetBrains Mono',monospace;font-size:12px;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
}
.pill.on{background:var(--amber);color:var(--bg);border-color:var(--amber)}
.pill.sky.on{background:var(--sky);border-color:var(--sky)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.card.lite{background:var(--panel2)}
.pad{padding:14px}
.muted{color:var(--sage)}
.amber{color:var(--amber)} .clay{color:var(--clay)} .green{color:var(--green)} .sky{color:var(--sky)}
.tiny{font-size:10px} .small{font-size:12px}
.tag{font-size:9px;padding:1px 5px;border-radius:4px;background:rgba(242,245,240,.08);color:var(--sage)}
.tag.xi{background:var(--amber);color:var(--bg)}
.tag.cl{background:rgba(111,180,216,.2);color:var(--sky)}
.stat{background:var(--panel2);border-radius:12px;padding:7px 11px;text-align:center;min-width:64px}
.stat b{display:block;font-family:'JetBrains Mono',monospace;font-size:17px}
.stat span{font-size:9px;letter-spacing:.12em;color:var(--sage)}
.grid{display:grid;gap:8px}
.scroll{overflow-y:auto;min-height:0}

table{width:100%;border-collapse:collapse;font-size:12px}
th{font-weight:400;color:var(--sage);text-align:right;padding:6px 5px;font-size:11px}
th.l,td.l{text-align:left}
td{text-align:right;padding:5px;border-top:1px solid var(--line);font-family:'JetBrains Mono',monospace}
tr.me{background:var(--panel2)}
tr.me td.l{color:var(--amber);font-weight:600}
.zone{display:inline-block;width:3px;height:12px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* lineup */
.lineup{display:flex;gap:12px;flex:1;min-height:0}
.pitchcol{width:310px;flex:0 0 auto;display:flex;flex-direction:column;min-height:0}
.pitchbox{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.pitch{
  position:relative;background:var(--pitch);border-radius:12px;overflow:hidden;
  aspect-ratio:3/4;width:min(100%, calc((100vh - 330px) * .75));
}
.pitch .mark{position:absolute;border:1px solid var(--pitchline)}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.slot .disc{
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;
  background:rgba(242,245,240,.12);color:var(--sage);border:2px solid var(--pitchline)
}
.slot.filled .disc{background:var(--amber);color:var(--bg);border-color:var(--amber)}
.slot.active .disc{background:var(--chalk);color:var(--bg);border-color:var(--chalk);box-shadow:0 0 0 4px rgba(242,245,240,.25)}
.slot em{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:8px;margin-top:2px;
  background:rgba(11,61,46,.6);padding:0 3px;border-radius:3px;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listcol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}

.prow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;background:var(--panel);
  font-family:'JetBrains Mono',monospace;font-size:12px;margin-bottom:4px;border:1px solid transparent}
.prow.sel{border-color:var(--amber);background:rgba(245,194,66,.16)}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.prow .pos{width:34px;text-align:center;font-size:10px;background:rgba(242,245,240,.08);border-radius:4px;padding:1px 0;color:var(--sage)}
.prow .rt{width:28px;text-align:right;font-weight:700}

.listrow{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);
  font-family:'JetBrains Mono',monospace;font-size:12px}
.listrow .grow{flex:1;min-width:0}
.listrow .l1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.listrow .l2{color:var(--sage);font-size:11px}

.modal{position:fixed;inset:0;background:rgba(4,20,14,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{width:100%;max-width:540px;max-height:90vh;overflow-y:auto;background:var(--panel2);
  border:1px solid var(--line);border-radius:16px;padding:18px}
.attr{background:var(--panel);border-radius:9px;padding:6px 9px}
.attr .bar{height:4px;border-radius:3px;background:rgba(242,245,240,.12);margin-top:4px}
.attr .bar i{display:block;height:4px;border-radius:3px}

.btn{border-radius:12px;padding:11px 14px;font-family:'Bebas Neue',Impact,sans-serif;font-size:18px;
  letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.primary{background:var(--amber);color:var(--bg)}
.btn.ghost{border:2px solid var(--sage);color:var(--chalk)}
.btn.danger{background:var(--clay);color:var(--chalk)}
.btn[disabled]{opacity:.5;cursor:default}
.badge{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;color:var(--bg);flex:0 0 auto}
.crest{width:34px;height:34px;border-radius:50%;background:var(--amber);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',Impact,sans-serif;font-size:13px;flex:0 0 auto}
.bracket{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.bracket .rnd{min-width:190px;flex:0 0 auto}
.bracket .tie{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 8px;margin-bottom:6px;font-size:11px;font-family:'JetBrains Mono',monospace}
@media(max-width:900px){
  .lineup{flex-direction:column}
  .pitchcol{width:auto}
  .pitch{width:min(100%, calc((100vh - 330px) * .75))}
  body{overflow:auto}
  main.fill{overflow-y:auto}
  main.fill .wrap{height:auto}
}
</style>
</head>

/* Positional familiarity: your own position is 100%, a listed alternative
   98%, and it falls away with every step across the pitch. */
const POS_ADJ = {
  GK:[], CB:["LB","RB","CDM"], LB:["CB","LM","LW"], RB:["CB","RM","RW"],
  CDM:["CB","CM"], CM:["CDM","CAM","LM","RM"], CAM:["CM","LW","RW","ST"],
  LM:["LB","CM","LW"], RM:["RB","CM","RW"], LW:["LM","CAM","ST","RW"],
  RW:["RM","CAM","ST","LW"], ST:["CAM","LW","RW"],
};
const FAM_BY_DIST = [1.0,0.96,0.91,0.86,0.81,0.77];
const POS_DIST = (() => { const d={}; ALL_POS.forEach((start)=>{ const dist={[start]:0}; const q=[start];
  while(q.length){ const cur=q.shift(); (POS_ADJ[cur]||[]).forEach((n)=>{ if(dist[n]===undefined){dist[n]=dist[cur]+1;q.push(n);} }); }
  d[start]=dist; }); return d; })();

function familiarity(player, slotPos){
  if(player.pos===slotPos) return 1;
  if((player.pos==="GK")!==(slotPos==="GK")) return 0.45;
  const d = POS_DIST[player.pos] ? POS_DIST[player.pos][slotPos] : undefined;
  const base = FAM_BY_DIST[Math.min(d===undefined?5:d,5)];
  return (player.positions||[]).includes(slotPos) ? Math.max(base,0.98) : base;
}
function effRating(player, slotPos){ return ratingAt(player.a, slotPos) * familiarity(player, slotPos); }

/* Hidden traits, derived from the id so they never need storing. */
function hash32(n){ let x=(n|0)+0x9e3779b9; x=Math.imul(x^(x>>>16),0x21f0aaad); x=Math.imul(x^(x>>>15),0x735a2d97); return (x^(x>>>15))>>>0; }
const unit = (id,salt) => hash32(id*7919+salt*104729)/4294967296;
const consistencyOf = (p) => 0.5+0.45*unit(p.id,11);
const growthTraitOf = (p) => 0.65+0.7*unit(p.id,37);

function gauss(mean,sd){ let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  return mean+sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function normCdf(z){ const t=1/(1+0.2316419*Math.abs(z)); const d=0.3989423*Math.exp((-z*z)/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-p:p; }

const POS_VALUE_MULT = { GK:0.62,CB:0.85,LB:0.92,RB:0.92,CDM:0.95,CM:1.0,CAM:1.08,LM:1.02,RM:1.02,LW:1.1,RW:1.1,ST:1.12 };
function ageValueMult(age){ return 1.28/(1+Math.exp((age-29.2)/2.5))+0.06; }
function marketValue(p){
  const r = ratingOf(p);
  let v = 0.4*Math.pow(1.208, r-60);
  v *= ageValueMult(p.age);
  v *= 1 + 0.022*Math.max(0,(p.pot||r)-r)*clamp((26-p.age)/8,0,1);
  v *= POS_VALUE_MULT[p.pos]||1;
  v *= 0.9 + 0.14*clamp(((p.form===undefined?6.7:p.form)-6.2)/1.6,0,1.4);
  return clamp(round1(v),0.2,350);
}
// You buy above valuation and sell below it. That spread is the main reason a
// bank balance alone cannot win you the league.
function askingPrice(p){ const r=ratingOf(p); return round1(marketValue(p)*(1.2+0.35*clamp((r-78)/12,0,1))); }
function salePrice(p){ return round1(marketValue(p)*0.86); }

/* ============================================================
   WHO WILL SIGN FOR YOU
   A top player will not drop into a mid-table side, and certainly not into
   the Championship, however much money is waved at him.
   ============================================================ */
function clubPull(club, players, ctx){
  if(FOREIGN_SET.has(club)) return FOREIGN_PULL[club]||80;
  const rs = players.filter((p)=>p.club===club).map(ratingOf).sort((a,b)=>b-a).slice(0,14);
  let pull = rs.length ? rs.reduce((a,b)=>a+b,0)/rs.length : 70;
  const tier = ctx && ctx.tiers ? ctx.tiers[club] : 1;
  if(tier===2) pull -= 6;                       // second-tier football is a hard sell
  if(ctx && ctx.lastOrder){
    const pos = ctx.lastOrder.indexOf(club)+1;
    if(pos>=1) pull += pos<=1?4:pos<=4?2.5:pos<=7?1:pos>=17?-2.5:0;
  }
  if(ctx && ctx.clRunners && ctx.clRunners.has(club)) pull += 3;   // European football sells itself
  return pull;
}
function joinChance(player, club, players, ctx){
  const r = ratingOf(player);
  const gap = r - (clubPull(club, players, ctx) + 2.5);
  const youthBonus = player.age<=21 ? 2.5 : 0;
  return clamp(1/(1+Math.exp((gap-youthBonus)/1.6)), 0.01, 0.99);
}

/* ============================================================
   SIMULATION ENGINE
   Chance creation = 0.65*MID + 0.30*ATT + 0.05*DEF. The gap between the two
   creation ratings drives a saturating Poisson rate; each chance converts as
   a Bernoulli trial against the opposing defence.
   Measured over 300 fresh seasons at these settings: the three strongest
   squads take ~80% of titles, the top six ~92%, a bottom-half club ~0.3%,
   and the title lands around 86 points.
   ============================================================ */
const BASE_CHANCES = 5.0;
const MID_SATURATION = 6.4;
const MATCH_NOISE = 3.0;
const CONVERSION_CAP = 0.55;
const MID_W = 0.65, ATT_W = 0.30, DEF_W = 0.05;
const HOME_ADV = 2.1;

const sigmoid = (x) => 1/(1+Math.exp(-x));
const creationRating = (t) => MID_W*t.mid + ATT_W*t.att + DEF_W*t.def;
function expectedChances(team,opp){ return 2*BASE_CHANCES*sigmoid((creationRating(team)-creationRating(opp))/MID_SATURATION); }
function samplePoisson(lambda){ if(lambda<=0)return 0; const L=Math.exp(-lambda); let k=0,p=1;
  do{k+=1;p*=Math.random();}while(p>L); return k-1; }
function goalProbability(attack,oppDefense){ if(attack<=0&&oppDefense<=0) return 0.5*CONVERSION_CAP;
  return (CONVERSION_CAP*attack)/(attack+oppDefense); }
function resolveChances(n,attack,oppDefense){ const p=goalProbability(attack,oppDefense); let g=0;
  for(let i=0;i<n;i++) if(Math.random()<p) g++; return g; }
function matchdayTeam(team,opts){
  opts = opts||{};
  const cons = team.consistency===undefined?0.75:team.consistency;
  const bump = (opts.home?HOME_ADV:0) + (opts.form||0) + gauss(0, MATCH_NOISE*(1.3-cons));
  return { att:team.att+bump, mid:team.mid+bump, def:team.def+bump*0.8, consistency:cons };
}
function simulateMatch(home,away,opts){
  opts = opts||{};
  const H = matchdayTeam(home,{home:!opts.neutral, form:opts.homeForm||0});
  const A = matchdayTeam(away,{home:false, form:opts.awayForm||0});
  const hc = samplePoisson(expectedChances(H,A)), ac = samplePoisson(expectedChances(A,H));
  return { homeChances:hc, awayChances:ac,
    homeGoals: resolveChances(hc,H.att,A.def), awayGoals: resolveChances(ac,A.att,H.def),
    homeConv: goalProbability(H.att,A.def), awayConv: goalProbability(A.att,H.def) };
}
function simulateMany(home,away,n){
  let hw=0,dr=0,aw=0,hg=0,ag=0,hc=0,ac=0;
  for(let i=0;i<n;i++){ const r=simulateMatch(home,away);
    if(r.homeGoals>r.awayGoals)hw++; else if(r.homeGoals<r.awayGoals)aw++; else dr++;
    hg+=r.homeGoals; ag+=r.awayGoals; hc+=r.homeChances; ac+=r.awayChances; }
  return { n, homeWinPct:hw/n, drawPct:dr/n, awayWinPct:aw/n,
    avgHomeGoals:hg/n, avgAwayGoals:ag/n, avgHomeChances:hc/n, avgAwayChances:ac/n };
}

/* Goals go to real players, weighted by finishing and by how far up the pitch
   they were asked to play. Striker weight and the exponent set the golden
   boot; at 1.0/2.0 the league's top scorer averaged 36 a season. */
const SCORE_W = { ST:0.8,LW:0.62,RW:0.62,CAM:0.5,LM:0.35,RM:0.35,CM:0.22,CDM:0.1,LB:0.07,RB:0.07,CB:0.09,GK:0.002 };
const ASSIST_W = { CAM:1.0,LW:0.85,RW:0.85,LM:0.8,RM:0.8,CM:0.7,LB:0.55,RB:0.55,ST:0.45,CDM:0.35,CB:0.12,GK:0.02 };
const SHO_EXPONENT = 1.7;
function weightedPick(entries){
  const total = entries.reduce((a,e)=>a+e.w,0);
  if(total<=0) return null;
  let r = Math.random()*total;
  for(const e of entries){ r-=e.w; if(r<=0) return e.item; }
  return entries[entries.length-1].item;
}
function pickScorers(lineup, goals){
  const events=[];
  if(!lineup||!lineup.length) return events;
  const sw = lineup.map((x)=>({item:x, w:(SCORE_W[x.slotPos]||0.1)*Math.pow(x.player.a[1]/60,SHO_EXPONENT)}));
  for(let i=0;i<goals;i++){
    const scorer = weightedPick(sw);
    if(!scorer) break;
    let assist=null;
    if(Math.random()<0.72){
      const aw = lineup.filter((x)=>x.player.id!==scorer.player.id)
        .map((x)=>({item:x, w:(ASSIST_W[x.slotPos]||0.1)*Math.pow(x.player.a[2]/60,1.6)}));
      assist = weightedPick(aw);
    }
    events.push({ scorerId:scorer.player.id, scorer:scorer.player.name,
      assistId: assist?assist.player.id:null, assist: assist?assist.player.name:null });
  }
  return events;
}
function matchRating(entry, ctx){
  let r = 6.0;
  r += ctx.goals*0.95 + ctx.assists*0.55;
  r += ctx.won?0.35:ctx.drew?0.05:-0.25;
  const cat = POS_CAT[entry.slotPos];
  if(cat==="DEF"||entry.slotPos==="GK"){
    r += ctx.conceded===0?0.55:-0.16*ctx.conceded;
    if(entry.slotPos==="GK") r += ctx.conceded===0?0.15:0;
  }
  if(cat==="ATT"&&ctx.goals===0&&ctx.assists===0) r -= 0.2;
  r += (effRating(entry.player, entry.slotPos)-78)*0.018;
  r += gauss(0, 0.62*(1.35-consistencyOf(entry.player)));
  return clamp(round1(r),3.0,10);
}

/* ============================================================
   BEST ELEVEN — chosen for the team, not slot by slot
   Filling slots in order and giving each the best man left is what makes an
   auto-pick look stupid: a holding midfielder gets taken by the centre-back
   slot processed before him. This maximises the total instead, from three
   different starting points so it does not settle in a poor local optimum.
   ============================================================ */
function pickBestXI(roster, formationKey, locked){
  const slots = FORMATIONS[formationKey]||FORMATIONS["4-3-3"];
  const players = roster.slice();
  if(!players.length) return {};
  const legal = (p,s) => (s.pos==="GK" ? p.pos==="GK" : p.pos!=="GK");
  const score = (p,s) => (legal(p,s) ? effRating(p,s.pos) : -1e6);
  const idx = new Map(players.map((p,i)=>[p.id,i]));
  const baseAt = new Array(slots.length).fill(-1);
  const baseUsed = new Set();
  const frozen = new Set();
  if(locked){
    slots.forEach((s,si)=>{ const id=locked[s.id]; if(id==null) return;
      const pi=idx.get(id); if(pi===undefined||baseUsed.has(pi)) return;
      baseAt[si]=pi; baseUsed.add(pi); frozen.add(si); });
  }
  const val = (si,pi) => (pi===-1?0:score(players[pi],slots[si]));
  function optimise(seed){
    const at = baseAt.slice(), used = new Set(baseUsed);
    seed(at,used);
    slots.forEach((s,si)=>{ if(at[si]!==-1) return;
      for(let pi=0;pi<players.length;pi++) if(!used.has(pi)&&legal(players[pi],s)){at[si]=pi;used.add(pi);break;} });
    let improved=true,guard=0;
    while(improved&&guard++<40){
      improved=false;
      for(let i=0;i<slots.length;i++){
        if(frozen.has(i)) continue;
        for(let j=0;j<slots.length;j++){
          if(i===j||frozen.has(j)) continue;
          const a=at[i],b=at[j];
          if(val(i,b)+val(j,a) > val(i,a)+val(j,b)+1e-9){ at[i]=b; at[j]=a; improved=true; }
        }
        for(let pi=0;pi<players.length;pi++){
          if(used.has(pi)) continue;
          const cur=at[i];
          if(val(i,pi) > val(i,cur)+1e-9){ if(cur!==-1) used.delete(cur); used.add(pi); at[i]=pi; improved=true; }
        }
      }
    }
    let total=0; for(let i=0;i<slots.length;i++) total+=val(i,at[i]);
    return {at,total};
  }
  const seedPairs = (at,used)=>{
    const pairs=[];
    slots.forEach((s,si)=>{ if(frozen.has(si)) return;
      players.forEach((p,pi)=>{ if(legal(p,s)) pairs.push({si,pi,v:score(p,s)}); }); });
    pairs.sort((a,b)=>b.v-a.v);
    pairs.forEach(({si,pi})=>{ if(at[si]===-1&&!used.has(pi)){at[si]=pi;used.add(pi);} });
  };
  const seedOrder = (rev)=>(at,used)=>{
    const order = slots.map((s,si)=>si).filter((si)=>!frozen.has(si));
    if(rev) order.reverse();
    order.forEach((si)=>{ let best=-1,bv=-Infinity;
      players.forEach((p,pi)=>{ if(used.has(pi)||!legal(p,slots[si])) return;
        const v=score(p,slots[si]); if(v>bv){bv=v;best=pi;} });
      if(best!==-1){at[si]=best;used.add(best);} });
  };
  let best=null;
  [seedPairs, seedOrder(false), seedOrder(true)].forEach((seed)=>{
    const r=optimise(seed); if(!best||r.total>best.total) best=r;
  });
  const chosen={};
  slots.forEach((s,si)=>{ if(best.at[si]!==-1) chosen[s.id]=players[best.at[si]].id; });
  return chosen;
}

function resolveLineup(roster, formationKey, slotMap){
  const slots = FORMATIONS[formationKey]||FORMATIONS["4-3-3"];
  const byId = new Map(roster.map((p)=>[p.id,p]));
  const used = new Set(); const out=[]; const missing=[];
  slots.forEach((s)=>{
    const id = slotMap?slotMap[s.id]:null;
    const p = id!=null?byId.get(id):null;
    if(p&&!used.has(p.id)){ used.add(p.id); out.push({slotId:s.id,slotPos:s.pos,player:p}); }
    else missing.push(s);
  });
  missing.forEach((s)=>{
    const cands = roster.filter((p)=>!used.has(p.id)&&(s.pos==="GK"?p.pos==="GK":p.pos!=="GK"));
    const pick = cands.sort((a,b)=>effRating(b,s.pos)-effRating(a,s.pos))[0];
    if(pick){ used.add(pick.id); out.push({slotId:s.id,slotPos:s.pos,player:pick,auto:true}); }
  });
  return out;
}
function statsFromLineup(lineup){
  const avg=(cat)=>{ const v=lineup.filter((x)=>POS_CAT[x.slotPos]===cat).map((x)=>effRating(x.player,x.slotPos));
    return v.length?round1(v.reduce((a,b)=>a+b,0)/v.length):0; };
  return { att:avg("ATT"), mid:avg("MID"), def:avg("DEF") };
}
function teamStats(club, players, customSquads){
  const roster = players.filter((p)=>p.club===club);
  const cs = customSquads[club];
  const filled = cs?Object.values(cs.slots).filter((v)=>v!=null).length:0;
  const useCustom = cs&&filled>=7;
  const formation = useCustom?cs.formation:"4-3-3";
  const slotMap = useCustom?cs.slots:pickBestXI(roster,formation);
  const lineup = resolveLineup(roster,formation,slotMap);
  const s = statsFromLineup(lineup);
  const cons = lineup.length?lineup.reduce((a,x)=>a+consistencyOf(x.player),0)/lineup.length:0.75;
  return { club, att:s.att, mid:s.mid, def:s.def, consistency:cons, lineup,
    roster:[...roster].sort((a,b)=>ratingOf(b)-ratingOf(a)),
    source: useCustom?("Custom XI ("+formation+")"):"Auto Best XI (4-3-3)", formation, slots:slotMap };
}

/* ============================================================
   FIXTURES & TABLE
   ============================================================ */
function shuffle(arr){ const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; } return a; }
function generateFixtures(clubs){
  const list = shuffle(clubs), n=list.length, fixed=list[0];
  let rot = list.slice(1); const half=[];
  for(let r=0;r<n-1;r++){
    const arr=[fixed].concat(rot), round=[];
    for(let i=0;i<n/2;i++){ const home=arr[i], away=arr[n-1-i];
      round.push(r%2===0?{home,away}:{home:away,away:home}); }
    half.push(round); rot.unshift(rot.pop());
  }
  return half.concat(half.map((rd)=>rd.map((m)=>({home:m.away,away:m.home}))));
}
function initTable(clubs){ const t={}; clubs.forEach((c)=>{t[c]={club:c,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};}); return t; }
function applyResult(table,home,away,hg,ag){
  const t = Object.assign({},table); t[home]=Object.assign({},table[home]); t[away]=Object.assign({},table[away]);
  const h=t[home], a=t[away];
  h.p++;a.p++;h.gf+=hg;h.ga+=ag;a.gf+=ag;a.ga+=hg;
  if(hg>ag){h.w++;h.pts+=3;a.l++;} else if(hg<ag){a.w++;a.pts+=3;h.l++;} else {h.d++;a.d++;h.pts++;a.pts++;}
  return t;
}
function sortedTable(table){
  return Object.values(table).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||x.club.localeCompare(y.club));
}
function ordinal(n){ const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }


/* ============================================================
   PRIZE MONEY
   Deliberately thin. League placings pay for the lights; European football is
   where the money actually is, which is what pulls the big clubs away from
   everyone else and makes climbing genuinely hard.
   ============================================================ */
function meritMoney(position, tier){
  return tier===2 ? round1(1 + 6*Math.exp(-(position-1)/5.5))
                  : round1(2.5 + 24*Math.exp(-(position-1)/5.5));
}
function europeanMoney(position, tier){
  if(tier!==1) return 0;
  if(position<=4) return 8;
  if(position===5) return 5;
  if(position<=7) return 3.5;
  return 0;
}
function titleBonus(position, tier){ return position===1 ? (tier===2?4:6) : 0; }
function promotionMoney(position, tier){
  if(tier!==2) return 0;
  if(position<=2) return 35;
  return 0;                       // the play-off winner is paid separately
}
function relegationParachute(position, tier){ return (tier===1 && position>=18) ? 12 : 0; }

function seasonPrize(position, tier){
  const merit = meritMoney(position,tier), euro = europeanMoney(position,tier);
  const title = titleBonus(position,tier), promo = promotionMoney(position,tier);
  const para = relegationParachute(position,tier);
  return { merit, euro, title, promo, para, total: round1(merit+euro+title+promo+para) };
}
function europeanLabel(position, tier){
  if(tier!==1) return null;
  if(position<=4) return "CHAMPIONS LEAGUE";
  if(position===5) return "EUROPA LEAGUE";
  if(position<=7) return "CONFERENCE LEAGUE";
  return null;
}
// What each stage of the European campaign pays.
const CL_MONEY = { entry:12, win:1.5, draw:0.5, r16:6, qf:8, sf:10, final:14, champion:18 };

function computeAllBudgets(players, tiers){
  const b={};
  ALL_CLUBS.forEach((c)=>{
    const rs = players.filter((p)=>p.club===c).map(ratingOf);
    const avg = rs.length ? rs.reduce((x,y)=>x+y,0)/rs.length : 70;
    let v = Math.max(4, Math.round(4 + (avg-70)*4));
    if(FOREIGN_SET.has(c)) v = Math.round(v*1.35);
    else if(tiers[c]===2) v = Math.max(3, Math.round(v*0.5));
    b[c]=v;
  });
  return b;
}

/* ============================================================
   AGEING, DEVELOPMENT, RETIREMENT, ACADEMIES
   ============================================================ */
function growthFactor(age){ return age<=19?0.36:age<=22?0.27:age<=25?0.16:age<=28?0.06:0; }
function declineFactor(age){ return age<=28?0:clamp(0.22*(age-28)+0.04*Math.pow(age-28,2),0,5.5); }
const DECLINE_BIAS = [1.7,0.75,0.35,0.9,0.7,1.5];
function applyRatingDelta(p, delta){
  const w = POS_W[p.pos]||POS_W.CM;
  const bias = delta<0 ? DECLINE_BIAS : w.map((x,i)=>0.6+2.2*w[i]);
  let wsum=0; for(let i=0;i<6;i++) wsum+=w[i]*bias[i];
  if(wsum<=0) return p.a;
  const target = clamp(ratingAt(p.a,p.pos)+delta,20,99);
  const ints = p.a.map((v,i)=>Math.round(clamp(v+(delta*bias[i])/wsum+gauss(0,0.5),20,99)));
  for(let k=0;k<8;k++){
    const err = target-ratingAt(ints,p.pos);
    if(Math.abs(err)<0.5) break;
    const order=[0,1,2,3,4,5].sort((i,j)=>w[j]-w[i]);
    let moved=false;
    for(const i of order){ const step=err>0?1:-1;
      if(ints[i]+step>=20&&ints[i]+step<=99){ints[i]+=step;moved=true;break;} }
    if(!moved) break;
  }
  return ints;
}
function developPlayer(p){
  const r = ratingAt(p.a,p.pos);
  const gap = Math.max(0,(p.pot||r)-r);
  // A player who never got on the pitch is neither in form nor out of it.
  const played = p.st && p.st.apps>0;
  const formF = played ? clamp((p.seasonForm-6.3)/1.2,-0.6,1.2) : 0;
  const minutesF = played ? clamp(p.st.apps/20,0.45,1.15) : (p.age<=21?0.7:0.45);
  const growth = gap*growthFactor(p.age)*growthTraitOf(p)*(1.0+0.5*formF)*minutesF;
  const decline = declineFactor(p.age)*(1.0-0.28*formF)*(0.9+0.25*(1-minutesF));
  // The ceiling is a ceiling — without this clip the random term ratchets a
  // lucky player past his potential year after year.
  const delta = Math.min(growth-decline+gauss(0,1.05), gap);
  const a = applyRatingDelta(p, delta);
  const newAge = p.age+1;
  let pot = p.pot||r;
  if(p.age<=23 && formF>0.8 && Math.random()<0.14) pot = Math.min(92, pot+Math.round(1+Math.random()*2));
  // Past the age where anyone improves, the ceiling comes down to meet him.
  if(newAge>=29) pot = ratingAt(a,p.pos); else pot = Math.max(ratingAt(a,p.pos), pot);
  return Object.assign({},p,{a,pot,age:newAge});
}
function retirementChance(p){
  const r = ratingAt(p.a,p.pos);
  if(p.age<30) return 0;
  const mu = (p.pos==="GK"?37.8:34.8)+clamp((r-78)*0.13,-1.5,2.2), sd=2.6;
  const surv = 1-normCdf((p.age-mu)/sd);
  if(surv<=0.02) return 1;
  return clamp((normCdf((p.age+1-mu)/sd)-normCdf((p.age-mu)/sd))/surv,0,1);
}

const FIRST_NAMES=["Alfie","Kai","Reuben","Jude","Tobias","Mateo","Luca","Ethan","Noah","Rafael","Ismael","Diogo","Kwame","Amir","Elias","Finn","Oscar","Milo","Theo","Nathan","Bilal","Youssef","Andrei","Stefan","Lars","Emre","Dario","Fabio","Malik","Jonas","Casper","Marek","Nikola","Adem","Rory","Callum","Seb","Dylan","Tariq","Zane"];
const LAST_NAMES=["Whitmore","Okafor","Bennett","Silva","Kovac","Andersen","Reyes","Dembele","Fletcher","Marchetti","Hollis","Nwosu","Bergmann","Vasquez","Doyle","Sanchis","Kowalski","Traore","Lindqvist","Ferreira","Ashworth","Bakker","Moreno","Halloran","Diallo","Petrov","Rossi","Vermeulen","Nkemba","Grimaldi","Sandoval","Ellery","Boateng","Larsen","Costa","Ravenhill","Ozturk","Mensah","Falcone","Duarte"];
const YOUTH_POS=[["GK",8],["CB",16],["LB",8],["RB",8],["CDM",9],["CM",12],["CAM",8],["LM",4],["RM",4],["LW",7],["RW",7],["ST",9]];
function randomYouthPos(){ let r=Math.random()*100; for(const [pos,w] of YOUTH_POS){ r-=w; if(r<=0) return pos; } return "CM"; }

// `standing` is the club's rank among all clubs, 0 (worst) to 1 (best).
// Deliberately relative: pinning academy quality to a club's absolute rating
// made the league feed on itself, every dip producing worse intakes.
function makeYouth(club, id, standing, forcePos, academy){
  const r0=unit(id,51), r1=unit(id,52);
  const pos = forcePos||randomYouthPos();
  const age = 16+Math.floor(Math.random()*3);
  const st = clamp(standing,0,1);
  // Each half-star of academy investment lifts what your youngsters can become.
  const potCenter = 74+12*st + 2.4*(academy||0);
  const wonder = Math.random()<0.035;
  const pot = clamp(Math.round(gauss(potCenter,4.6)+(wonder?7+Math.random()*6:0)),55,93);
  const base = clamp(Math.round(pot-(9+Math.random()*15)),42,pot-3);
  const shape=POS_SHAPE[pos], w=POS_W[pos];
  const raw = shape.map((s)=>s+gauss(0,3.0));
  let acc=OVR_LIFT; for(let i=0;i<6;i++) acc+=w[i]*raw[i];
  const a = raw.map((v)=>clamp(Math.round(v+(base-acc)),20,92));
  for(let k=0;k<10;k++){
    const err=base-ratingAt(a,pos);
    if(Math.abs(err)<0.5) break;
    const order=[0,1,2,3,4,5].sort((i,j)=>w[j]-w[i]);
    a[order[0]]=clamp(a[order[0]]+(err>0?1:-1),20,92);
  }
  return { id, name:FIRST_NAMES[Math.floor(r0*FIRST_NAMES.length)]+" "+LAST_NAMES[Math.floor(r1*LAST_NAMES.length)],
    club, originClub:club, country:"England", age, pos, positions:DEFAULT_POSITIONS[pos],
    cat:POS_CAT[pos], pot, a, form:6.5, seasonForm:6.5, youth:true, st:emptyStats(), career:emptyCareer() };
}
const emptyStats=()=>({apps:0,goals:0,assists:0,cs:0,ratSum:0});
const emptyCareer=()=>({apps:0,goals:0,assists:0,titles:0,promotions:0,cl:0});
function initPlayer(p){
  return Object.assign({},p,{ form:round1(6.4+(ratingOf(p)-76)*0.022),
    seasonForm:round1(6.4+(ratingOf(p)-76)*0.022), st:emptyStats(), career:emptyCareer() });

/* ============================================================
   MATCHWEEK
   ============================================================ */
const nextForm=(prev,pts)=>clamp((prev||0)*0.72+(pts-1.35)*0.42,-1.8,1.8);
function runMatchweek(players, customSquads, table, weekFixtures, season, mw, clubForm){
  const byId=new Map();
  players.forEach((p)=>byId.set(p.id, Object.assign({},p,{st:Object.assign({},p.st)})));
  const snapshot=Array.from(byId.values());
  const cache={};
  const getStats=(club)=>{ if(!cache[club]) cache[club]=teamStats(club,snapshot,customSquads); return cache[club]; };
  let newTable=table; const results=[];
  weekFixtures.forEach((f)=>{
    const h=getStats(f.home), a=getStats(f.away);
    const r=simulateMatch(h,a,{homeForm:clubForm[f.home]||0, awayForm:clubForm[f.away]||0});
    const he=pickScorers(h.lineup,r.homeGoals), ae=pickScorers(a.lineup,r.awayGoals);
    const credit=(lineup,events,scored,conceded)=>{
      const gb={},ab={};
      events.forEach((e)=>{ gb[e.scorerId]=(gb[e.scorerId]||0)+1; if(e.assistId) ab[e.assistId]=(ab[e.assistId]||0)+1; });
      lineup.forEach((entry)=>{
        const p=byId.get(entry.player.id); if(!p) return;
        const g=gb[p.id]||0, as=ab[p.id]||0;
        const rt=matchRating(entry,{goals:g,assists:as,conceded,won:scored>conceded,drew:scored===conceded});
        p.st.apps+=1; p.st.goals+=g; p.st.assists+=as;
        if(conceded===0&&POS_CAT[entry.slotPos]==="DEF") p.st.cs+=1;
        p.st.ratSum+=rt;
        p.form=round1(clamp((p.form||6.5)*0.72+rt*0.28,3.5,9.8));
        p.seasonForm=round1(p.st.ratSum/p.st.apps);
      });
    };
    credit(h.lineup,he,r.homeGoals,r.awayGoals);
    credit(a.lineup,ae,r.awayGoals,r.homeGoals);
    newTable=applyResult(newTable,f.home,f.away,r.homeGoals,r.awayGoals);
    results.push({season,mw:mw+1,home:f.home,away:f.away,hg:r.homeGoals,ag:r.awayGoals,homeScorers:he,awayScorers:ae});
  });
  const nf=Object.assign({},clubForm);
  results.forEach((res)=>{
    const hp=res.hg>res.ag?3:res.hg===res.ag?1:0;
    nf[res.home]=nextForm(nf[res.home],hp);
    nf[res.away]=nextForm(nf[res.away],hp===3?0:hp===1?1:3);
  });
  return { players:Array.from(byId.values()), table:newTable, results, clubForm:nf };
}

/* ============================================================
   CHAMPIONS LEAGUE
   Thirty-two clubs: the four that qualified from England plus the strongest
   twenty-eight abroad. Groups of four, then straight knockout on neutral
   ground. This is where the money is.
   ============================================================ */
function runChampionsLeague(players, customSquads, qualified, season){
  const abroad = FOREIGN_CLUBS.filter((c)=>CL_ELIGIBLE.has(c))
    .sort((a,b)=>(FOREIGN_PULL[b]||0)-(FOREIGN_PULL[a]||0)).slice(0,28);
  const teams = shuffle(qualified.concat(abroad)).slice(0,32);
  const prize={}; const add=(c,v)=>{ prize[c]=round1((prize[c]||0)+v); };
  teams.forEach((c)=>add(c,CL_MONEY.entry));
  const statsOf={}; teams.forEach((c)=>{ statsOf[c]=teamStats(c,players,customSquads); });
  const matches=[];

  // group stage
  const groups=[];
  for(let g=0;g<8;g++) groups.push(teams.slice(g*4,g*4+4));
  const advancing=[];
  groups.forEach((grp,gi)=>{
    const tbl=initTable(grp);
    let t=tbl;
    const fx=generateFixtures(grp);
    fx.forEach((round)=>round.forEach((f)=>{
      const r=simulateMatch(statsOf[f.home],statsOf[f.away],{});
      t=applyResult(t,f.home,f.away,r.homeGoals,r.awayGoals);
      matches.push({stage:"Group "+String.fromCharCode(65+gi),home:f.home,away:f.away,hg:r.homeGoals,ag:r.awayGoals,season});
      if(r.homeGoals>r.awayGoals) add(f.home,CL_MONEY.win);
      else if(r.homeGoals<r.awayGoals) add(f.away,CL_MONEY.win);
      else { add(f.home,CL_MONEY.draw); add(f.away,CL_MONEY.draw); }
    }));
    const order=sortedTable(t);
    advancing.push(order[0].club, order[1].club);
  });

  // knockout, single leg on neutral ground
  const rounds=[["r16","Round of 16"],["qf","Quarter-final"],["sf","Semi-final"],["final","Final"]];
  let alive=shuffle(advancing);
  const bracket=[];
  rounds.forEach(([key,label])=>{
    alive.forEach((c)=>add(c,CL_MONEY[key]));
    const next=[]; const ties=[];
    for(let i=0;i<alive.length;i+=2){
      const A=alive[i], B=alive[i+1];
      if(!B){ next.push(A); continue; }
      let r=simulateMatch(statsOf[A],statsOf[B],{neutral:true});
      let hg=r.homeGoals, ag=r.awayGoals, pens=null;
      if(hg===ag){ // a shoot-out rather than a replay
        const a=Math.random()*(statsOf[A].def+statsOf[A].att), b=Math.random()*(statsOf[B].def+statsOf[B].att);
        pens = a>=b ? "A" : "B";
      }
      const winner = hg>ag ? A : hg<ag ? B : (pens==="A"?A:B);
      next.push(winner);
      ties.push({home:A,away:B,hg,ag,pens:!!pens,winner});
      matches.push({stage:label,home:A,away:B,hg,ag,pens:!!pens,season});
    }
    bracket.push({label,ties});
    alive=next;
  });
  const champion=alive[0];
  if(champion) add(champion,CL_MONEY.champion);
  return { champion, prize, matches, bracket, teams };
}

/* ============================================================
   AI TRANSFER MARKET
   ============================================================ */
function squadCounts(players){ const c={}; players.forEach((p)=>{c[p.club]=(c[p.club]||0)+1;}); return c; }
function keeperCount(players,club){ return players.filter((p)=>p.club===club&&p.pos==="GK").length; }
function weakestSlots(players, club){
  const roster=players.filter((p)=>p.club===club);
  const slots=FORMATIONS["4-3-3"];
  const map=pickBestXI(roster,"4-3-3");
  const byId=new Map(roster.map((p)=>[p.id,p]));
  return slots.map((s)=>{ const p=map[s.id]!=null?byId.get(map[s.id]):null;
    return {pos:s.pos, current:p?effRating(p,s.pos):0}; }).sort((a,b)=>a.current-b.current);
}
function runAITransfers(players, budgets, ctx, userClub, maxPerClub){
  let list=players.map((p)=>Object.assign({},p));
  const bud=Object.assign({},budgets); const news=[];
  const clubs=shuffle(ALL_CLUBS.filter((c)=>c!==userClub));
  let counts=squadCounts(list);
  clubs.forEach((club)=>{
    let deals=0, guard=0;
    while(deals<maxPerClub && guard++<24){
      const size=counts[club]||0;
      if(size>25){
        const keepers=keeperCount(list,club);
        const out=list.filter((p)=>p.club===club&&!(p.pos==="GK"&&keepers<=2)).sort((a,b)=>ratingOf(a)-ratingOf(b))[0];
        if(out){ list=list.map((p)=>p.id===out.id?Object.assign({},p,{club:"Free Agent"}):p);
          counts=squadCounts(list); bud[club]=round1((bud[club]||0)+salePrice(out)*0.6); deals++; continue; }
      }
      if(size>=25) break;
      const gap=weakestSlots(list,club)[0];
      if(!gap) break;
      const budget=bud[club]||0;
      const targets=list
        .filter((p)=>p.club!==club&&p.club!=="Free Agent"&&p.club!==userClub&&(counts[p.club]||0)>17)
        .filter((p)=>(gap.pos==="GK"?p.pos==="GK":p.pos!=="GK"))
        .filter((p)=>p.pos!=="GK"||keeperCount(list,p.club)>2)
        .filter((p)=>effRating(p,gap.pos)>gap.current+2.5)
        .map((p)=>({p,price:askingPrice(p),gain:effRating(p,gap.pos)-gap.current}))
        .filter((t)=>t.price<=budget)
        .sort((a,b)=>b.gain/Math.max(4,b.price)-a.gain/Math.max(4,a.price))
        .slice(0,12);
      if(!targets.length){
        const roster=list.filter((p)=>p.club===club);
        const keepers=keeperCount(list,club);
        const spare=roster.filter((p)=>p.age>=30||ratingOf(p)<72)
          .filter((p)=>!(p.pos==="GK"&&keepers<=2))
          .sort((a,b)=>marketValue(b)-marketValue(a))[0];
        if(spare&&roster.length>19&&Math.random()<0.5){
          list=list.map((p)=>p.id===spare.id?Object.assign({},p,{club:"Free Agent"}):p);
          counts=squadCounts(list); bud[club]=round1((bud[club]||0)+salePrice(spare)); deals++; continue;
        }
        break;
      }
      const pick=targets[Math.floor(Math.random()*Math.min(5,targets.length))];
      const seller=pick.p.club;
      if(Math.random()>joinChance(pick.p,club,list,ctx)){ guard++; continue; }
      list=list.map((p)=>p.id===pick.p.id?Object.assign({},p,{club}):p);
      counts=squadCounts(list);
      bud[club]=round1(budget-pick.price);
      bud[seller]=round1((bud[seller]||0)+pick.price*0.92);
      news.push({type:"transfer",big:ratingOf(pick.p)>=83,
        text:pick.p.name+" ("+ratingOf(pick.p)+") joins "+club+" from "+seller+" for £"+pick.price+"M."});
      deals++;
    }
  });
  counts=squadCounts(list);
  ALL_CLUBS.forEach((club)=>{
    let guard=0;
    while((counts[club]||0)<18 && guard++<12){
      const fa=list.filter((p)=>p.club==="Free Agent").sort((a,b)=>ratingOf(b)-ratingOf(a))[0];
      if(!fa) break;
      list=list.map((p)=>p.id===fa.id?Object.assign({},p,{club}):p);
      counts=squadCounts(list);
    }
  });
  return { players:list, budgets:bud, news };
}
function generateOffersForUser(players, budgets, userClub, ctx, season){
  const roster=players.filter((p)=>p.club===userClub);
  if(roster.length<=17) return [];
  const offers=[];
  const wanted=roster.filter((p)=>ratingOf(p)>=72).sort((a,b)=>marketValue(b)-marketValue(a)).slice(0,10);
  const count=Math.floor(Math.random()*4);
  for(let i=0;i<count&&wanted.length;i++){
    const t=wanted[Math.floor(Math.random()*wanted.length)];
    if(offers.some((o)=>o.playerId===t.id)) continue;
    const price=askingPrice(t);
    const suitors=ALL_CLUBS.filter((c)=>c!==userClub&&(budgets[c]||0)>=price)
      .filter((c)=>Math.random()<(FOREIGN_SET.has(c)?0.5:0.28));
    if(!suitors.length) continue;
    const club=suitors[Math.floor(Math.random()*suitors.length)];
    offers.push({ id:season+"-"+t.id+"-"+club, playerId:t.id, name:t.name, club,
      fee:round1(price*(1.0+Math.random()*0.35)) });
  }
  return offers;
}

/* ============================================================
   END OF SEASON
   Prize money, promotion and relegation, a year of ageing, retirements and
   academy intake — for both divisions at once.
   ============================================================ */
function playoffWinner(order, players, customSquads){
  // 3rd–6th, two semi-finals and a final, all one-off games.
  const [a,b,c,d]=[order[2],order[3],order[4],order[5]];
  if(!d) return order[2];
  const S=(x)=>teamStats(x,players,customSquads);
  const tie=(x,y)=>{ const r=simulateMatch(S(x),S(y),{neutral:true});
    return r.homeGoals===r.awayGoals ? (Math.random()<0.5?x:y) : (r.homeGoals>r.awayGoals?x:y); };
  const f1=tie(a,d), f2=tie(b,c);
  return tie(f1,f2);
}

function endOfSeason(state){
  let players = state.players;
  const budgets = Object.assign({},state.budgets);
  const tiers = Object.assign({},state.tiers);
  const news = [];
  const order1 = sortedTable(state.tables[1]).map((r)=>r.club);
  const order2 = sortedTable(state.tables[2]).map((r)=>r.club);

  order1.forEach((c,i)=>{ budgets[c]=round1((budgets[c]||0)+seasonPrize(i+1,1).total); });
  order2.forEach((c,i)=>{ budgets[c]=round1((budgets[c]||0)+seasonPrize(i+1,2).total); });
  FOREIGN_CLUBS.forEach((c)=>{ budgets[c]=round1((budgets[c]||0)+14+Math.random()*12); });

  // Champions League for next season's qualifiers is played now, on this
  // season's squads, and paid out before the window opens.
  const cl = runChampionsLeague(players, state.customSquads, order1.slice(0,4), state.season);
  Object.keys(cl.prize).forEach((c)=>{ budgets[c]=round1((budgets[c]||0)+cl.prize[c]); });
  if(cl.champion) news.push({type:"cl",big:true,text:cl.champion+" win the Champions League."});

  // promotion and relegation
  const down = order1.slice(17);
  const upAuto = order2.slice(0,2);
  const upPlayoff = playoffWinner(order2, players, state.customSquads);
  const up = upAuto.concat([upPlayoff]);
  down.forEach((c)=>{ tiers[c]=2; });
  up.forEach((c)=>{ tiers[c]=1; });
  budgets[upPlayoff]=round1((budgets[upPlayoff]||0)+30);
  news.push({type:"promotion",big:true,text:"Promoted: "+up.join(", ")+". Relegated: "+down.join(", ")+"."});

  const champion1 = order1[0];
  players = players.map((p)=>{
    const won = p.club===champion1;
    const promoted = up.indexOf(p.club)>=0;
    return Object.assign({},p,{ career:{
      apps:(p.career.apps||0)+p.st.apps, goals:(p.career.goals||0)+p.st.goals,
      assists:(p.career.assists||0)+p.st.assists,
      titles:(p.career.titles||0)+(won?1:0),
      promotions:(p.career.promotions||0)+(promoted?1:0),
      cl:(p.career.cl||0)+(p.club===cl.champion?1:0) } });
  });

  players = players.map(developPlayer);

  const retired=[];
  players = players.filter((p)=>{
    if(p.age>43){ retired.push(p); return false; }
    if(Math.random()<retirementChance(p)){ retired.push(p); return false; }
    return true;
  });
  retired.sort((a,b)=>ratingOf(b)-ratingOf(a)).slice(0,12).forEach((p)=>{
    news.push({type:"retirement",big:ratingOf(p)>=82,
      text:p.name+" retires at "+p.age+" — "+p.career.apps+" apps, "+p.career.goals+" goals"+
        (p.career.titles?", "+p.career.titles+" title"+(p.career.titles>1?"s":""):"")+"."});
  });

  // Relegation costs you your best players.
  down.forEach((club)=>{
    const stars = players.filter((p)=>p.club===club && ratingOf(p)>=77);
    stars.forEach((s)=>{
      if(Math.random()<0.55){
        const buyers = ALL_CLUBS.filter((c)=>tiers[c]===1||FOREIGN_SET.has(c))
          .filter((c)=>(budgets[c]||0)>=askingPrice(s));
        if(!buyers.length) return;
        const to = buyers[Math.floor(Math.random()*buyers.length)];
        const fee = askingPrice(s);
        players = players.map((p)=>p.id===s.id?Object.assign({},p,{club:to}):p);
        budgets[to]=round1((budgets[to]||0)-fee);
        budgets[club]=round1((budgets[club]||0)+fee*0.92);
        if(club===state.myClub) news.push({type:"transfer",big:true,
          text:s.name+" leaves relegated "+club+" for "+to+" — £"+fee+"M."});
      }
    });
  });

  // academy intake
  let nextId = players.reduce((m,p)=>Math.max(m,p.id),0)+1;
  const ranked = ALL_CLUBS.map((c)=>({c,pull:clubPull(c,players,{tiers})})).sort((a,b)=>a.pull-b.pull);
  const standingOf={}; ranked.forEach((r,i)=>{ standingOf[r.c]= ranked.length>1 ? i/(ranked.length-1) : 0.5; });
  const have=squadCounts(players);
  ALL_CLUBS.forEach((club)=>{
    const has = have[club]||0;
    const want = 19+Math.floor(Math.random()*3);
    let intake = clamp(want-has,0,5);
    if(club===state.myClub && intake===0 && has<24) intake=1;
    let needKeepers = Math.max(0, 2-keeperCount(players,club));
    if(needKeepers>0) intake=Math.max(intake,needKeepers);
    for(let i=0;i<intake;i++){
      const y=makeYouth(club,nextId++,standingOf[club], needKeepers>0?"GK":null,
        club===state.myClub ? (state.academy||0) : 0);
      if(y.pos==="GK") needKeepers--;
      players.push(y);
      if(club===state.myClub) news.push({type:"youth",
        text:"Academy: "+y.name+" ("+y.pos+", "+y.age+") — "+ratingOf(y)+" now, ceiling "+y.pot+"."});
    }
  });

  players = players.map((p)=>Object.assign({},p,{st:emptyStats(),seasonForm:6.5}));
  return { players, budgets, tiers, news, order1, order2, up, down, cl, retired };
}

function topScorers(players, clubs, limit){
  const set=new Set(clubs);
  return players.filter((p)=>p.st&&p.st.goals>0&&set.has(p.club))
    .sort((a,b)=>b.st.goals-a.st.goals||b.st.assists-a.st.assists||ratingOf(b)-ratingOf(a))
    .slice(0,limit||12);

  return players.filter((p)=>p.st&&p.st.apps>=5&&set.has(p.club))
    .sort((a,b)=>b.seasonForm-a.seasonForm).slice(0,limit||12);
}

function viewClubPicker(){
  const rows=(tier)=>divClubs(tier).map((c)=>{
    const squad=S.players.filter((p)=>p.club===c);
    const top11=squad.map(ratingOf).sort((a,b)=>b-a).slice(0,11);
    const avg=top11.length?round1(top11.reduce((a,b)=>a+b,0)/top11.length):70;
    const star=squad.slice().sort((a,b)=>ratingOf(b)-ratingOf(a))[0];
    return {c,avg,star};
  }).sort((a,b)=>b.avg-a.avg).map((r)=>{
    const d = r.avg>=84?["COMFORTABLE","var(--green)"]:r.avg>=81?["COMPETITIVE","var(--amber)"]
            : r.avg>=77?["HARD","var(--sky)"]:["BRUTAL","var(--clay)"];
    return '<button class="card pad" style="display:flex;align-items:center;gap:12px;text-align:left;width:100%" data-act="pick:'+esc(r.c)+'">'
      + crest(r.c)
      + '<div style="flex:1;min-width:0"><div class="display" style="font-size:19px">'+esc(r.c.toUpperCase())+'</div>'
      + '<div class="mono tiny" style="color:'+d[1]+'">'+d[0]+(r.star?" &middot; "+esc(r.star.name):"")+'</div></div>'
      + '<div class="mono small" style="text-align:right"><div class="muted">XI '+r.avg+'</div></div></button>';
  }).join("");
  return '<div class="mono small muted" style="margin-bottom:12px">'
    + 'Pick any club in either division. Take a Premier League side and defend your place, or start in the Championship and try to get up. '
    + 'Prize money is thin, the best players will not sign for a small club, and finishing in the bottom three sends you down.'
    + '</div>'
    + '<div class="row" style="margin-bottom:10px">'
    + pill("PREMIER LEAGUE", S.tableTier===1, "ptier:1")
    + pill("CHAMPIONSHIP", S.tableTier===2, "ptier:2")
    + '</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">'+rows(S.tableTier)+'</div>';
}

function viewTable(){
  const tier=S.tableTier;
  const rows=sortedTable(S.tables[tier]);
  const zone=(i)=> tier===1
    ? (i===0?"var(--amber)":i<4?"#9BD17F":i===4?"var(--sky)":i<7?"rgba(111,180,216,.55)":i>=17?"var(--clay)":"transparent")
    : (i<2?"var(--green)":i<6?"var(--sky)":i>=17?"var(--clay)":"transparent");
  const body=rows.map((r,i)=>{
    const gd=r.gf-r.ga;
    return '<tr class="'+(r.club===S.myClub?"me":"")+'"><td class="l muted"><span class="zone" style="background:'+zone(i)+'"></span>'+(i+1)+'</td>'
      +'<td class="l">'+esc(r.club)+'</td><td>'+r.p+'</td><td>'+r.w+'</td><td>'+r.d+'</td><td>'+r.l+'</td>'
      +'<td>'+(gd>0?"+"+gd:gd)+'</td><td><b>'+r.pts+'</b></td></tr>';
  }).join("");
  const legend = tier===1
    ? '<span><span class="zone" style="background:#9BD17F"></span>Champions League (1–4)</span> '
      +'<span><span class="zone" style="background:var(--sky)"></span>Europa (5)</span> '
      +'<span><span class="zone" style="background:rgba(111,180,216,.55)"></span>Conference (6–7)</span> '
      +'<span><span class="zone" style="background:var(--clay)"></span>Relegation (18–20)</span>'
    : '<span><span class="zone" style="background:var(--green)"></span>Promoted (1–2)</span> '
      +'<span><span class="zone" style="background:var(--sky)"></span>Play-offs (3–6)</span> '
      +'<span><span class="zone" style="background:var(--clay)"></span>Relegation (18–20)</span>';
  return '<div class="row" style="margin-bottom:10px">'
    + pill("PREMIER LEAGUE", tier===1, "tier:1") + pill("CHAMPIONSHIP", tier===2, "tier:2") + '</div>'
    + '<div class="card" style="overflow:hidden"><table><thead><tr><th class="l">#</th><th class="l">Club</th>'
    + '<th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead><tbody>'+body+'</tbody></table>'
    + '<div class="mono tiny muted pad" style="display:flex;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line)">'+legend+'</div></div>';
}

function viewSquad(){
  const t=teamStats(S.myClub,S.players,S.customSquads);
  const xi=new Set(t.lineup.map((x)=>x.player.id));
  const cmp={ rating:(a,b)=>ratingOf(b)-ratingOf(a), pot:(a,b)=>(b.pot||0)-(a.pot||0),
    age:(a,b)=>a.age-b.age, value:(a,b)=>marketValue(b)-marketValue(a),
    form:(a,b)=>(b.form||0)-(a.form||0), goals:(a,b)=>(b.st?b.st.goals:0)-(a.st?a.st.goals:0) };
  const roster=S.players.filter((p)=>p.club===S.myClub).sort(cmp[S.squadSort]||cmp.rating);
  const total=round1(roster.reduce((a,p)=>a+marketValue(p),0));
  const avgAge=roster.length?round1(roster.reduce((a,p)=>a+p.age,0)/roster.length):0;
  const rows=roster.map((p)=>{
    const r=ratingOf(p);
    return '<button class="listrow" style="width:100%;text-align:left'+(xi.has(p.id)?";background:rgba(245,194,66,.07)":"")+'" data-act="show:'+p.id+'">'
      +'<span class="tag" style="width:34px;text-align:center">'+p.pos+'</span>'
      +'<span class="grow l1">'+esc(p.name)+(xi.has(p.id)?" "+tagXI():"")+(p.youth?' <span class="tag cl">YTH</span>':"")+'</span>'
      +'<span style="width:30px;text-align:right;color:'+(p.age>=32?"var(--clay)":"var(--sage)")+'">'+p.age+'</span>'
      +'<span style="width:30px;text-align:right;font-weight:700;color:'+ratingColor(r)+'">'+r+'</span>'
      +'<span style="width:30px;text-align:right;color:'+((p.pot||r)>r?"#9BD17F":"var(--sage)")+'">'+(p.pot||r)+'</span>'
      +'<span style="width:58px;text-align:right;color:var(--amber)">'+money(marketValue(p))+'</span>'
      +'<span style="width:52px;text-align:right;color:var(--sage)">'+(p.st?p.st.goals+"/"+p.st.assists:"0/0")+'</span></button>';
  }).join("");
  return '<div class="row" style="margin-bottom:10px">'+statBox("PLAYERS",roster.length)+statBox("AVG AGE",avgAge)
    +statBox("SQUAD VALUE",money(total))
    +'<div class="spacer"></div><select data-act="squadsort">'
    +['rating','pot','age','value','form','goals'].map((k)=>'<option value="'+k+'"'+(S.squadSort===k?" selected":"")+'>SORT: '+k.toUpperCase()+'</option>').join("")
    +'</select></div>'
    +'<div class="card" style="overflow:hidden"><div class="listrow mono tiny muted">'
    +'<span style="width:34px">POS</span><span class="grow">NAME</span><span style="width:30px;text-align:right">AGE</span>'
    +'<span style="width:30px;text-align:right">OVR</span><span style="width:30px;text-align:right">POT</span>'
    +'<span style="width:58px;text-align:right">VALUE</span><span style="width:52px;text-align:right">G/A</span></div>'
    +'<div class="scroll" style="max-height:58vh">'+rows+'</div></div>';
}

function viewLineup(){
  const roster=S.players.filter((p)=>p.club===S.myClub).sort((a,b)=>ratingOf(b)-ratingOf(a));
  const cs=S.customSquads[S.myClub]||{formation:"4-3-3",slots:{}};
  const slots=FORMATIONS[cs.formation];
  const byId=new Map(roster.map((p)=>[p.id,p]));
  const active=S.activeSlot;
  const activeDef=active?slots.find((s)=>s.id===active):null;
  const used=new Set(Object.values(cs.slots).filter((v)=>v!=null));
  const lineup=slots.map((s)=>({slotPos:s.pos,player:byId.get(cs.slots[s.id])})).filter((x)=>x.player);
  const prev=statsFromLineup(lineup);
  const ovr=lineup.length?round1(lineup.reduce((a,x)=>a+effRating(x.player,x.slotPos),0)/lineup.length):0;

  const discs=slots.map((s)=>{
    const p=cs.slots[s.id]!=null?byId.get(cs.slots[s.id]):null;
    const eff=p?Math.round(effRating(p,s.pos)):null;
    return '<button class="slot'+(p?" filled":"")+(active===s.id?" active":"")+'" style="left:'+s.x+'%;top:'+s.y+'%" data-act="slot:'+s.id+'">'
      +'<span class="disc">'+(eff!=null?eff:s.pos)+'</span>'
      +'<em>'+(p?esc(p.name.split(" ").slice(-1)[0]):s.pos)+'</em></button>';
  }).join("");

  let list=roster.slice();
  if(activeDef&&S.lineSort==="fit") list.sort((a,b)=>effRating(b,activeDef.pos)-effRating(a,activeDef.pos));
  else if(S.lineSort==="age") list.sort((a,b)=>a.age-b.age);
  else if(S.lineSort==="pot") list.sort((a,b)=>(b.pot||0)-(a.pot||0));
  else if(S.lineSort==="value") list.sort((a,b)=>marketValue(b)-marketValue(a));
  else list.sort((a,b)=>ratingOf(b)-ratingOf(a));

  const rows=list.map((p)=>{
    const sp=activeDef?activeDef.pos:p.pos;
    const eff=Math.round(effRating(p,sp)), fam=familiarity(p,sp), nat=ratingOf(p);
    const inSlot=activeDef&&cs.slots[active]===p.id;
    return '<div class="prow'+(inSlot?" sel":"")+'">'
      +'<button class="nm" style="display:flex;align-items:center;gap:8px;flex:1;min-width:0" data-act="'+(activeDef?"assign:"+p.id:"show:"+p.id)+'">'
      +'<span class="pos">'+p.pos+'</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.name)+'</span>'
      +'<span class="muted tiny">'+p.age+'y</span>'
      +(used.has(p.id)&&!inSlot?'<span class="sky tiny">&middot; on pitch</span>':"")+'</button>'
      +'<button style="display:flex;align-items:center;gap:6px" data-act="show:'+p.id+'">'
      +(activeDef&&fam<1?'<span class="tiny" style="color:'+(fam>=0.95?"var(--sage)":"var(--clay)")+'">'+Math.round(fam*100)+'%</span>':"")
      +'<span class="rt" style="color:'+ratingColor(eff)+'">'+eff+'</span>'
      +(activeDef&&eff!==nat?'<span class="tiny muted" style="width:24px">('+nat+')</span>':"")
      +'</button></div>';
  }).join("");

  return '<div class="row" style="margin-bottom:10px">'
    + Object.keys(FORMATIONS).map((f)=>pill(f, cs.formation===f, "form:"+f)).join("")
    + '<div class="spacer"></div>'
    + '<button class="pill" data-act="autofill">AUTO-FILL</button></div>'
    + '<div class="lineup">'
    + '<div class="pitchcol card pad"><div class="pitchbox"><div class="pitch">'
    + '<div class="mark" style="inset:12px;border-radius:3px"></div>'
    + '<div class="mark" style="left:12px;right:12px;top:50%;border-width:1px 0 0 0"></div>'
    + '<div class="mark" style="width:22%;aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%"></div>'
    + discs + '</div>'
    + '<div class="row" style="justify-content:center">'+statBox("ATT",prev.att||"–")+statBox("MID",prev.mid||"–")
    + statBox("DEF",prev.def||"–")+statBox("OVR",ovr||"–")+'</div>'
    + '<div class="mono tiny" style="text-align:center;color:'+(lineup.length===11?"var(--amber)":"var(--sage)")+'">'
    + lineup.length+'/11 selected'+(lineup.length<7?" — need 7+":"")+'</div>'
    + '<div class="mono tiny green" style="text-align:center">&#10003; SAVED AUTOMATICALLY</div>'
    + '</div></div>'
    + '<div class="listcol card lite pad">'
    + '<div class="row" style="margin-bottom:8px"><span class="mono small" style="color:'+(activeDef?"var(--amber)":"var(--sage)")+'">'
    + (activeDef?"PICK YOUR "+activeDef.pos:"TAP A SHIRT TO PICK")+'</span><div class="spacer"></div>'
    + '<select data-act="linesort">'+['fit','rating','pot','age','value'].map((k)=>'<option value="'+k+'"'+(S.lineSort===k?" selected":"")+'>'+(k==="fit"?"BEST FIT":k.toUpperCase())+'</option>').join("")+'</select>'
    + (activeDef&&cs.slots[active]!=null?'<button class="pill" data-act="clearslot">CLEAR</button>':"")
    + '</div><div class="scroll" style="flex:1">'+rows+'</div></div></div>';
}

const POS_FILTERS=["ALL","GK","DEF","MID","ATT","CB","LB","RB","CDM","CM","CAM","LW","RW","ST"];
const PRICE_STEPS=[5,15,30,60,100,200,400];
// Strict on purpose. Asking for a striker and being shown wingers who happen
// to list ST as a second position is not a search result, it is noise.
function matchesPos(p,f){
  if(f==="ALL") return true;
  if(f==="GK") return p.pos==="GK";
  if(f==="DEF"||f==="MID"||f==="ATT") return p.cat===f && !(f==="DEF"&&p.pos==="GK");
  return p.pos===f;
}
// "Ready" means he is at his ceiling and will not improve; "prospect" means
// there is still real room left in him.
function matchesDev(p,f){
  if(f==="ALL") return true;
  const r=ratingOf(p), pot=p.pot||r;
  if(f==="READY") return r>=pot-1;
  if(f==="PROSPECT") return pot-r>=3;
  return true;
}
function viewTransfers(){
  const F=S.tf;
  const budget=S.budgets[S.myClub]||0;
  const mySquad=S.players.filter((p)=>p.club===S.myClub);
  const t=teamStats(S.myClub,S.players,S.customSquads);
  const xi=new Set(t.lineup.map((x)=>x.player.id));
  const ctx=ctxFor();

  if(F.mode==="offers"){
    const rows=S.offers.map((o)=>{
      const p=S.players.find((x)=>x.id===o.playerId);
      if(!p) return "";
      const val=marketValue(p);
      return '<div class="listrow"><div class="grow"><div class="l1">'+esc(p.name)+' <span class="muted">'+p.pos+' &middot; '+ratingOf(p)+'</span>'
        +(xi.has(p.id)?" "+tagXI():"")+'</div><div class="l2 sky">'+esc(o.club)+' bid '+money(o.fee)
        +' <span style="color:'+(o.fee>val*1.05?"#9BD17F":"var(--sage)")+'">(valued '+money(val)+')</span></div></div>'
        +'<button class="pill on" data-act="accept:'+o.id+'">Accept</button>'
        +'<button class="pill" data-act="reject:'+o.id+'">Reject</button></div>';
    }).join("");
    return transferHeader(budget,mySquad.length)
      +'<div class="card" style="overflow:hidden">'+(rows||'<div class="pad mono small muted" style="text-align:center">No bids on your players.</div>')+'</div>';
  }

  let list;
  if(F.mode==="buy"){
    const q=F.q.trim().toLowerCase();
    list=S.players.filter((p)=>p.club!==S.myClub);
    if(F.scope==="PL") list=list.filter((p)=>S.tiers[p.club]===1);
    else if(F.scope==="CH") list=list.filter((p)=>S.tiers[p.club]===2);
    else if(F.scope==="EU") list=list.filter((p)=>FOREIGN_SET.has(p.club));
    else if(F.scope==="FREE") list=list.filter((p)=>p.club==="Free Agent");
    list=list.filter((p)=>matchesPos(p,F.pos))
      .filter((p)=>!q||p.name.toLowerCase().includes(q)||p.club.toLowerCase().includes(q))
      .filter((p)=>askingPrice(p)<=F.maxPrice)
      .filter((p)=>ratingOf(p)>=F.minRating)
      .filter((p)=>p.age<=F.maxAge)
      .filter((p)=>matchesDev(p,F.dev));
    const cmp={ rating:(a,b)=>ratingOf(b)-ratingOf(a), price:(a,b)=>askingPrice(a)-askingPrice(b),
      pot:(a,b)=>(b.pot||0)-(a.pot||0), age:(a,b)=>a.age-b.age,
      bargain:(a,b)=>ratingOf(b)/Math.max(1,askingPrice(b))-ratingOf(a)/Math.max(1,askingPrice(a)) };
    list=list.sort(cmp[F.sort]||cmp.rating).slice(0,120);
  } else {
    const q=F.q.trim().toLowerCase();
    list=mySquad.filter((p)=>matchesPos(p,F.pos)).filter((p)=>!q||p.name.toLowerCase().includes(q))
      .sort((a,b)=>{ const ai=xi.has(a.id)?1:0, bi=xi.has(b.id)?1:0; return bi-ai||ratingOf(b)-ratingOf(a); });
  }

  const rows=list.map((p)=>{
    const r=ratingOf(p), price=F.mode==="buy"?askingPrice(p):salePrice(p);
    const foreign=FOREIGN_SET.has(p.club), inXI=F.mode==="sell"&&xi.has(p.id);
    const afford=budget>=price;
    const interest=F.mode==="buy"?joinChance(p,S.myClub,S.players,ctx):1;
    const tierTag = F.mode==="buy" && S.tiers[p.club]===2 ? ' <span class="tag">CH</span>' : "";
    return '<div class="listrow"'+(inXI?' style="background:rgba(245,194,66,.08)"':"")+'>'
      +'<button class="grow" style="text-align:left" data-act="show:'+p.id+'">'
      +'<div class="l1">'+(foreign?'<span class="sky">&#9679;</span> ':"")+esc(p.name)+' <span class="muted">'+p.pos+'</span>'+tierTag+(inXI?" "+tagXI():"")+'</div>'
      +'<div class="l2">'+esc(F.mode==="buy"?p.club:"form "+(p.form||6.5).toFixed(1))+' &middot; '+p.age+'y &middot; ovr '+r
      +((p.pot||r)>r?' &middot; <span style="color:#9BD17F">pot '+p.pot+'</span>':"")
      +(F.mode==="buy"&&interest<0.5?' &middot; <span style="color:'+(interest<0.2?"var(--clay)":"var(--sage)")+'">'+(interest<0.2?"unlikely":"reluctant")+'</span>':"")
      +'</div></button>'
      +'<span style="color:'+(F.mode==="buy"&&!afford?"var(--sage)":"var(--amber)")+'">'+money(price)+'</span>'
      +(F.mode==="buy"
        ? '<button class="pill'+(afford?" on":"")+'" data-act="buy:'+p.id+'"'+(afford?"":" disabled")+'>Buy</button>'
        : '<button class="pill" style="color:var(--clay);border-color:var(--clay)" data-act="sell:'+p.id+'">Sell</button>')
      +'</div>';
  }).join("");

  const filters='<div class="card lite pad" style="margin-bottom:10px">'
    +'<input style="width:100%;margin-bottom:8px" placeholder="Search player or club…" value="'+esc(F.q)+'" data-act="q">'
    +'<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'
    +'<label class="mono tiny muted">POSITION<select data-act="fpos" style="width:100%">'+POS_FILTERS.map((p)=>'<option'+(F.pos===p?" selected":"")+'>'+p+'</option>').join("")+'</select></label>'
    +(F.mode==="buy"?'<label class="mono tiny muted">LOOK IN<select data-act="fscope" style="width:100%">'
      +[["ALL","EVERYWHERE"],["PL","PREMIER LEAGUE"],["CH","CHAMPIONSHIP"],["EU","ABROAD"],["FREE","FREE AGENTS"]]
        .map((o)=>'<option value="'+o[0]+'"'+(F.scope===o[0]?" selected":"")+'>'+o[1]+'</option>').join("")+'</select></label>':"")
    +'<label class="mono tiny muted">DEVELOPMENT<select data-act="fdev" style="width:100%">'
      +[["ALL","ANY"],["READY","READY — AT CEILING"],["PROSPECT","PROSPECTS ONLY"]]
        .map((o)=>'<option value="'+o[0]+'"'+(F.dev===o[0]?" selected":"")+'>'+o[1]+'</option>').join("")+'</select></label>'
    +'<label class="mono tiny muted">SORT<select data-act="fsort" style="width:100%">'
      +[["rating","RATING"],["price","CHEAPEST"],["pot","POTENTIAL"],["age","YOUNGEST"],["bargain","BEST VALUE"]]
        .map((o)=>'<option value="'+o[0]+'"'+(F.sort===o[0]?" selected":"")+'>'+o[1]+'</option>').join("")+'</select></label>'
    +(F.mode==="buy"?'<label class="mono tiny muted">MAX PRICE '+(F.maxPrice>=400?"ANY":money(F.maxPrice))
      +'<input type="range" min="0" max="'+(PRICE_STEPS.length-1)+'" value="'+Math.max(0,PRICE_STEPS.indexOf(F.maxPrice))+'" data-act="fprice" style="width:100%"></label>':"")
    +(F.mode==="buy"?'<label class="mono tiny muted">MIN RATING '+(F.minRating||"ANY")
      +'<input type="range" min="0" max="92" value="'+F.minRating+'" data-act="frating" style="width:100%"></label>':"")
    +(F.mode==="buy"?'<label class="mono tiny muted">MAX AGE '+(F.maxAge>=40?"ANY":F.maxAge)
      +'<input type="range" min="17" max="40" value="'+F.maxAge+'" data-act="fage" style="width:100%"></label>':"")
    +'</div></div>';

  return transferHeader(budget,mySquad.length)+filters
    +'<div class="card scroll" style="max-height:52vh;overflow-x:hidden">'
    +(rows||'<div class="pad mono small muted" style="text-align:center">Nothing matches those filters.</div>')+'</div>'
    +'<div class="mono tiny muted" style="margin-top:8px">'
    +(F.mode==="buy"
      ? "Clubs sell above valuation and buy below it, so trading costs you money — and the best players will only move to a club big enough for them."
      : "Highlighted players are in your starting eleven. You receive 86% of market value.")
    +'</div>';
}
function transferHeader(budget,size){
  const F=S.tf;
  return '<div class="row" style="margin-bottom:10px">'
    + pill("BUY",F.mode==="buy","mode:buy") + pill("SELL",F.mode==="sell","mode:sell")
    + (S.offers.length?pill("OFFERS ("+S.offers.length+")",F.mode==="offers","mode:offers"):"")
    + '<div class="spacer"></div><span class="mono small muted">'+size+'/26 players</span>'
    + '<span class="mono small amber">'+money(budget)+'</span></div>'
    + (S.flash?'<div class="card lite pad mono small" style="margin-bottom:10px;color:'+(S.flash.tone||"var(--chalk)")+'">'+esc(S.flash.text)+'</div>':"");
}

function viewStats(){
  const clubs=divClubs(myTier());
  const list=S.statTab==="goals"?topScorers(S.players,clubs,12):topRated(S.players,clubs,12);
  const rows=list.map((p,i)=>'<button class="listrow" style="width:100%;text-align:left" data-act="show:'+p.id+'">'
    +'<span class="muted" style="width:18px">'+(i+1)+'</span><span class="grow l1">'+esc(p.name)+'</span>'
    +'<span class="muted" style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.club)+'</span>'
    +'<span class="amber" style="width:62px;text-align:right">'
    +(S.statTab==="goals"?p.st.goals+"g "+p.st.assists+"a":(p.seasonForm||0).toFixed(2))+'</span></button>').join("");

/* ============================================================
   ACADEMY
   Half a star at a time, exactly like the training upgrades in World Soccer
   Champs. Each star lifts the ceiling of everyone your academy produces.
   ============================================================ */
const ACADEMY_MAX = 5;
function academyCost(level){ return round1(8 + level*14); }
function academyStars(level){
  let s="";
  for(let i=1;i<=ACADEMY_MAX;i++){
    if(level>=i) s+='<span style="color:var(--amber)">&#9733;</span>';
    else if(level>=i-0.5) s+='<span style="color:var(--amber)">&#9734;</span>';
    else s+='<span style="color:rgba(242,245,240,.2)">&#9734;</span>';
  }
  return s;
}
function viewAcademy(){
  const lvl=S.academy||0, cost=academyCost(lvl), budget=S.budgets[S.myClub]||0;
  const maxed=lvl>=ACADEMY_MAX;
  const bonus=(2.4*lvl).toFixed(1);
  return '<div class="card pad" style="margin-bottom:10px">'
    +'<div class="mono tiny muted">YOUTH ACADEMY</div>'
    +'<div style="font-size:30px;letter-spacing:4px;margin:6px 0">'+academyStars(lvl)+'</div>'
    +'<div class="mono small muted">Level '+lvl.toFixed(1)+' of '+ACADEMY_MAX.toFixed(1)
    +' &middot; graduates arrive with roughly <span class="amber">+'+bonus+'</span> on their ceiling.</div>'
    +'</div>'
    +(S.flash?'<div class="card lite pad mono small" style="margin-bottom:10px;color:'+(S.flash.tone||"var(--chalk)")+'">'+esc(S.flash.text)+'</div>':"")
    +'<div class="card pad">'
    +(maxed
      ? '<div class="mono small green">Your academy is fully developed.</div>'
      : '<div class="mono small muted" style="margin-bottom:10px">Next upgrade: +0.5 stars for <span class="amber">'+money(cost)+'</span>. '
        +'You have '+money(budget)+'.</div>'
        +'<button class="btn '+(budget>=cost?"primary":"ghost")+'" data-act="academy"'+(budget>=cost?"":" disabled")+'>'
        +'UPGRADE ACADEMY — '+money(cost)+'</button>')
    +'<div class="mono tiny muted" style="margin-top:10px">'
    +'Graduates come through each summer. A better academy will not save a bad season, but over a long career it is the cheapest squad you will ever build.'
    +'</div></div>';
}

/* ============================================================
   PLAY
   ============================================================ */
function viewPlay(){
  const tier=myTier();
  const clubs=divClubs(tier);
  const fixtures=S.fixtures[tier]||[];
  const next=fixtures[S.mw]||[];
  const mine=next.find((f)=>f.home===S.myClub||f.away===S.myClub);
  const table=sortedTable(S.tables[tier]);
  const pos=table.findIndex((r)=>r.club===S.myClub)+1;
  const budget=S.budgets[S.myClub]||0;

  let html='<div class="row" style="margin-bottom:12px">'
    +statBox("SEASON",S.season)+statBox("DIVISION",tier===1?"PL":"CH")
    +statBox("MATCHWEEK",S.mw+"/38")+statBox("POSITION",S.mw>0?ordinal(pos):"–")
    +statBox("BUDGET",money(budget))+'</div>';

  if(S.phase==="season"&&S.mw<38){
    if(mine){
      html+='<div class="card pad" style="text-align:center;margin-bottom:12px">'
        +'<div class="mono tiny muted">MATCHWEEK '+(S.mw+1)+' — YOUR FIXTURE</div>'
        +'<div class="display" style="font-size:26px;margin-top:4px">'
        +'<span'+(mine.home===S.myClub?' class="amber"':"")+'>'+esc(mine.home)+'</span>'
        +' <span class="muted" style="font-size:18px">vs</span> '
        +'<span'+(mine.away===S.myClub?' class="amber"':"")+'>'+esc(mine.away)+'</span></div>'
        +'<div class="mono tiny muted">'+(mine.home===S.myClub?"Home":"Away")+'</div></div>';
    }
    html+='<div class="row" style="gap:10px;margin-bottom:12px">'
      +'<button class="btn primary" style="flex:1" data-act="sim:1"'+(S.busy?" disabled":"")+'>PLAY MATCHWEEK '+(S.mw+1)+'</button>'
      +'<button class="btn ghost" style="flex:1" data-act="sim:'+(S.mw<19?19-S.mw:38-S.mw)+'"'+(S.busy?" disabled":"")+'>'
      +(S.mw<19?"TO JANUARY":"TO SEASON END")+'</button></div>';
  }

  if(S.phase==="window"){
    const label=S.windowType==="january"?"JANUARY TRANSFER WINDOW":S.windowType==="preseason"?"PRESEASON":"SUMMER TRANSFER WINDOW";
    html+='<div class="card lite pad" style="text-align:center;margin-bottom:12px">'
      +'<div class="display amber" style="font-size:22px">'+label+'</div>';
    if(S.lastPrize){
      const p=S.lastPrize;
      html+='<div class="mono small">Finished '+ordinal(p.position)+' in the '+DIV_NAME[p.tier]
        +(p.euroLabel?' &middot; <span class="sky">'+p.euroLabel+'</span>':"")+'</div>'
        +'<div class="mono tiny muted">merit '+money(p.merit)+(p.euro?' + european '+money(p.euro):"")
        +(p.title?' + title '+money(p.title):"")+(p.promo?' + promotion '+money(p.promo):"")
        +(p.para?' + parachute '+money(p.para):"")+(p.cl?' + Champions League '+money(p.cl):"")
        +' = <span class="amber">'+money(p.total+(p.cl||0))+'</span></div>';
    }
    html+='<div class="mono tiny muted" style="margin:8px 0">Sign players in Transfers, set your eleven in Lineup, then kick off.</div>'
      +'<button class="btn primary" data-act="'+(S.windowType==="summer"?"newseason":"closewindow")+'">'
      +(S.windowType==="summer"?"START SEASON "+(S.season+1):S.windowType==="preseason"?"KICK OFF SEASON":"CONTINUE SEASON")
      +'</button></div>';
  }

  if(S.phase==="finished"){
    const champ=pos===1;
    const promoted=tier===2&&pos<=2;
    html+='<div class="card lite pad" style="text-align:center;margin-bottom:12px">'
      +'<div class="display" style="font-size:26px;color:'+(champ?"var(--amber)":"var(--chalk)")+'">'
      +(champ?"CHAMPIONS!":"SEASON "+S.season+" COMPLETE")+'</div>'
      +'<div class="mono small muted">'+esc(S.myClub)+' finished '+ordinal(pos)+' in the '+DIV_NAME[tier]
      +(promoted?" — promoted.":tier===1&&pos>=18?" — relegated.":"")+'</div>'
      +'<button class="btn primary" style="margin-top:10px" data-act="endseason">CONTINUE</button></div>';
  }

  const last=S.lastResults?S.lastResults.filter((r)=>r.home===S.myClub||r.away===S.myClub):null;
  if(last&&last.length){
    const w=last.filter((r)=>(r.home===S.myClub?r.hg>r.ag:r.ag>r.hg)).length;
    const l=last.filter((r)=>(r.home===S.myClub?r.hg<r.ag:r.ag<r.hg)).length;
    html+='<div class="card pad"><div class="row" style="justify-content:space-between;margin-bottom:6px">'
      +'<span class="mono tiny muted">YOUR RESULTS</span>'
      +'<span class="mono tiny"><span class="green">'+w+'W</span> '+(last.length-w-l)+'D <span class="clay">'+l+'L</span></span></div>'
      +'<div class="scroll" style="max-height:280px">'
      +last.map((m)=>{
        const home=m.home===S.myClub, mg=home?m.hg:m.ag, og=home?m.ag:m.hg;
        const sc=home?m.homeScorers:m.awayScorers;
        return '<div class="listrow">'+resultBadge(mg>og?"W":mg<og?"L":"D")
          +'<span class="muted" style="width:56px">MW'+m.mw+'</span>'
          +'<span class="grow"><b>'+mg+'–'+og+'</b> vs '+esc(home?m.away:m.home)+' ('+(home?"H":"A")+')'
          +(sc&&sc.length?'<div class="tiny muted">'+esc(sc.map((e)=>e.scorer.split(" ").slice(-1)[0]).join(", "))+'</div>':"")
          +'</span></div>';
      }).join("")+'</div></div>';
  }
  return html;
}

      +(slot===p.pos?"var(--amber)":"var(--line)")+'"><span class="muted">'+slot+'</span> '

    +'<div class="mono tiny muted" style="margin:12px 0 6px">RATING BY POSITION</div>'
    +'<div class="row">'+byPos+'</div>'
    +'<div class="mono tiny muted" style="margin:12px 0 6px">HOW THE PRICE IS BUILT</div>'
    +'<div class="card pad mono" style="font-size:11px">'
    +priceRow("base from rating "+r, money(round1(0.4*Math.pow(1.208,r-60))))
    +priceRow("age "+p.age, "&times; "+ageValueMult(p.age).toFixed(2))

    +priceRow("position "+p.pos, "&times; "+(POS_VALUE_MULT[p.pos]||1).toFixed(2))
    +priceRow("form "+(p.form||6.5).toFixed(1), "&times; "+(0.9+0.14*clamp(((p.form===undefined?6.7:p.form)-6.2)/1.6,0,1.4)).toFixed(2))
