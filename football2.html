/* ============================================================
   RENDER
   ============================================================ */
const SUBS=[["play","PLAY"],["table","TABLE"],["squad","SQUAD"],["lineup","LINEUP"],
  ["transfers","TRANSFERS"],["academy","ACADEMY"],["europe","EUROPE"],["stats","STATS"],
  ["news","NEWS"],["history","HISTORY"]];

function render(){
  const main=$("#main"), view=$("#view"), nav=$("#topnav");
  nav.innerHTML = S.myClub
    ? '<span class="mono small muted">'+esc(DIV_NAME[myTier()])+'</span>'
      +'<span class="mono small amber">'+money(S.budgets[S.myClub]||0)+'</span>'
      +'<button class="pill" data-act="reset">RESET</button>'
    : '';
  main.className = (S.myClub && S.sub==="lineup") ? "fill" : "";

  if(!S.myClub){ view.innerHTML=viewClubPicker(); return; }

  let body="";
  switch(S.sub){
    case "table": body=viewTable(); break;
    case "squad": body=viewSquad(); break;
    case "lineup": body=viewLineup(); break;
    case "transfers": body=viewTransfers(); break;
    case "academy": body=viewAcademy(); break;
    case "europe": body=viewEurope(); break;
    case "stats": body=viewStats(); break;
    case "news": body=viewNews(); break;
    case "history": body=viewHistory(); break;
    default: body=viewPlay();
  }
  const head='<div class="row" style="margin-bottom:10px">'+crest(S.myClub)
    +'<div><div class="display" style="font-size:24px;line-height:1">'+esc(S.myClub.toUpperCase())+'</div>'
    +'<div class="mono tiny muted">Season '+S.season+' &middot; Matchweek '+S.mw+' &middot; '+esc(DIV_NAME[myTier()])+'</div></div>'
    +'</div><div class="row" style="margin-bottom:12px">'
    + SUBS.map((s)=>pill(s[1]+(s[0]==="transfers"&&S.offers.length?' <span class="tag cl">'+S.offers.length+'</span>':""),
        S.sub===s[0],"sub:"+s[0])).join("")+'</div>';
  view.innerHTML = head
    + '<div'+(S.sub==="lineup"?' style="flex:1;min-height:0;display:flex;flex-direction:column"':"")+'>'+body+'</div>'
    + (S.inspect?viewPlayerModal(S.inspect):"")
    + (S.modal==="reset"?viewResetModal():"");
}

/* ============================================================
   ACTIONS
   ============================================================ */
function startCareer(club){
  S.myClub=club;
  S.budgets=computeAllBudgets(S.players,S.tiers);
  S.academy=0;
  S.tableTier=S.tiers[club];
  S.fixtures={1:generateFixtures(divClubs(1)),2:generateFixtures(divClubs(2))};
  S.tables={1:initTable(divClubs(1)),2:initTable(divClubs(2))};
  S.phase="window"; S.windowType="preseason"; S.mw=0; S.season=1;
  S.news=[{season:1,type:"prize",big:true,text:"You take charge of "+club+" in the "+DIV_NAME[S.tiers[club]]+"."}];
  S.sub="play";
}

function simulate(count){
  if(S.phase!=="season"||S.busy) return;
  S.busy=true; render();
  setTimeout(()=>{
    const all=[];
    for(let i=0;i<count;i++){
      if(S.mw>=38) break;
      [1,2].forEach((tier)=>{
        const week=S.fixtures[tier][S.mw];
        if(!week) return;
        const r=runMatchweek(S.players,S.customSquads,S.tables[tier],week,S.season,S.mw,S.clubForm);
        S.players=r.players; S.tables[tier]=r.table; S.clubForm=r.clubForm;
        if(tier===myTier()) all.push.apply(all,r.results);
        S.history.push.apply(S.history,r.results.filter((x)=>x.home===S.myClub||x.away===S.myClub));
      });
      S.mw++;
    }
    S.lastResults=all;
    if(S.mw>=38){ S.phase="finished"; }
    else if(S.mw>=19 && S.windowType!=="january" && S.windowType!=="summer"){
      S.phase="window"; S.windowType="january";
      const ai=runAITransfers(S.players,S.budgets,ctxFor(),S.myClub,1);
      S.players=ai.players; S.budgets=ai.budgets;
      S.offers=generateOffersForUser(S.players,S.budgets,S.myClub,ctxFor(),S.season);
    }
    S.busy=false; save(); render();
  },20);
}

function finishSeason(){
  const tier=myTier();
  const order=sortedTable(S.tables[tier]).map((r)=>r.club);
  const position=order.indexOf(S.myClub)+1;
  const prize=seasonPrize(position,tier);
  const res=endOfSeason({ players:S.players, budgets:S.budgets, tiers:S.tiers,
    customSquads:S.customSquads, tables:S.tables, season:S.season, myClub:S.myClub, academy:S.academy||0 });
  S.players=res.players; S.budgets=res.budgets; S.tiers=res.tiers; S.cl=res.cl;
  S.lastOrder={1:res.order1,2:res.order2};
  S.news=S.news.concat(res.news.map((n)=>Object.assign({season:S.season},n)));
  const ai=runAITransfers(S.players,S.budgets,ctxFor(),S.myClub,4);
  S.players=ai.players; S.budgets=ai.budgets;
  S.news=S.news.concat(ai.news.filter((n)=>n.big||n.text.indexOf(S.myClub)>=0).map((n)=>Object.assign({season:S.season},n)));
  S.offers=generateOffersForUser(S.players,S.budgets,S.myClub,ctxFor(),S.season);
  S.lastPrize=Object.assign({position,tier,euroLabel:europeanLabel(position,tier),cl:res.cl.prize[S.myClub]||0},prize);
  S.phase="window"; S.windowType="summer"; S.lastResults=null;
  S.sub="play"; S.tableTier=S.tiers[S.myClub];
  save(); render();
}

function newSeason(){
  S.season++; S.mw=0; S.phase="season"; S.windowType="preseason";
  S.fixtures={1:generateFixtures(divClubs(1)),2:generateFixtures(divClubs(2))};
  S.tables={1:initTable(divClubs(1)),2:initTable(divClubs(2))};
  S.clubForm={}; S.offers=[]; S.lastResults=null; S.tableTier=myTier();
  save(); render();
}

function doBuy(id){
  const p=S.players.find((x)=>x.id===id); if(!p) return;
  const price=askingPrice(p), budget=S.budgets[S.myClub]||0;
  const squad=S.players.filter((x)=>x.club===S.myClub);
  if(budget<price) return flash("Not enough in the budget.","var(--clay)");
  if(squad.length>=26) return flash("Squad is full (26). Sell someone first.","var(--clay)");
  if(Math.random()>joinChance(p,S.myClub,S.players,ctxFor()))
    return flash(p.name+" turned you down — he wants a bigger club.","var(--clay)");
  const seller=p.club;
  S.players=S.players.map((x)=>x.id===id?Object.assign({},x,{club:S.myClub}):x);
  S.budgets[S.myClub]=round1(budget-price);
  if(seller!=="Free Agent") S.budgets[seller]=round1((S.budgets[seller]||0)+price*0.92);
  S.news.push({season:S.season,type:"transfer",big:true,text:p.name+" ("+ratingOf(p)+") signs for "+S.myClub+" from "+seller+" for "+money(price)+"."});
  save(); flash("Signed "+p.name+" for "+money(price)+".","var(--amber)");
}
function doSell(id){
  const p=S.players.find((x)=>x.id===id); if(!p) return;
  const squad=S.players.filter((x)=>x.club===S.myClub);
  if(squad.length<=16) return flash("You need at least 16 players in the squad.","var(--clay)");
  if(p.pos==="GK"&&squad.filter((x)=>x.pos==="GK").length<=1)
    return flash("That's your only goalkeeper — sign another one first.","var(--clay)");
  const price=salePrice(p);
  const suitors=ALL_CLUBS.filter((c)=>c!==S.myClub&&(S.budgets[c]||0)>=askingPrice(p))
    .filter((c)=>S.players.filter((x)=>x.club===c).length<26);
  let buyer = (FOREIGN_SET.has(p.originClub)&&Math.random()<0.5) ? p.originClub
    : suitors.length ? weightedPick(suitors.map((c)=>({item:c,w:Math.max(1,S.budgets[c]||0)}))) : "Free Agent";
  S.players=S.players.map((x)=>x.id===id?Object.assign({},x,{club:buyer}):x);
  S.budgets[S.myClub]=round1((S.budgets[S.myClub]||0)+price);
  if(buyer!=="Free Agent") S.budgets[buyer]=round1((S.budgets[buyer]||0)-askingPrice(p));
  clearFromLineup(id);
  S.news.push({season:S.season,type:"transfer",text:p.name+" leaves "+S.myClub+" for "+buyer+" — "+money(price)+"."});
  save(); flash("Sold "+p.name+" to "+(buyer==="Free Agent"?"nobody (released)":buyer)+" for "+money(price)+".","var(--amber)");
}
function clearFromLineup(id){
  const cs=S.customSquads[S.myClub]; if(!cs) return;
  Object.keys(cs.slots).forEach((k)=>{ if(cs.slots[k]===id) delete cs.slots[k]; });
}
function ensureLineup(){
  if(!S.customSquads[S.myClub]) S.customSquads[S.myClub]={formation:"4-3-3",slots:{}};
  return S.customSquads[S.myClub];
}

function handle(act){
  const [cmd,arg]=act.split(":");
  switch(cmd){
    case "pick": startCareer(arg); save(); break;
    case "ptier": case "tier": S.tableTier=+arg; break;
    case "sub": S.sub=arg; if(arg==="lineup") ensureLineup(); break;
    case "stat": S.statTab=arg; break;
    case "sim": simulate(+arg); return;
    case "endseason": finishSeason(); return;
    case "newseason": newSeason(); return;
    case "closewindow": S.phase="season"; save(); break;
    case "show": S.inspect=S.players.find((p)=>p.id===+arg)||null; break;
    case "closemodal": S.inspect=null; S.modal=null; break;
    case "reset": S.modal="reset"; break;
    case "doreset": localStorage.removeItem(SAVE_KEY); S=newState(); break;
    case "mode": S.tf.mode=arg; break;
    case "buy": doBuy(+arg); return;
    case "sell": doSell(+arg); return;
    case "accept": {
      const o=S.offers.find((x)=>x.id===arg); if(!o) break;
      const p=S.players.find((x)=>x.id===o.playerId); if(!p) break;
      if(S.players.filter((x)=>x.club===S.myClub).length<=16){ flash("Squad too small.","var(--clay)"); return; }
      S.players=S.players.map((x)=>x.id===p.id?Object.assign({},x,{club:o.club}):x);
      S.budgets[S.myClub]=round1((S.budgets[S.myClub]||0)+o.fee);
      S.budgets[o.club]=round1((S.budgets[o.club]||0)-o.fee);
      clearFromLineup(p.id);
      S.offers=S.offers.filter((x)=>x.id!==o.id);
      S.news.push({season:S.season,type:"transfer",big:true,text:p.name+" sold to "+o.club+" for "+money(o.fee)+"."});
      save(); flash("Accepted "+money(o.fee)+" from "+o.club+".","var(--amber)"); return;
    }
    case "reject": S.offers=S.offers.filter((x)=>x.id!==arg); save(); break;
    case "slot": { const cs=ensureLineup(); S.activeSlot = S.activeSlot===arg?null:arg; break; }
    case "assign": {
      const cs=ensureLineup(); if(!S.activeSlot) break;
      const pid=+arg;
      Object.keys(cs.slots).forEach((k)=>{ if(cs.slots[k]===pid) delete cs.slots[k]; });
      cs.slots[S.activeSlot]=pid;
      const defs=FORMATIONS[cs.formation];
      const nextEmpty=defs.find((s)=>s.id!==S.activeSlot&&cs.slots[s.id]==null);
      S.activeSlot=nextEmpty?nextEmpty.id:null;
      save(); break;
    }
    case "clearslot": { const cs=ensureLineup(); if(S.activeSlot) delete cs.slots[S.activeSlot]; save(); break; }
    case "autofill": { const cs=ensureLineup();
      cs.slots=pickBestXI(S.players.filter((p)=>p.club===S.myClub),cs.formation);
      S.activeSlot=null; save(); break; }
    case "form": { const cs=ensureLineup();
      const ids=new Set(FORMATIONS[arg].map((s)=>s.id));
      const carried={}; Object.keys(cs.slots).forEach((k)=>{ if(ids.has(k)) carried[k]=cs.slots[k]; });
      cs.formation=arg;
      cs.slots=pickBestXI(S.players.filter((p)=>p.club===S.myClub),arg,carried);
      S.activeSlot=FORMATIONS[arg][0].id; save(); break; }
    case "academy": {
      const lvl=S.academy||0, cost=academyCost(lvl);
      if(lvl>=ACADEMY_MAX) break;
      if((S.budgets[S.myClub]||0)<cost){ flash("Not enough money.","var(--clay)"); return; }
      S.budgets[S.myClub]=round1(S.budgets[S.myClub]-cost);
      S.academy=round1(lvl+0.5);
      save(); flash("Academy upgraded to "+S.academy.toFixed(1)+" stars.","var(--amber)"); return;
    }
  }
  render();
}

document.addEventListener("click",(e)=>{
  const stop=e.target.closest("[data-stop]");
  const el=e.target.closest("[data-act]");
  if(!el) return;
  const act=el.getAttribute("data-act");
  if(act==="closemodal"&&stop&&el.getAttribute("data-act")!=="closemodal") return;
  if(stop&&act==="closemodal"&&el!==e.target.closest("[data-act]")) return;
  if(el.disabled) return;
  handle(act);
});
document.addEventListener("change",(e)=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.getAttribute("data-act"), v=el.value;
  const F=S.tf;
  if(act==="squadsort") S.squadSort=v;
  else if(act==="linesort") S.lineSort=v;
  else if(act==="fpos") F.pos=v;
  else if(act==="fscope") F.scope=v;
  else if(act==="fsort") F.sort=v;
  else if(act==="fdev") F.dev=v;
  else if(act==="fprice") F.maxPrice=PRICE_STEPS[+v];
  else if(act==="frating") F.minRating=+v;
  else if(act==="fage") F.maxAge=+v;
  else return;
  render();
});
document.addEventListener("input",(e)=>{
  const el=e.target.closest('[data-act="q"]'); if(!el) return;
  S.tf.q=el.value;
  const pos=el.selectionStart;
  render();
  const again=$('[data-act="q"]'); if(again){ again.focus(); again.setSelectionRange(pos,pos); }
});

/* ============================================================
   BOOT
   ============================================================ */
if(!load()) S=newState();
if(S.tf && S.tf.dev===undefined) S.tf.dev="ALL";
if(S.academy===undefined) S.academy=0;
render();

</script>
