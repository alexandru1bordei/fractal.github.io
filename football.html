/* ============================================================
   SIMULATION ENGINE
   chance creation = 0.65*MID + 0.30*ATT + 0.05*DEF  (per-team rating)
   gap between teams' creation ratings drives a saturating Poisson rate.
   MID_SATURATION=6 was tuned empirically: with the old value (15), even
   the single strongest club in the league averaged only ~68pts/20% title
   rate over 100 simulated seasons — too little separation between skill
   levels. At 6, a genuinely dominant squad averages ~83pts and a 38%
   title rate, without changing the average goals/match (~2.77, still
   matches real Premier League scoring rates).
   goals: Bernoulli(CONVERSION_CAP * attack / (attack + oppDefense)) per chance
   ============================================================ */
const BASE_CHANCES = 5.0;
const MID_SATURATION = 6.0;
const CONVERSION_CAP = 0.55;
const MID_W = 0.65, ATT_W = 0.30, DEF_W = 0.05;

const sigmoid = (x) => 1 / (1 + Math.exp(-x));
const creationRating = (t) => MID_W * t.mid + ATT_W * t.att + DEF_W * t.def;

function expectedChances(team, opp) {
  const gap = creationRating(team) - creationRating(opp);
  return 2 * BASE_CHANCES * sigmoid(gap / MID_SATURATION);
}
function samplePoisson(lambda) {
  if (lambda <= 0) return 0;
  const L = Math.exp(-lambda);
  let k = 0, p = 1.0;
  do { k += 1; p *= Math.random(); } while (p > L);
  return k - 1;
}
function poissonPmf(x, lambda) {
  if (x < 0) return 0;
  let fact = 1;
  for (let i = 2; i <= x; i++) fact *= i;
  return (Math.exp(-lambda) * Math.pow(lambda, x)) / fact;
}
function goalProbability(attack, oppDefense) {
  if (attack <= 0 && oppDefense <= 0) return 0.5 * CONVERSION_CAP;
  return (CONVERSION_CAP * attack) / (attack + oppDefense);
}
function resolveChances(numChances, attack, oppDefense) {
  const p = goalProbability(attack, oppDefense);
  let goals = 0;
  for (let i = 0; i < numChances; i++) if (Math.random() < p) goals++;
  return goals;
}
function simulateMatch(home, away) {
  const homeLambda = expectedChances(home, away);
  const awayLambda = expectedChances(away, home);
  const homeChances = samplePoisson(homeLambda);
  const awayChances = samplePoisson(awayLambda);
  const homeConv = goalProbability(home.att, away.def);
  const awayConv = goalProbability(away.att, home.def);
  const homeGoals = resolveChances(homeChances, home.att, away.def);
  const awayGoals = resolveChances(awayChances, away.att, home.def);
  return { homeChances, awayChances, homeGoals, awayGoals, homeConv, awayConv };
}
function simulateMany(home, away, n) {
  let hw = 0, dr = 0, aw = 0, hg = 0, ag = 0, hc = 0, ac = 0;
  for (let i = 0; i < n; i++) {
    const r = simulateMatch(home, away);
    if (r.homeGoals > r.awayGoals) hw++; else if (r.homeGoals < r.awayGoals) aw++; else dr++;
    hg += r.homeGoals; ag += r.awayGoals; hc += r.homeChances; ac += r.awayChances;
  }
  return { n, homeWinPct: hw / n, drawPct: dr / n, awayWinPct: aw / n,
    avgHomeGoals: hg / n, avgAwayGoals: ag / n, avgHomeChances: hc / n, avgAwayChances: ac / n };
}

/* ============================================================
   ROSTER / LINEUP HELPERS
   ============================================================ */
const round1 = (x) => Math.round(x * 10) / 10;

function pickBestXI(roster, formationKey) {
  const slots = FORMATIONS[formationKey];
  const used = new Set();
  const chosen = {};
  slots.forEach((s) => {
    let pick = roster.filter((p) => !used.has(p.id) && p.positions.includes(s.pos)).sort((a, b) => b.rating - a.rating)[0];
    if (!pick) {
      const cat = POS_CAT[s.pos];
      pick = roster.filter((p) => !used.has(p.id) && p.cat === cat).sort((a, b) => b.rating - a.rating)[0];
    }
    if (!pick) pick = roster.filter((p) => !used.has(p.id)).sort((a, b) => b.rating - a.rating)[0];
    if (pick) { chosen[s.id] = pick.id; used.add(pick.id); }
  });
  return chosen;
}

function statsFromPicked(picked) {
  const avg = (cat) => {
    const vals = picked.filter((p) => p.cat === cat).map((p) => p.rating);
    return vals.length ? round1(vals.reduce((a, b) => a + b, 0) / vals.length) : 0;
  };
  return { att: avg("ATT"), mid: avg("MID"), def: avg("DEF") };
}

// unified team-stats resolver: custom XI if set & has >=7 players, else auto best XI (4-3-3)
function teamStats(club, playersState, customSquads) {
  const roster = playersState.filter((p) => p.club === club);
  const cs = customSquads[club];
  let picked, source, formation, slots;
  const csFilled = cs ? Object.values(cs.slots).filter(Boolean).length : 0;
  if (cs && csFilled >= 7) {
    picked = Object.values(cs.slots).filter(Boolean).map((id) => roster.find((p) => p.id === id)).filter(Boolean);
    source = `Custom XI (${cs.formation}) · ${picked.length}/11`;
    formation = cs.formation; slots = cs.slots;
  } else {
    formation = "4-3-3";
    slots = pickBestXI(roster, formation);
    picked = Object.values(slots).map((id) => roster.find((p) => p.id === id)).filter(Boolean);
    source = "Auto Best XI (4-3-3)";
  }
  const s = statsFromPicked(picked);
  return { club, ...s, roster: [...roster].sort((a, b) => b.rating - a.rating), picked, source, formation, slots };
}

   ============================================================ */
function generateFixtures(clubs) {
  const n = clubs.length;
  const fixed = clubs[0];
  let rot = clubs.slice(1);
  const half = [];
  for (let r = 0; r < n - 1; r++) {
    const arr = [fixed, ...rot];
    const round = [];
    for (let i = 0; i < n / 2; i++) {
      const home = arr[i], away = arr[n - 1 - i];
      round.push(r % 2 === 0 ? { home, away } : { home: away, away: home });
    }
    half.push(round);
    rot.unshift(rot.pop());
  }
  const secondHalf = half.map((round) => round.map((m) => ({ home: m.away, away: m.home })));
  return [...half, ...secondHalf]; // 38 rounds x 10 matches
}

function initTable(clubs) {
  const t = {};
  clubs.forEach((c) => { t[c] = { club: c, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }; });
  return t;
}
function applyResult(table, home, away, hg, ag) {
  const t = { ...table, [home]: { ...table[home] }, [away]: { ...table[away] } };
  const h = t[home], a = t[away];
  h.p++; a.p++; h.gf += hg; h.ga += ag; a.gf += ag; a.ga += hg;
  if (hg > ag) { h.w++; h.pts += 3; a.l++; }
  else if (hg < ag) { a.w++; a.pts += 3; h.l++; }
  else { h.d++; a.d++; h.pts++; a.pts++; }
  return t;
}
function sortedTable(table) {
  return Object.values(table).sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf || x.club.localeCompare(y.club));
}
// Merit-based summer budget bonus, driven by final league position.
// Champion (#1) gets 115M; smooth exponential decay down to a ~17M floor
// for finishing dead last, echoing how real PL merit/TV money scales.
function seasonEndBonus(position) {
  const f = Math.exp(-(position - 1) / 5);
  return Math.round((15 + 100 * f) * 10) / 10;
}
function ordinal(n) {
  const s = ["th", "st", "nd", "rd"];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
// Market value computed live from current rating (mirrors the original data-generation
// formula), so edited ratings immediately produce accurate transfer prices. Capped at
// £400M so pushing a rating to the extreme (e.g. 99) doesn't produce an absurd number.
function marketValue(rating, pos, cat) {
  let v = 0.3 * Math.pow(1.23, rating - 60);
  if (pos === "GK") v *= 0.65;
  else if (cat === "ATT") v *= 1.15;
  else if (cat === "DEF") v *= 0.9;
  return Math.min(400, Math.round(v * 10) / 10);
}

function LineupEditor({ club, roster, formation, setFormation, slots, setSlots, accent = COLORS.amber }) {
  const [activeSlot, setActiveSlot] = useState(null);
  const slotDefs = FORMATIONS[formation];
  const usedIds = new Set(Object.values(slots).filter(Boolean));

  function changeFormation(f) {
    const ids = new Set(FORMATIONS[f].map((s) => s.id));
    const carried = {};
    Object.entries(slots).forEach(([id, pid]) => { if (ids.has(id)) carried[id] = pid; });
    setFormation(f);
    setSlots(carried);
    setActiveSlot(null);
  }
  function assign(slotId, playerId) {
    setSlots((prev) => {
      const next = { ...prev };
      if (playerId == null) delete next[slotId]; else next[slotId] = playerId;
      return next;
    });
  }
  function eligiblePlayers(slotPos) {
    const cat = POS_CAT[slotPos];
    return roster
      .filter((p) => p.cat === cat || p.positions.includes(slotPos))
      .sort((a, b) => (b.positions.includes(slotPos) - a.positions.includes(slotPos)) || b.rating - a.rating);
  }
  function autoFill() {
    setSlots(pickBestXI(roster, formation));
    setActiveSlot(null);
  }

  const picked = Object.values(slots).filter(Boolean).map((id) => roster.find((p) => p.id === id)).filter(Boolean);
  const preview = statsFromPicked(picked);
  const overall = picked.length ? round1(picked.reduce((a, b) => a + b.rating, 0) / picked.length) : 0;
  const filledCount = picked.length;
  const activeSlotDef = activeSlot ? slotDefs.find((s) => s.id === activeSlot) : null;

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap gap-2">
        {Object.keys(FORMATIONS).map((f) => <Pill key={f} active={formation === f} onClick={() => changeFormation(f)}>{f}</Pill>)}
      </div>

      <div className="rounded-2xl p-3" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}` }}>
        <div className="relative w-full rounded-xl overflow-hidden" style={{ backgroundColor: COLORS.pitch, aspectRatio: "3 / 4" }}>
          <div className="absolute inset-3 rounded-sm" style={{ border: `1px solid ${COLORS.pitchLine}` }} />
          <div className="absolute left-3 right-3 top-1/2 border-t" style={{ borderColor: COLORS.pitchLine }} />
          <div className="absolute rounded-full" style={{ width: "22%", aspectRatio: "1/1", left: "50%", top: "50%", transform: "translate(-50%,-50%)", border: `1px solid ${COLORS.pitchLine}` }} />
          <div className="absolute left-1/2 top-3 -translate-x-1/2 w-1/2 h-[10%] border" style={{ borderColor: COLORS.pitchLine, borderTop: "none" }} />
          <div className="absolute left-1/2 bottom-3 -translate-x-1/2 w-1/2 h-[10%] border" style={{ borderColor: COLORS.pitchLine, borderBottom: "none" }} />

          {slotDefs.map((s) => {
            const player = slots[s.id] ? roster.find((p) => p.id === slots[s.id]) : null;
            const isActive = activeSlot === s.id;
            return (
              <button
                key={s.id}
                onClick={() => setActiveSlot(isActive ? null : s.id)}
                className="absolute flex flex-col items-center"
                style={{ left: `${s.x}%`, top: `${s.y}%`, transform: "translate(-50%,-50%)" }}
              >
                <div className="rounded-full flex items-center justify-center fe-mono font-bold text-[11px]"
                  style={{
                    width: 36, height: 36,
                    backgroundColor: isActive ? COLORS.chalk : player ? accent : "rgba(242,245,240,0.12)",
                    color: isActive ? COLORS.bg : player ? COLORS.bg : COLORS.sage,
                    border: `2px solid ${isActive ? COLORS.chalk : player ? accent : COLORS.pitchLine}`,
                    boxShadow: isActive ? `0 0 0 4px rgba(242,245,240,0.25)` : "none",
                  }}>
                  {player ? player.rating : s.pos}
                </div>
                <span className="fe-mono text-[8px] mt-0.5 whitespace-nowrap" style={{ color: COLORS.sage, maxWidth: 58, overflow: "hidden", textOverflow: "ellipsis" }}>
                  {player ? player.name.split(" ").slice(-1)[0] : s.pos}
                </span>
              </button>
            );
          })}
        </div>
      </div>

      {activeSlotDef && (
        <div className="rounded-2xl p-3" style={{ backgroundColor: COLORS.panelLight, border: `1px solid ${COLORS.line}` }}>
          <div className="flex items-center justify-between mb-2">
            <span className="fe-mono text-xs tracking-widest" style={{ color: COLORS.amber }}>SELECT {activeSlotDef.pos}</span>
            <button onClick={() => setActiveSlot(null)}><X size={16} color={COLORS.sage} /></button>
          </div>
          {slots[activeSlot] && (
            <button onClick={() => { assign(activeSlot, null); setActiveSlot(null); }}
              className="w-full text-left fe-mono text-xs py-2 px-3 rounded-lg mb-1 flex items-center gap-2"
              style={{ color: COLORS.clay, border: `1px solid ${COLORS.line}` }}>
              <X size={13} /> Remove from lineup
            </button>
          )}
          <div className="max-h-64 overflow-y-auto space-y-1 pr-1">
            {eligiblePlayers(activeSlotDef.pos).map((p) => {
              const taken = usedIds.has(p.id) && slots[activeSlot] !== p.id;
              const isThis = slots[activeSlot] === p.id;
              return (
                <button key={p.id} disabled={taken} onClick={() => { assign(activeSlot, p.id); setActiveSlot(null); }}
                  className="w-full flex justify-between items-center fe-mono text-xs py-2 px-3 rounded-lg"
                  style={{
                    backgroundColor: isThis ? COLORS.amber : COLORS.panel,
                    color: isThis ? COLORS.bg : taken ? COLORS.sage : COLORS.chalk,
                    opacity: taken ? 0.45 : 1,
                  }}>
                  <span className="flex items-center gap-2 truncate pr-2">
                    {isThis && <Check size={12} />}
                    <span className="truncate">{p.name}</span>
                    <span style={{ opacity: 0.6 }}>({p.positions.join("/")})</span>

                  <span className="shrink-0">{p.rating}{taken ? " · used" : ""}</span>
                </button>
              );
            })}
          </div>
        </div>
      )}

      <div className="flex gap-2 justify-center flex-wrap">
        <StatPill label="ATT" value={preview.att || "–"} />
        <StatPill label="MID" value={preview.mid || "–"} />

      </div>
      <div className="text-center fe-mono text-xs" style={{ color: filledCount === 11 ? COLORS.amber : COLORS.sage }}>
        {filledCount}/11 selected {filledCount < 7 && "— fill at least 7 to use this XI in simulations"}
      </div>

      <div className="flex gap-3">
        <button onClick={autoFill} className="flex-1 rounded-xl py-3 fe-display text-lg flex items-center justify-center gap-2"
          style={{ backgroundColor: "transparent", color: COLORS.chalk, border: `2px solid ${COLORS.sage}` }}>
          <Wand2 size={18} /> AUTO-FILL BEST XI
        </button>
      </div>
    </div>
  );
}

function ClubPicker({ players, onPick }) {
  const clubAvg = (club) => {
    const r = players.filter((p) => p.club === club).map((p) => p.rating);
    return r.reduce((a, b) => a + b, 0) / r.length;
  };
  const budgetFor = (avg) => Math.max(10, Math.round(10 + (avg - 70) * 8));
  const rows = CLUBS.map((c) => ({ club: c, avg: round1(clubAvg(c)), budget: budgetFor(clubAvg(c)) })).sort((a, b) => b.avg - a.avg);

  return (
    <div className="space-y-3">
      <div className="fe-mono text-xs" style={{ color: COLORS.sage }}>Pick a club to manage. Your goal: win the Premier League. Multiple seasons, transfer windows, and a real budget.</div>
      <div className="space-y-2">
        {rows.map((r) => (
          <button key={r.club} onClick={() => onPick(r.club)}
            className="w-full flex items-center justify-between rounded-xl px-4 py-3"
            style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}` }}>
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-full flex items-center justify-center fe-display text-sm" style={{ backgroundColor: COLORS.amber, color: COLORS.bg }}>
                {r.club.split(" ").map((w) => w[0]).slice(0, 2).join("")}
              </div>
              <span className="fe-display text-lg" style={{ color: COLORS.chalk }}>{r.club.toUpperCase()}</span>
            </div>
            <div className="text-right fe-mono text-xs">
              <div style={{ color: COLORS.sage }}>SQUAD {r.avg}</div>
              <div style={{ color: COLORS.amber }}>£{r.budget}M</div>

          </button>

      </div>
    </div>
  );
}

function TransferMarket({ players, setPlayers, career, setCareer, customSquads, setCustomSquads }) {
  const [mode, setMode] = useState("buy");
  const [query, setQuery] = useState("");
  const [posFilter, setPosFilter] = useState("ALL");

  const buyList = useMemo(() => {
    return players
      .filter((p) => p.club !== career.club && p.club !== "Free Agent")
      .filter((p) => posFilter === "ALL" || p.cat === posFilter)
      .filter((p) => p.name.toLowerCase().includes(query.toLowerCase()))
      .sort((a, b) => b.rating - a.rating)
      .slice(0, 60);
  }, [players, career.club, posFilter, query]);

  const sellList = useMemo(() => {
    return players
      .filter((p) => p.club === career.club)
      .filter((p) => posFilter === "ALL" || p.cat === posFilter)
      .filter((p) => p.name.toLowerCase().includes(query.toLowerCase()))
      .sort((a, b) => b.rating - a.rating);
  }, [players, career.club, posFilter, query]);

  function buy(p) {
    const price = marketValue(p.rating, p.pos, p.cat);
    if (career.budget < price) return;
    setPlayers((prev) => prev.map((x) => (x.id === p.id ? { ...x, club: career.club } : x)));
    setCareer((prev) => ({ ...prev, budget: round1(prev.budget - price) }));
  }
  function sell(p) {
    const mySquadSize = players.filter((x) => x.club === career.club).length;
    if (mySquadSize <= 11) return; // safeguard: keep enough to field a team
    const sellPrice = round1(marketValue(p.rating, p.pos, p.cat) * 0.85);
    setPlayers((prev) => prev.map((x) => (x.id === p.id ? { ...x, club: "Free Agent" } : x)));
    setCareer((prev) => ({ ...prev, budget: round1(prev.budget + sellPrice) }));
    // clean up any lineup slot referencing the sold player
    setCustomSquads((prev) => {
      const cs = prev[career.club];
      if (!cs) return prev;
      const slots = { ...cs.slots };
      let changed = false;
      Object.entries(slots).forEach(([slotId, pid]) => { if (pid === p.id) { delete slots[slotId]; changed = true; } });
      if (!changed) return prev;
      return { ...prev, [career.club]: { ...cs, slots } };
    });
  }

  return (
    <div className="space-y-3">
      <div className="flex gap-2">
        <Pill active={mode === "buy"} onClick={() => setMode("buy")}>BUY</Pill>
        <Pill active={mode === "sell"} onClick={() => setMode("sell")}>SELL</Pill>
      </div>
      <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search player…"
        className="w-full fe-mono text-sm rounded-lg px-3 py-2 outline-none" style={{ backgroundColor: COLORS.panelLight, color: COLORS.chalk, border: `1px solid ${COLORS.line}` }} />
      <div className="flex gap-2 flex-wrap">
        {["ALL", "DEF", "MID", "ATT"].map((c) => <Pill key={c} active={posFilter === c} onClick={() => setPosFilter(c)}>{c}</Pill>)}
      </div>
      <div className="rounded-2xl overflow-hidden max-h-[28rem] overflow-y-auto" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}` }}>
        {(mode === "buy" ? buyList : sellList).map((p) => (
          <div key={p.id} className="flex items-center justify-between px-4 py-2.5 fe-mono text-xs" style={{ borderBottom: `1px solid ${COLORS.line}` }}>
            <div className="min-w-0 pr-2">
              <div className="truncate" style={{ color: COLORS.chalk }}>{p.name} <span style={{ color: COLORS.sage }}>{p.pos}</span></div>
              <div style={{ color: COLORS.sage }}>{mode === "buy" ? p.club : "Rating " + p.rating}</div>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              <span style={{ color: COLORS.amber }}>£{mode === "buy" ? marketValue(p.rating, p.pos, p.cat) : round1(marketValue(p.rating, p.pos, p.cat) * 0.85)}M</span>
              {mode === "buy" ? (
                <button onClick={() => buy(p)} disabled={career.budget < marketValue(p.rating, p.pos, p.cat)}
                  className="rounded-full px-3 py-1.5 flex items-center gap-1"
                  style={{ backgroundColor: career.budget < marketValue(p.rating, p.pos, p.cat) ? "transparent" : COLORS.amber, color: career.budget < marketValue(p.rating, p.pos, p.cat) ? COLORS.sage : COLORS.bg, border: `1px solid ${career.budget < marketValue(p.rating, p.pos, p.cat) ? COLORS.line : COLORS.amber}` }}>
                  <ShoppingCart size={12} /> Buy
                </button>
              ) : (
                <button onClick={() => sell(p)} className="rounded-full px-3 py-1.5 flex items-center gap-1" style={{ backgroundColor: "transparent", color: COLORS.clay, border: `1px solid ${COLORS.clay}` }}>
                  <X size={12} /> Sell
                </button>
              )}
            </div>
          </div>
        ))}
        {(mode === "buy" ? buyList : sellList).length === 0 && <div className="p-4 fe-mono text-xs text-center" style={{ color: COLORS.sage }}>No players match.</div>}
      </div>
    </div>
  );
}

function CareerPlayTab({ players, career, setCareer, customSquads, setHistory }) {
  const [lastResults, setLastResults] = useState(null);
  const mw = career.matchweek; // 0..38 completed
  const nextFixtures = career.fixtures[mw] || [];
  const isSeasonOver = mw >= 38;

  function playMatchweek() {
    if (career.phase !== "season") return;
    const results = nextFixtures.map((f) => {
      const h = teamStats(f.home, players, customSquads);
      const a = teamStats(f.away, players, customSquads);
      const r = simulateMatch(h, a);
      return { season: career.season, mw: mw + 1, home: f.home, away: f.away, hg: r.homeGoals, ag: r.awayGoals };
    });
    let table = career.table;
    results.forEach((r) => { table = applyResult(table, r.home, r.away, r.hg, r.ag); });
    const newMw = mw + 1;
    const finishedSeason = newMw >= 38;
    setCareer((prev) => ({
      ...prev,
      table,
      matchweek: newMw,
      phase: finishedSeason ? "finished" : newMw === 19 ? "window" : "season",
      windowType: finishedSeason ? "summer" : newMw === 19 ? "january" : prev.windowType,
    }));
    setHistory((prev) => [...prev, ...results]);
    setLastResults(results);
  }

  const myMatch = nextFixtures.find((f) => f.home === career.club || f.away === career.club);

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-3 gap-2">
        <StatPill label="SEASON" value={career.season} />
        <StatPill label="MATCHWEEK" value={`${mw}/38`} />
        <StatPill label="BUDGET" value={`£${career.budget}M`} />
      </div>

      {career.phase === "season" && !isSeasonOver && (
        <>
          {myMatch && (
            <div className="rounded-2xl p-4 text-center" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}` }}>
              <div className="fe-mono text-[10px] tracking-widest mb-2" style={{ color: COLORS.sage }}>MATCHWEEK {mw + 1} — YOUR FIXTURE</div>
              <div className="fe-display text-2xl" style={{ color: COLORS.chalk }}>
                <span style={{ color: myMatch.home === career.club ? COLORS.amber : COLORS.chalk }}>{myMatch.home}</span>
                <span className="mx-2" style={{ color: COLORS.sage }}>vs</span>
                <span style={{ color: myMatch.away === career.club ? COLORS.amber : COLORS.chalk }}>{myMatch.away}</span>
              </div>
            </div>
          )}
          <button onClick={playMatchweek} className="w-full rounded-xl py-3 fe-display text-lg flex items-center justify-center gap-2" style={{ backgroundColor: COLORS.amber, color: COLORS.bg }}>
            <Play size={18} /> SIMULATE MATCHWEEK {mw + 1}
          </button>
        </>
      )}

      {career.phase === "window" && !(career.windowType === "summer" && mw >= 38) && (
        <div className="rounded-2xl p-4 text-center space-y-2" style={{ backgroundColor: COLORS.panelLight, border: `1px solid ${COLORS.amber}` }}>
          <div className="fe-display text-xl" style={{ color: COLORS.amber }}>
            {career.windowType === "january" ? "JANUARY TRANSFER WINDOW" : "PRESEASON TRANSFER WINDOW"}
          </div>
          <div className="fe-mono text-xs" style={{ color: COLORS.sage }}>Buy or sell in the Transfers tab, set your tactics in Lineup, then continue.</div>
          <button onClick={() => setCareer((prev) => ({ ...prev, phase: "season" }))}
            className="w-full rounded-xl py-3 fe-display text-lg mt-2" style={{ backgroundColor: COLORS.amber, color: COLORS.bg }}>
            {career.windowType === "preseason" ? "KICK OFF SEASON" : "CONTINUE SEASON"}
          </button>
        </div>
      )}

      {career.phase === "window" && career.windowType === "summer" && mw >= 38 && (
        <div className="rounded-2xl p-4 text-center space-y-1" style={{ backgroundColor: COLORS.panelLight, border: `1px solid ${COLORS.amber}` }}>
          <div className="fe-display text-xl" style={{ color: COLORS.amber }}>SUMMER TRANSFER WINDOW</div>
          {career.lastBonus && (
            <div className="fe-mono text-xs" style={{ color: COLORS.chalk }}>
              Finished {ordinal(career.lastBonus.position)} — merit bonus: <span style={{ color: COLORS.amber }}>+£{career.lastBonus.bonus}M</span>
            </div>
          )}
          <div className="fe-mono text-xs" style={{ color: COLORS.sage }}>
            Buy or sell in Transfers, set tactics in Lineup, then use "START SEASON {career.season + 1}" above when ready.
          </div>
        </div>
      )}

      {career.phase === "finished" && (
        <div className="rounded-2xl p-5 text-center space-y-3" style={{ backgroundColor: COLORS.panelLight, border: `1px solid ${COLORS.amber}` }}>
          {sortedTable(career.table)[0].club === career.club ? (
            <>
              <Trophy size={40} color={COLORS.amber} className="mx-auto" />
              <div className="fe-display text-2xl" style={{ color: COLORS.amber }}>CHAMPIONS!</div>
              <div className="fe-mono text-xs" style={{ color: COLORS.chalk }}>{career.club} won the Premier League — Season {career.season}</div>
            </>
          ) : (
            <>
              <div className="fe-display text-2xl" style={{ color: COLORS.chalk }}>SEASON {career.season} COMPLETE</div>
              <div className="fe-mono text-xs" style={{ color: COLORS.sage }}>
                {career.club} finished {ordinal(sortedTable(career.table).findIndex((r) => r.club === career.club) + 1)}
              </div>
            </>
          )}
          <button onClick={() => {
              const position = sortedTable(career.table).findIndex((r) => r.club === career.club) + 1;
              const bonus = seasonEndBonus(position);
              setCareer((prev) => ({ ...prev, phase: "window", windowType: "summer", budget: round1(prev.budget + bonus), lastBonus: { position, bonus } }));
            }}
            className="w-full rounded-xl py-3 fe-display text-lg" style={{ backgroundColor: COLORS.amber, color: COLORS.bg }}>
            ENTER SUMMER WINDOW
          </button>
        </div>
      )}

      {lastResults && (
        <div className="rounded-2xl p-4" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}` }}>
          <div className="fe-mono text-[10px] tracking-widest mb-2" style={{ color: COLORS.sage }}>MATCHWEEK {lastResults[0].mw} RESULTS</div>
          <div className="space-y-1">
            {lastResults.map((r, i) => (
              <div key={i} className="flex items-center justify-between fe-mono text-xs py-1">
                <span className="truncate flex-1 text-right pr-2" style={{ color: r.home === career.club ? COLORS.amber : COLORS.chalk }}>{r.home}</span>
                <span style={{ color: COLORS.chalk }} className="px-1">{r.hg}–{r.ag}</span>
                <span className="truncate flex-1 pl-2" style={{ color: r.away === career.club ? COLORS.amber : COLORS.chalk }}>{r.away}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function CareerTab({ players, setPlayers, career, setCareer, customSquads, setCustomSquads, history, setHistory, startCareer }) {
  const [sub, setSub] = useState("play");

  if (!career) {
    return <ClubPicker players={players} onPick={startCareer} />;
  }

  function startNewSeason() {
    const fixtures = generateFixtures(CLUBS);
    setCareer((prev) => ({
      ...prev,
      season: prev.season + 1,
      matchweek: 0,
      phase: "season",
      windowType: "preseason",
      table: initTable(CLUBS),
      fixtures,
      lastBonus: null,
    }));
  }

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <span className="fe-display text-2xl" style={{ color: COLORS.chalk }}>{career.club.toUpperCase()}</span>
        <span className="fe-mono text-xs" style={{ color: COLORS.amber }}>£{career.budget}M</span>
      </div>
      <div className="flex gap-2 flex-wrap">
        <Pill active={sub === "play"} onClick={() => setSub("play")}><Play size={11} className="inline mr-1" />PLAY</Pill>
        <Pill active={sub === "table"} onClick={() => setSub("table")}><Table2 size={11} className="inline mr-1" />TABLE</Pill>
        <Pill active={sub === "history"} onClick={() => setSub("history")}><History size={11} className="inline mr-1" />HISTORY</Pill>
        <Pill active={sub === "transfers"} onClick={() => setSub("transfers")}><Wallet size={11} className="inline mr-1" />TRANSFERS</Pill>
        <Pill active={sub === "lineup"} onClick={() => setSub("lineup")}><Users size={11} className="inline mr-1" />LINEUP</Pill>
      </div>

      {sub === "play" && career.phase === "window" && career.windowType === "summer" && career.matchweek >= 38 && (
        <button onClick={startNewSeason} className="w-full rounded-xl py-3 fe-display text-lg flex items-center justify-center gap-2" style={{ backgroundColor: COLORS.amber, color: COLORS.bg }}>
          <Trophy size={18} /> START SEASON {career.season + 1}
        </button>
      )}

      {sub === "play" && <CareerPlayTab players={players} career={career} setCareer={setCareer} customSquads={customSquads} setHistory={setHistory} />}
      {sub === "table" && <LeagueTable table={career.table} myClub={career.club} />}
      {sub === "history" && <MatchHistory history={history} myClub={career.club} />}
      {sub === "transfers" && (
        career.phase === "window"
          ? <TransferMarket players={players} setPlayers={setPlayers} career={career} setCareer={setCareer} customSquads={customSquads} setCustomSquads={setCustomSquads} />
          : <div className="rounded-2xl p-4 text-center fe-mono text-xs" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}`, color: COLORS.sage }}>
              Transfer window closed. Next window opens after Matchweek {career.matchweek < 19 ? 19 : 38}.
            </div>
      )}
      {sub === "lineup" && <CareerLineupTab players={players} career={career} customSquads={customSquads} setCustomSquads={setCustomSquads} />}
    </div>
  );
}

/* ============================================================
   MAIN APP
   ============================================================ */
function MatchEngine() {
  const [tab, setTab] = useState("career");
  const [players, setPlayers] = useState(BASE_PLAYERS);
  const [customSquads, setCustomSquads] = useState({});
  const [career, setCareer] = useState(null);
  const [history, setHistory] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const value = localStorage.getItem("careerSave");
        const res = value ? { value } : null;
        if (res && res.value) {
          const saved = JSON.parse(res.value);
          if (saved.players) setPlayers(saved.players);
          if (saved.customSquads) setCustomSquads(saved.customSquads);
          if (saved.career) setCareer(saved.career);
          if (saved.history) setHistory(saved.history);
        }
      } catch (e) { /* no save yet */ }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try { localStorage.setItem("careerSave", JSON.stringify({ players, customSquads, career, history })); }
      catch (e) { /* ignore save failure */ }
    })();
  }, [players, customSquads, career, history, loaded]);

  function startCareer(club) {
    const avg = players.filter((p) => p.club === club).map((p) => p.rating).reduce((a, b) => a + b, 0) / players.filter((p) => p.club === club).length;
    const budget = Math.max(10, Math.round(10 + (avg - 70) * 8));
    setCareer({
      club, season: 1, matchweek: 0, phase: "window", windowType: "preseason",
      budget, table: initTable(CLUBS), fixtures: generateFixtures(CLUBS),
    });
    setHistory([]);
  }

  if (!loaded) return <div style={{ backgroundColor: COLORS.bg, minHeight: "100vh" }} />;

  return (
    <div className="fe-body min-h-screen w-full" style={{ backgroundColor: COLORS.bg }}>
      <style>{fontImport}</style>
      <div className="px-5 pt-8 pb-4 relative overflow-hidden" style={{ background: `radial-gradient(circle at 50% 120%, ${COLORS.panelLight} 0%, ${COLORS.bg} 60%)`, borderBottom: `1px solid ${COLORS.line}` }}>
        <div className="max-w-3xl mx-auto">
          <div className="fe-mono text-xs tracking-[0.3em]" style={{ color: COLORS.amber }}>PREMIER LEAGUE · 2026/27</div>
          <h1 className="fe-display text-4xl md:text-5xl" style={{ color: COLORS.chalk }}>MATCH ENGINE</h1>
          <p className="fe-body text-sm mt-1" style={{ color: COLORS.sage }}>Manage a club through a career, or test any matchup head to head.</p>
          <div className="flex gap-2 mt-4 flex-wrap">
            <Pill active={tab === "career"} onClick={() => setTab("career")}><Trophy size={12} className="inline mr-1" />CAREER</Pill>
            <Pill active={tab === "sim"} onClick={() => setTab("sim")}><Swords size={12} className="inline mr-1" />QUICK SIM</Pill>
            <Pill active={tab === "builder"} onClick={() => setTab("builder")}><Users size={12} className="inline mr-1" />SQUAD BUILDER</Pill>
          </div>
        </div>
      </div>

      <div className="max-w-3xl mx-auto px-5 py-6">
        {tab === "career" && (
          <CareerTab players={players} setPlayers={setPlayers} career={career} setCareer={setCareer}
            customSquads={customSquads} setCustomSquads={setCustomSquads} history={history} setHistory={setHistory} startCareer={startCareer} />
        )}
        {tab === "sim" && <QuickSimTab players={players} customSquads={customSquads} />}
        {tab === "builder" && <SquadBuilderTab players={players} customSquads={customSquads} setCustomSquads={setCustomSquads} />}

      </div>
    </div>
  );
}


    createRoot(document.getElementById("root")).render(<MatchEngine />);
  </script>
</body>
